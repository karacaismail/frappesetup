name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      visual_baseline:
        description: 'Görsel referansları Linux ortamında üret ve artifact olarak yükle (yayın yapılmaz)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Yayın kuyruğu yalnız main'de ortaktır: dal üzerindeki elle koşular bekleyen bir main dağıtımını iptal ettiremez.
  group: ${{ github.ref == 'refs/heads/main' && !inputs.visual_baseline && 'pages' || format('gate-{0}', github.ref) }}
  cancel-in-progress: false

# Akış: press-ai ve dist paralel → e2e (4 parça, aynı dist) → build (toplayıcı, Pages artifact'ı) → deploy.
# Pages artifact'ı yalnız bütün testler geçince ve test edilen aynı dist'ten yüklenir.
# visual_baseline kipinde yalnız visual-baseline işi koşar.
jobs:
  comment-language:
    if: ${{ !inputs.visual_baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the previous commit and the merge base are available.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: comment-language tests
        run: npm run test:comments

      # A push is compared with the previous commit. When that commit is gone
      # (a force-push), main checks at least its last commit. Other refs are
      # compared with the merge base of origin/main.
      - name: New comments are in English (changed lines only)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            npm run lint:comments -- --base "$BEFORE"
          elif [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "::warning::The previous commit is not available. Only the last commit is checked."
            npm run lint:comments -- --base HEAD^
          else
            npm run lint:comments -- --merge-base-with origin/main
          fi

  press-ai:
    if: ${{ !inputs.visual_baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # packages/press-ai: yalnız stdlib; koşucunun python3'ü yeterli. pressguide verisi gerekmez (o alt denetim atlanır).
      - name: press-ai gate (unittest + contract check)
        run: |
          python3 --version
          python3 -I -m unittest discover -s packages/press-ai/tests
          python3 -I packages/press-ai/server.py check-contract
      # Jenkins dağıtım hattının sürüm ve sunucu betiği testleri (backend/deploy). Yalnız stdlib ve GNU araçları.
      - name: deploy gate (release manifest + remote scripts)
        run: python3 -I -m unittest discover -s backend/deploy/tests -v
      # Turkish code comment counter: fails when a folder has more Turkish comments than the baseline.
      - name: Turkish comment gate (count must not exceed the baseline)
        run: python3 -I -m unittest discover -s tests -p test_turkish_comments.py -v

  dist:
    if: ${{ !inputs.visual_baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Bütün parçalar ve Pages aynı derleme çıktısını kullanır.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    needs: dist
    # Görsel referanslar bu koşucu imajına bağlıdır (tests/__screenshots__); ubuntu-latest etiketi
    # 19 Ekim 2026'dan itibaren Ubuntu 26'ya geçer. Etiket değişirse referanslar yeniden üretilip onaylanır.
    runs-on: ubuntu-24.04
    # Ölçülen parça süresi (önbellekli) yaklaşık 5 dk; önbelleksiz apt kurulumu için pay bırakılır.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: ./.github/actions/playwright-browsers
      - name: Marka ayarı ve diyagram kontrolü
        if: matrix.shard == 1
        run: npm run test:brand-build
      - name: Playwright gate (Chromium, WebKit, iPhone 13 × 320–1366), parça ${{ matrix.shard }}/4
        env:
          PW_BLOB: '1'
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  build:
    name: Build and test
    needs: [comment-language, press-ai, dist, e2e]
    if: ${{ always() && !inputs.visual_baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports/
          merge-multiple: true
      - name: Merge Playwright reports
        run: |
          if compgen -G 'all-blob-reports/*.zip' > /dev/null; then
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "Birleştirilecek blob raporu yok."
          fi
      # Rapor her koşuda saklanır (başarılı koşunun kanıtı da paylaşılabilir olsun).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Bütün işler geçti mi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "comment-language, press-ai, dist, e2e: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Bir iş başarısız, iptal ya da atlandı: $r"
              exit 1
            fi
          done
      # Aşağıdaki adımlar yalnız yukarıdaki denetim geçerse koşar; test edilen dist yayımlanır.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          name: dist
          path: dist/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: ${{ github.ref == 'refs/heads/main' && !inputs.visual_baseline }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ github.ref == 'refs/heads/main' && !inputs.visual_baseline }}
        with:
          path: dist

  visual-baseline:
    if: ${{ inputs.visual_baseline }}
    # Referanslar yalnız bu koşucu imajında üretilir (tests/__screenshots__).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/playwright-browsers
      - name: Visual baselines (yalnız elle tetiklenince; inceleme sonrası commit edilir)
        run: npx playwright test tests/visual.spec.ts --update-snapshots=all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/__screenshots__/
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    name: Deploy
    needs: build
    # Yalnız main'den ve referans üretim modu dışında yayın yapılır; dal üzerinde elle tetikleme yalnız kapıyı koşar.
    if: ${{ github.ref == 'refs/heads/main' && !inputs.visual_baseline }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
