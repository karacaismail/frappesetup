name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Akış: press-ai ve build paralel → e2e (4 parça, aynı dist) → build-and-test (toplayıcı).
# ProPR kapısı `build-and-test` denetimini bekler; bu iş yalnız bütün işler geçince yeşil olur.
jobs:
  press-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # packages/press-ai: yalnız stdlib; koşucunun python3'ü yeterli. pressguide verisi gerekmez (o alt denetim atlanır).
      - name: press-ai gate (unittest + contract check)
        run: |
          python3 --version
          python3 -I -m unittest discover -s packages/press-ai/tests
          python3 -I packages/press-ai/server.py check-contract
      # Jenkins dağıtım hattının sürüm ve sunucu betiği testleri (backend/deploy). Yalnız stdlib ve GNU araçları.
      - name: deploy gate (release manifest + remote scripts)
        run: python3 -I -m unittest discover -s backend/deploy/tests -v

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Bütün parçalar aynı derleme çıktısını test eder.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    needs: build
    # Görsel referanslar bu koşucu imajına bağlıdır (tests/__screenshots__); ubuntu-latest etiketi
    # 19 Ekim 2026'dan itibaren Ubuntu 26'ya geçer. Etiket değişirse referanslar yeniden üretilip onaylanır.
    runs-on: ubuntu-24.04
    # Ölçülen parça süresi (önbellekli) yaklaşık 5 dk; önbelleksiz apt kurulumu için pay bırakılır.
    timeout-minutes: 20
    strategy:
      # Bir parça düşse de diğerleri biter; rapor eksiksiz olur.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: ./.github/actions/playwright-browsers
      - name: Marka ayarı ve diyagram kontrolü
        if: matrix.shard == 1
        run: npm run test:brand-build
      - name: Playwright gate (Chromium, Firefox, WebKit, iPhone 13 × 320–1366), parça ${{ matrix.shard }}/4
        env:
          PW_BLOB: '1'
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  build-and-test:
    needs: [press-ai, build, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports/
          merge-multiple: true
      - name: Merge Playwright reports
        run: |
          if compgen -G 'all-blob-reports/*.zip' > /dev/null; then
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "Birleştirilecek blob raporu yok."
          fi
      # Rapor her koşuda saklanır (başarılı koşunun kanıtı da paylaşılabilir olsun).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Bütün işler geçti mi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "press-ai, build, e2e: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Bir iş başarısız, iptal ya da atlandı: $r"
              exit 1
            fi
          done
