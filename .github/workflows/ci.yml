name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Görsel referanslar bu koşucu imajına bağlıdır (tests/__screenshots__); ubuntu-latest etiketi
    # 19 Ekim 2026'dan itibaren Ubuntu 26'ya geçer. Etiket değişirse referanslar yeniden üretilip onaylanır.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright gate (Chromium, Firefox, WebKit, iPhone 13 × 320–1366)
        run: npx playwright test
      # Rapor her koşuda saklanır (başarılı koşunun kanıtı da paylaşılabilir olsun).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
