name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Akış: backend kapıları, press-ai ve build paralel → e2e (4 parça, aynı dist) → build-and-test (toplayıcı).
# ProPR kapısı `build-and-test` denetimini bekler; bu iş yalnız bütün işler geçince yeşil olur.
# Kapı listesi `.github/tests/test_backend_ci.py` içinde denetlenir.
jobs:
  press-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # packages/press-ai: yalnız stdlib; koşucunun python3'ü yeterli. pressguide verisi gerekmez (o alt denetim atlanır).
      - name: press-ai gate (unittest + contract check)
        run: |
          python3 --version
          python3 -I -m unittest discover -s packages/press-ai/tests
          python3 -I packages/press-ai/server.py check-contract

  # hooks.py aynı adı iki kez atamasın; çeviri CSV dosyaları bozuk ya da çakışma izli olmasın.
  backend-shared-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: hooks.py and translation CSV check
        run: python3.14 -B backend/dev/check_shared_files.py

  # check_boundaries.py Python 3.14 sözdizimini okur; sistemdeki eski python3 yanlış ihlal verir.
  backend-module-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Module boundaries
        run: backend/dev/bin/module-boundaries

  backend-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FS_COLIMA_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      # Ağ gerektiren hazırlık burada biter; denetimin kendisi çevrimdışı koşar.
      - name: Prepare offline security tools
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # security-audit bu ref'i karşılaştırma tabanı olarak kullanır.
          git update-ref refs/heads/backend "$BASE_SHA"
          python3.14 -m pip install uv==0.13.9
          source backend/dev/security/tool-versions.env
          uv python install 3.12
          uvx --python 3.12 --exclude-newer "$TOOL_CUTOFF" "bandit@$BANDIT_VERSION" --version
          SEMGREP_ENABLE_VERSION_CHECK=0 uvx --python 3.12 --exclude-newer "$TOOL_CUTOFF" "semgrep@$SEMGREP_VERSION" --version
          docker pull "ghcr.io/gitleaks/gitleaks:v${GITLEAKS_VERSION}@${GITLEAKS_DIGEST}"
          backend/dev/security/osv-setup --if-stale
      - name: Security audit
        env:
          UV_OFFLINE: '1'
        run: backend/dev/bin/security-audit

  backend-ai-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FS_COLIMA_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      # ShellCheck adımı imajı --pull never ile çalıştırır; imaj önceden çekilir.
      - name: Pull ShellCheck image
        run: docker pull "$(python3.14 -B -c 'import sys; sys.path.insert(0, "backend/dev/ai_readiness"); from shellcheck_step import SHELLCHECK_IMAGE; print(SHELLCHECK_IMAGE)')"
      - name: AI readiness
        run: backend/dev/bin/ai-readiness

  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Install backend test dependencies
        run: python3.14 -m pip install -r backend/dev/requirements-contract-tests.txt
      - name: Prepare Docker context for Compose tests
        # test_e2e_stack.py bu adı Linux koşucusunda da kullanır.
        run: docker context create colima-factory --docker host=unix:///var/run/docker.sock
      - name: Backend development tests
        run: python3.14 -B -m unittest discover -s backend/dev/tests
      - name: Naming tests
        run: python3.14 -B -m unittest discover -s backend/dev/naming/tests
      # Jenkins dağıtım hattının sürüm ve sunucu betiği testleri. Yalnız stdlib ve GNU araçları.
      - name: Deploy tests (release manifest + remote scripts)
        run: python3 -I -m unittest discover -s backend/deploy/tests -v
      - name: CI workflow tests
        run: python3.14 -B -m unittest discover -s .github/tests

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Bütün parçalar aynı derleme çıktısını test eder.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    needs: build
    # Görsel referanslar bu koşucu imajına bağlıdır (tests/__screenshots__); ubuntu-latest etiketi
    # 19 Ekim 2026'dan itibaren Ubuntu 26'ya geçer. Etiket değişirse referanslar yeniden üretilip onaylanır.
    runs-on: ubuntu-24.04
    # Ölçülen parça süresi (önbellekli) yaklaşık 5 dk; önbelleksiz apt kurulumu için pay bırakılır.
    timeout-minutes: 20
    strategy:
      # Bir parça düşse de diğerleri biter; rapor eksiksiz olur.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: ./.github/actions/playwright-browsers
      - name: Marka ayarı ve diyagram kontrolü
        if: matrix.shard == 1
        run: npm run test:brand-build
      - name: Playwright gate (Chromium, WebKit, iPhone 13 × 320–1366), parça ${{ matrix.shard }}/4
        env:
          PW_BLOB: '1'
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  build-and-test:
    needs:
      - backend-shared-files
      - backend-module-boundaries
      - backend-security
      - backend-ai-readiness
      - backend-tests
      - press-ai
      - build
      - e2e
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports/
          merge-multiple: true
      - name: Merge Playwright reports
        run: |
          if compgen -G 'all-blob-reports/*.zip' > /dev/null; then
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "Birleştirilecek blob raporu yok."
          fi
      # Rapor her koşuda saklanır (başarılı koşunun kanıtı da paylaşılabilir olsun).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Bütün işler geçti mi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "İş sonuçları: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Bir iş başarısız, iptal ya da atlandı: $r"
              exit 1
            fi
          done
