{
  "openapi": "3.1.0",
  "info": {
    "title": "Platform Core shell API",
    "version": "0.1.0",
    "description": "Read-only shell contract for Frappe 16. Effective permissions are checked for every request. Observed image frappe/erpnext:v16.55.0 contains Frappe 16.56.0 and the new Sidebar model."
  },
  "security": [
    {
      "session": []
    }
  ],
  "paths": {
    "/api/method/platform_core.api.shell.get_bootstrap": {
      "get": {
        "operationId": "getBootstrap",
        "summary": "Read the current user's shell data",
        "description": "Returns the current user, installed applications and native permission-filtered navigation. No manually maintained menu is added.",
        "parameters": [
          {
            "name": "If-None-Match",
            "in": "header",
            "required": false,
            "description": "Previous ETag. Lists, weak validators and * follow conditional GET semantics.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Current authenticated representation.",
            "headers": {
              "ETag": {
                "description": "Opaque, quoted validator scoped to the site, current user, permission version and response.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "description": "Private, no-store. Effective permissions may only be retained in client memory.",
                "schema": {
                  "type": "string"
                }
              },
              "Vary": {
                "description": "Cookie and Authorization separate authenticated representations.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "description": "Frappe v1 method response envelope.",
                  "required": [
                    "message"
                  ],
                  "properties": {
                    "message": {
                      "$ref": "#/components/schemas/Bootstrap"
                    }
                  },
                  "additionalProperties": false
                },
                "example": {
                  "message": {
                    "user": {
                      "name": "sample@example.test",
                      "full_name": "Sample Reader",
                      "language": "tr",
                      "roles": [
                        "Sample Reader"
                      ]
                    },
                    "installed_apps": [
                      "frappe",
                      "platform_core"
                    ],
                    "workspaces": [],
                    "sidebars": [],
                    "formatting": {
                      "time_zone": "Europe/Istanbul",
                      "currency": "TRY",
                      "number_format": "#.###,##",
                      "rounding_method": "Commercial Rounding"
                    },
                    "meta_hash": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                    "perm_version": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                  }
                }
              }
            }
          },
          "304": {
            "description": "The current authorized representation matches If-None-Match. No response body.",
            "headers": {
              "ETag": {
                "description": "Opaque, quoted validator scoped to the site, current user, permission version and response.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "description": "Private, no-store. Effective permissions may only be retained in client memory.",
                "schema": {
                  "type": "string"
                }
              },
              "Vary": {
                "description": "Cookie and Authorization separate authenticated representations.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "403": {
            "description": "Guest, denied permission or unsupported HTTP method.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "exc_type": "PermissionError"
                }
              }
            }
          },
          "401": {
            "description": "Frappe rejected an expired or invalid session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "exc_type": "SessionExpired",
                  "session_expired": 1
                }
              }
            }
          }
        }
      }
    },
    "/api/method/platform_core.api.meta.get_doctype": {
      "get": {
        "operationId": "getDocType",
        "summary": "Read an effective DocType definition",
        "description": "Checks DocType read permission and filters fields for the current user. Includes child schemas reached through readable parent table fields. Authorization is rechecked before 304.",
        "parameters": [
          {
            "name": "doctype",
            "in": "query",
            "required": true,
            "description": "Exact DocType name. A non-empty string of at most 140 characters.",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 140
            }
          },
          {
            "name": "If-None-Match",
            "in": "header",
            "required": false,
            "description": "Previous ETag. Lists, weak validators and * follow conditional GET semantics.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "surface",
            "in": "query",
            "description": "Mobile requests use a site allowlist and never include restricted fields.",
            "schema": {
              "type": "string",
              "enum": [
                "web",
                "mobile"
              ],
              "default": "web"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Current authenticated representation.",
            "headers": {
              "ETag": {
                "description": "Opaque, quoted validator scoped to the site, current user, permission version and response.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "description": "Private, no-store. Effective permissions may only be retained in client memory.",
                "schema": {
                  "type": "string"
                }
              },
              "Vary": {
                "description": "Cookie and Authorization separate authenticated representations.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "description": "Frappe v1 method response envelope.",
                  "required": [
                    "message"
                  ],
                  "properties": {
                    "message": {
                      "$ref": "#/components/schemas/Meta"
                    }
                  },
                  "additionalProperties": false
                },
                "example": {
                  "message": {
                    "schema": {
                      "name": "Sample Record",
                      "module": "Sample",
                      "sensitivity": "standard",
                      "fields": [
                        {
                          "fieldname": "title",
                          "fieldtype": "Data",
                          "read_only": true,
                          "label": "Sample title",
                          "reqd": true,
                          "component": "input",
                          "sensitivity": "standard"
                        }
                      ],
                      "title_field": "title",
                      "search_fields": "title",
                      "sort_field": null
                    },
                    "child_tables": {},
                    "catalog_version": 1,
                    "meta_hash": "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc",
                    "perm_version": "dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"
                  }
                }
              }
            }
          },
          "304": {
            "description": "The current authorized representation matches If-None-Match. No response body.",
            "headers": {
              "ETag": {
                "description": "Opaque, quoted validator scoped to the site, current user, permission version and response.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "description": "Private, no-store. Effective permissions may only be retained in client memory.",
                "schema": {
                  "type": "string"
                }
              },
              "Vary": {
                "description": "Cookie and Authorization separate authenticated representations.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "403": {
            "description": "Guest, unknown or unreadable DocType, a child without parent context, or an unsupported HTTP method. Authorization is rechecked before conditional handling.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "exc_type": "PermissionError"
                }
              }
            }
          },
          "417": {
            "description": "Invalid DocType argument.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Frappe rejected an expired or invalid session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "exc_type": "SessionExpired",
                  "session_expired": 1
                }
              }
            }
          }
        }
      }
    },
    "/panel": {
      "get": {
        "operationId": "getPanel",
        "summary": "Open the authenticated placeholder shell",
        "description": "Serves no frontend application yet. Injects the session-bound CSRF token in an escaped HTML meta element. Server and shared caching are disabled. The token must be sent as X-Frappe-CSRF-Token for writes.",
        "responses": {
          "200": {
            "description": "Authenticated shell. Cache-Control is private, no-store.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "headers": {
              "Vary": {
                "description": "Varies by the session cookie.",
                "schema": {
                  "type": "string"
                }
              },
              "Content-Security-Policy": {
                "description": "Restricts sources to this origin and prevents framing.",
                "schema": {
                  "type": "string"
                }
              },
              "X-Content-Type-Options": {
                "description": "Prevents MIME type sniffing.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "302": {
            "description": "Guest redirect to /login?redirect-to=/panel. No CSRF token is returned.",
            "headers": {
              "Location": {
                "description": "Same-origin login route.",
                "schema": {
                  "type": "string"
                }
              },
              "Vary": {
                "description": "Varies by the session cookie.",
                "schema": {
                  "type": "string"
                }
              },
              "Content-Security-Policy": {
                "description": "Restricts sources to this origin and prevents framing.",
                "schema": {
                  "type": "string"
                }
              },
              "X-Content-Type-Options": {
                "description": "Prevents MIME type sniffing.",
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/api/v2/doctype/{doctype}/meta": {
      "get": {
        "operationId": "getNativeDoctypeMetadata",
        "summary": "Read native metadata as a system user",
        "description": "Platform Core rejects Website Users on the native Frappe endpoint. Website Users must use the permission-filtered shell metadata endpoint.",
        "parameters": [
          {
            "name": "doctype",
            "in": "path",
            "required": true,
            "description": "DocType name.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Frappe metadata for a System User."
          },
          "403": {
            "description": "Native metadata is unavailable to this user."
          }
        }
      }
    },
    "/api/method/frappe.auth.get_logged_user": {
      "get": {
        "operationId": "getLoggedUser",
        "summary": "Check the current Frappe session",
        "description": "Returns the logged-in user. Missing and expired sessions are distinguishable.",
        "responses": {
          "200": {
            "description": "Current user identity.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "message"
                  ],
                  "properties": {
                    "message": {
                      "type": "string",
                      "description": "Current user name."
                    }
                  },
                  "additionalProperties": false
                },
                "example": {
                  "message": "sample@example.test"
                }
              }
            }
          },
          "401": {
            "description": "Expired or invalid session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "exc_type": "SessionExpired",
                  "session_expired": 1
                }
              }
            }
          },
          "403": {
            "description": "Guest request.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "exc_type": "PermissionError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "sid",
        "description": "Host-bound Frappe session cookie. The API never accepts a target user parameter."
      }
    },
    "schemas": {
      "User": {
        "type": "object",
        "description": "Current authenticated user. Values come from the current site.",
        "required": [
          "name",
          "full_name",
          "language",
          "roles"
        ],
        "properties": {
          "name": {
            "type": "string",
            "description": "Frappe user identifier."
          },
          "full_name": {
            "type": "string",
            "description": "Display name."
          },
          "language": {
            "type": "string",
            "description": "Effective request language."
          },
          "roles": {
            "type": "array",
            "description": "Effective roles. This list does not grant record access.",
            "items": {
              "type": "string",
              "description": "Role name."
            }
          }
        },
        "additionalProperties": false
      },
      "Workspace": {
        "type": "object",
        "description": "A visible Workspace, derived by Frappe's native permission checks.",
        "required": [
          "name",
          "title",
          "module",
          "app",
          "parent_page",
          "icon"
        ],
        "properties": {
          "name": {
            "type": "string",
            "description": "Workspace identifier."
          },
          "title": {
            "type": "string",
            "description": "Workspace display title."
          },
          "module": {
            "type": [
              "string",
              "null"
            ],
            "description": "Owning module, when configured."
          },
          "app": {
            "type": [
              "string",
              "null"
            ],
            "description": "Installed application derived by Frappe from the module."
          },
          "parent_page": {
            "type": [
              "string",
              "null"
            ],
            "description": "Visible parent Workspace, otherwise null."
          },
          "icon": {
            "type": [
              "string",
              "null"
            ],
            "description": "Configured icon identifier."
          }
        },
        "additionalProperties": false
      },
      "Sidebar": {
        "type": "object",
        "description": "Permission-filtered native Sidebar. Workspace Sidebar is archival in observed Frappe 16.56.0.",
        "required": [
          "name",
          "data"
        ],
        "properties": {
          "name": {
            "type": "string",
            "description": "Exact sidebar identity."
          },
          "data": {
            "$ref": "#/components/schemas/SidebarData"
          }
        },
        "additionalProperties": false
      },
      "Bootstrap": {
        "type": "object",
        "description": "Initial, read-only shell data. Subscription, branding and frontend rendering are outside this checkpoint.",
        "required": [
          "user",
          "installed_apps",
          "workspaces",
          "sidebars",
          "meta_hash",
          "perm_version",
          "formatting"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "installed_apps": {
            "type": "array",
            "description": "Applications installed on this tenant site.",
            "items": {
              "type": "string",
              "description": "Application name."
            }
          },
          "workspaces": {
            "type": "array",
            "description": "Visible Workspaces. Hidden pages and other users' private pages are excluded.",
            "items": {
              "$ref": "#/components/schemas/Workspace"
            }
          },
          "sidebars": {
            "type": "array",
            "description": "Native, permission-filtered sidebars.",
            "items": {
              "$ref": "#/components/schemas/Sidebar"
            }
          },
          "meta_hash": {
            "type": "string",
            "description": "SHA-256 digest of this bootstrap representation."
          },
          "perm_version": {
            "type": "string",
            "description": "Opaque permission generation. Changes on permission/cache invalidation."
          },
          "formatting": {
            "$ref": "#/components/schemas/Formatting"
          }
        },
        "additionalProperties": false
      },
      "Field": {
        "type": "object",
        "description": "Effective DocField properties from get_meta, including Custom Field and Property Setter. Only readable permission levels remain.",
        "required": [
          "fieldname",
          "fieldtype",
          "read_only",
          "component",
          "sensitivity"
        ],
        "additionalProperties": false,
        "properties": {
          "fieldname": {
            "type": "string",
            "description": "Field name."
          },
          "fieldtype": {
            "type": "string",
            "description": "Native Frappe field type."
          },
          "read_only": {
            "type": "boolean",
            "description": "True when the field is intrinsically read-only or the current user cannot write it."
          },
          "label": {
            "description": "Display label.",
            "type": [
              "string",
              "null"
            ]
          },
          "description": {
            "description": "Field help text.",
            "type": [
              "string",
              "null"
            ]
          },
          "options": {
            "description": "Native field options. Dynamic Link options are omitted when their target-type field is unreadable. Unapproved fields do not carry options or defaults.",
            "type": [
              "string",
              "null"
            ]
          },
          "default": {
            "description": "Configured default. Password defaults are omitted.",
            "type": [
              "string",
              "null"
            ]
          },
          "reqd": {
            "description": "Whether the field is required.",
            "type": "boolean"
          },
          "hidden": {
            "description": "Native hidden UI setting, independent from authorization.",
            "type": "boolean"
          },
          "permlevel": {
            "description": "Permission level.",
            "type": [
              "integer",
              "null"
            ]
          },
          "depends_on": {
            "$ref": "#/components/schemas/FieldCondition"
          },
          "mandatory_depends_on": {
            "$ref": "#/components/schemas/FieldCondition"
          },
          "read_only_depends_on": {
            "$ref": "#/components/schemas/FieldCondition"
          },
          "fetch_from": {
            "description": "Native source field path. Omitted when the local source link field is unreadable.",
            "type": [
              "string",
              "null"
            ]
          },
          "fetch_if_empty": {
            "description": "Fetch only when empty.",
            "type": "boolean"
          },
          "set_only_once": {
            "description": "Native one-time assignment setting.",
            "type": "boolean"
          },
          "unique": {
            "description": "Native uniqueness setting.",
            "type": "boolean"
          },
          "in_list_view": {
            "description": "List display hint.",
            "type": "boolean"
          },
          "in_standard_filter": {
            "description": "Standard filter hint.",
            "type": "boolean"
          },
          "precision": {
            "description": "Configured numeric precision.",
            "type": [
              "string",
              "null"
            ]
          },
          "length": {
            "description": "Configured length.",
            "type": [
              "integer",
              "null"
            ]
          },
          "non_negative": {
            "description": "Reject negative values.",
            "type": "boolean"
          },
          "collapsible": {
            "description": "Layout collapse setting.",
            "type": "boolean"
          },
          "collapsible_depends_on": {
            "$ref": "#/components/schemas/FieldCondition"
          },
          "unsupported_conditions": {
            "type": "array",
            "uniqueItems": true,
            "description": "Condition properties omitted because they are unsupported or refer to unreadable fields. Source expressions are never returned.",
            "items": {
              "type": "string",
              "enum": [
                "depends_on",
                "mandatory_depends_on",
                "read_only_depends_on",
                "collapsible_depends_on"
              ]
            }
          },
          "component": {
            "type": [
              "string",
              "null"
            ],
            "description": "Approved renderer key, or null for an unsupported field type."
          },
          "sensitivity": {
            "$ref": "#/components/schemas/Sensitivity"
          },
          "choices": {
            "type": "array",
            "description": "Select options with original values and translated labels.",
            "items": {
              "$ref": "#/components/schemas/SelectChoice"
            }
          }
        }
      },
      "DocType": {
        "type": "object",
        "description": "Effective schema projection. Raw permission rows, scripts, actions and audit metadata are excluded.",
        "required": [
          "name",
          "module",
          "fields",
          "title_field",
          "search_fields",
          "sort_field",
          "sensitivity"
        ],
        "properties": {
          "name": {
            "type": "string",
            "description": "DocType name."
          },
          "module": {
            "type": [
              "string",
              "null"
            ],
            "description": "Owning module."
          },
          "fields": {
            "type": "array",
            "description": "Readable fields and layout entries in source order.",
            "items": {
              "$ref": "#/components/schemas/Field"
            }
          },
          "title_field": {
            "type": [
              "string",
              "null"
            ],
            "description": "Readable title field, otherwise null."
          },
          "search_fields": {
            "type": "string",
            "description": "Comma-separated readable search fields."
          },
          "sort_field": {
            "type": [
              "string",
              "null"
            ],
            "description": "Readable sort field, otherwise null."
          },
          "sensitivity": {
            "$ref": "#/components/schemas/Sensitivity"
          }
        },
        "additionalProperties": false
      },
      "Meta": {
        "type": "object",
        "description": "User-specific effective schema. Never persist this permission-filtered payload in IndexedDB.",
        "required": [
          "schema",
          "meta_hash",
          "perm_version",
          "child_tables",
          "catalog_version"
        ],
        "properties": {
          "schema": {
            "$ref": "#/components/schemas/DocType"
          },
          "meta_hash": {
            "type": "string",
            "description": "SHA-256 of the permission-filtered parent and child schemas in this response."
          },
          "perm_version": {
            "type": "string",
            "description": "Permission generation scoped to the current user roles."
          },
          "child_tables": {
            "type": "object",
            "description": "Child DocType schemas keyed by name. Only readable parent table fields contribute entries. Child fields inherit parent permission levels.",
            "additionalProperties": {
              "$ref": "#/components/schemas/DocType"
            }
          },
          "catalog_version": {
            "type": "integer",
            "minimum": 1,
            "description": "Version of the approved component catalog."
          }
        },
        "additionalProperties": false
      },
      "Error": {
        "type": "object",
        "description": "Native Frappe error envelope. Developer mode may add diagnostics.",
        "properties": {
          "exc_type": {
            "type": "string",
            "description": "Frappe exception type."
          },
          "_server_messages": {
            "type": "string",
            "description": "Native serialized error messages."
          }
        },
        "additionalProperties": true
      },
      "SidebarData": {
        "type": "object",
        "description": "Navigation returned by the native Frappe Sidebar resolver.",
        "properties": {
          "name": {
            "type": "string",
            "description": "Sidebar identity."
          },
          "module": {
            "type": "string",
            "description": "Module that owns the sidebar."
          },
          "label": {
            "type": "string",
            "description": "Displayed sidebar label."
          },
          "app": {
            "type": [
              "string",
              "null"
            ],
            "description": "Installed application that owns the sidebar."
          },
          "header_icon": {
            "type": [
              "string",
              "null"
            ],
            "description": "Icon displayed beside the sidebar label."
          },
          "module_onboarding": {
            "type": [
              "string",
              "null"
            ],
            "description": "Onboarding reference when the user can open it."
          },
          "customized": {
            "type": [
              "integer",
              "boolean",
              "null"
            ],
            "description": "Whether a site or user customization was applied."
          },
          "computed": {
            "type": [
              "integer",
              "boolean",
              "null"
            ],
            "description": "Whether Frappe derived the items from module contents."
          },
          "workspaces": {
            "type": "array",
            "description": "Workspace names the user can open.",
            "items": {
              "type": "string"
            }
          },
          "items": {
            "type": "array",
            "description": "Navigation rows in display order.",
            "items": {
              "$ref": "#/components/schemas/SidebarItem"
            }
          }
        },
        "additionalProperties": false
      },
      "SidebarItem": {
        "type": "object",
        "description": "A permitted navigation row or a visual divider.",
        "properties": {
          "key": {
            "type": "string",
            "description": "Stable sidebar row identity."
          },
          "label": {
            "type": [
              "string",
              "null"
            ],
            "description": "Translated text displayed for this row."
          },
          "link_to": {
            "type": [
              "string",
              "null"
            ],
            "description": "Name of the linked target."
          },
          "link_type": {
            "type": [
              "string",
              "null"
            ],
            "description": "Target kind such as Workspace, DocType, Report or URL."
          },
          "type": {
            "type": [
              "string",
              "null"
            ],
            "description": "Row kind such as Link, Section Break or Spacer."
          },
          "icon": {
            "type": [
              "string",
              "null"
            ],
            "description": "Icon displayed for this row."
          },
          "child": {
            "type": [
              "integer",
              "boolean",
              "null"
            ],
            "description": "Whether this row belongs to a section."
          },
          "collapsible": {
            "type": [
              "integer",
              "boolean",
              "null"
            ],
            "description": "Whether the section can be collapsed."
          },
          "indent": {
            "type": [
              "integer",
              "null"
            ],
            "description": "Nesting depth for this row."
          },
          "keep_closed": {
            "type": [
              "integer",
              "boolean",
              "null"
            ],
            "description": "Whether the section starts collapsed."
          },
          "url": {
            "type": [
              "string",
              "null"
            ],
            "description": "Same-origin path or URL whose hostname is in the site allowlist. HTTP is allowed only in developer mode."
          },
          "show_arrow": {
            "type": [
              "integer",
              "boolean",
              "null"
            ],
            "description": "Whether the row displays a navigation arrow."
          },
          "filters": {
            "type": [
              "string",
              "array",
              "object",
              "null"
            ],
            "description": "Native filters for the destination."
          },
          "route_options": {
            "type": [
              "string",
              "array",
              "object",
              "null"
            ],
            "description": "Native options for the destination route."
          },
          "tab": {
            "type": [
              "string",
              "null"
            ],
            "description": "Tab to open at the destination."
          },
          "open_in_new_tab": {
            "type": [
              "integer",
              "boolean",
              "null"
            ],
            "description": "Whether the destination should open in a new tab."
          },
          "is_default_module": {
            "type": [
              "integer",
              "boolean",
              "null"
            ],
            "description": "Whether this row points to the default module."
          },
          "hidden": {
            "type": [
              "integer",
              "boolean",
              "null"
            ],
            "description": "Native visibility setting if present."
          },
          "derived": {
            "type": [
              "integer",
              "boolean",
              "null"
            ],
            "description": "Whether Frappe added this row from a Workspace record."
          },
          "report": {
            "type": "object",
            "description": "Route details for an enabled report.",
            "properties": {
              "report_type": {
                "type": [
                  "string",
                  "null"
                ],
                "description": "Frappe report kind."
              },
              "ref_doctype": {
                "type": [
                  "string",
                  "null"
                ],
                "description": "DocType the report reads."
              }
            },
            "additionalProperties": false
          }
        },
        "additionalProperties": false
      },
      "FieldCondition": {
        "type": "object",
        "description": "Declarative rule for an approved renderer. Never contains executable source.",
        "required": [
          "scope",
          "field",
          "op"
        ],
        "additionalProperties": false,
        "properties": {
          "scope": {
            "type": "string",
            "enum": [
              "doc",
              "parent"
            ],
            "description": "Document that owns the field."
          },
          "field": {
            "type": "string",
            "description": "Readable field name."
          },
          "op": {
            "type": "string",
            "enum": [
              "truthy",
              "falsy",
              "eq",
              "ne",
              "gt",
              "gte",
              "lt",
              "lte"
            ],
            "description": "Approved operator. Equality and inequality use strict scalar comparison."
          },
          "value": {
            "type": [
              "string",
              "number",
              "boolean",
              "null"
            ],
            "description": "Scalar comparison value. Omitted for truth tests."
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "op": {
                  "enum": [
                    "truthy",
                    "falsy"
                  ]
                }
              },
              "required": [
                "op"
              ]
            },
            "then": {
              "not": {
                "required": [
                  "value"
                ]
              }
            },
            "else": {
              "required": [
                "value"
              ]
            }
          }
        ]
      },
      "SelectChoice": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "value",
          "label"
        ],
        "properties": {
          "value": {
            "type": "string",
            "description": "Unchanged stored value."
          },
          "label": {
            "type": "string",
            "description": "Translated option label."
          }
        }
      },
      "Sensitivity": {
        "type": "string",
        "enum": [
          "standard",
          "restricted"
        ],
        "description": "High privacy marker. Restricted fields are never returned to the mobile surface."
      },
      "Formatting": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "time_zone",
          "currency",
          "number_format",
          "rounding_method"
        ],
        "properties": {
          "time_zone": {
            "type": "string",
            "description": "IANA time zone configured for the site."
          },
          "currency": {
            "type": [
              "string",
              "null"
            ],
            "description": "Default display currency, or null when the site has not selected one."
          },
          "number_format": {
            "type": "string",
            "description": "Site number formatting pattern."
          },
          "rounding_method": {
            "type": "string",
            "description": "Site rounding rule."
          }
        }
      }
    }
  }
}
