openapi: 3.1.0
info:
  title: CronHR Leave Application
  version: 0.1.0
servers:
  - url: /api
paths:
  /resource/Leave%20Application:
    get:
      summary: List the leave applications the caller can read.
      responses:
        "200": {description: Own applications, the reporting team's applications, or all applications on the site.}
  /resource/Leave%20Application/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: {type: string}
        description: Leave application document name.
    get:
      summary: Read a leave application.
      responses:
        "200": {description: Leave application. The leave_balance field is omitted without level 2 read permission.}
        "403": {description: The caller does not have read permission.}
  /method/cronhr.api.approve_leave:
    post:
      summary: Approve and submit an open leave application.
      description: Managers can approve their reporting team's applications. HR can approve applications across the site. Self-approval is denied.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LeaveName"}
      responses:
        "200":
          description: Name of the approved application.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/LeaveName"}
        "403": {description: The caller has insufficient role or document permissions.}
        "404": {description: Leave application not found.}
        "417": {description: The application is not an open draft or failed HRMS validation.}
x-ai-tool:
  name: cronhr_approve_leave
  arguments:
    type: object
    additionalProperties: false
    required: [name, version]
    properties:
      name: {type: string, minLength: 1, maxLength: 140, description: Leave application document name.}
      version: {type: string, minLength: 1, maxLength: 40, description: The open draft's modified value.}
  description: The tool creates a proposal. Human approval is required before the application changes.
components:
  schemas:
    LeaveName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 140, description: Leave application document name.}
