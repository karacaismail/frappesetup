openapi: 3.1.0
info:
  title: HRMS TR izin talebi
  version: 0.1.0
servers:
  - url: /api
security:
  - frappeSession: []
  - frappeApiToken: []
paths:
  /resource/Leave%20Application:
    get:
      operationId: listLeaveApplications
      summary: Kullanıcının okuyabildiği izin taleplerini listeler.
      responses:
        "200":
          description: "Kendi talepleri, bağlı ekip veya tüm site kayıtları."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveApplicationListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /resource/Leave%20Application/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
        description: İzin talebinin kayıt adı.
    get:
      operationId: getLeaveApplication
      summary: İzin talebini açar.
      responses:
        "200":
          description: Kullanıcıya açık alanları döndürür. Bakiye alanı okuma izni gerektirir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveApplicationResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/LeaveNotFound"
  /method/hrms_tr.api.approve_leave:
    post:
      operationId: approveLeaveApplication
      summary: Açık izin talebini onaylar ve gönderir.
      description: Yönetici bağlı ekipteki talebi onaylar. İK sitedeki talepleri onaylar.
      parameters:
        - in: header
          name: X-Frappe-CSRF-Token
          description: Frappe, oturuma bağlı CSRF belirteci varsa yazma isteğinde bu başlığı ister.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveName"
      responses:
        "200":
          description: Onaylanan kaydın adı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveLeaveResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/LeaveNotFound"
        "417":
          description: Talep açık bir taslak değil veya HRMS doğrulaması başarısız.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrappeError"
x-ai-tool:
  name: hrms_tr_approve_leave
  destructive: true
  arguments:
    type: object
    additionalProperties: false
    required: [name, version]
    properties:
      name: {type: string, minLength: 1, maxLength: 140, description: "İzin talebinin kayıt adı."}
      version: {type: string, minLength: 1, maxLength: 40, description: "Açık taslağın modified değeri."}
  description: Araç öneri oluşturur. İnsan onayından önce izin talebi değişmez.
components:
  securitySchemes:
    frappeSession:
      type: apiKey
      in: cookie
      name: sid
      description: Frappe oturum çerezi.
    frappeApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: "Frappe API anahtarı ve sırrı. Başlık değeri: token <api_key>:<api_secret>"
  responses:
    AuthenticationFailed:
      description: Frappe, verilen kimlik bilgisini kabul etmedi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrappeError"
    PermissionDenied:
      description: Erişim reddedildi. Oturum veya gerekli izin eksik olabilir.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrappeError"
    LeaveNotFound:
      description: İzin talebi bulunamadı.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrappeError"
  schemas:
    LeaveName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 140, description: "İzin talebinin kayıt adı."}
    LeaveApplication:
      type: object
      properties:
        name: {type: string}
        employee: {type: [string, "null"]}
        status: {type: [string, "null"]}
        leave_balance:
          type: [number, "null"]
          description: Frappe bu alanı yalnız okuma izni varsa döndürür.
    LeaveApplicationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LeaveApplication"
    LeaveApplicationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/LeaveApplication"
    ApproveLeaveResponse:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/LeaveName"
    FrappeError:
      type: object
      properties:
        exc_type: {type: string}
        exception: {type: string}
        _server_messages: {type: string}
