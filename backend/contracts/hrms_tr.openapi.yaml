openapi: 3.1.0
info:
  title: HRMS TR Leave Applications
  version: 0.1.0
servers:
  - url: /api
security:
  - frappeSession: []
  - frappeApiToken: []
paths:
  /resource/Leave%20Application:
    get:
      operationId: listLeaveApplications
      summary: List leave applications the user can read.
      description: |
        Uses Frappe's standard resource endpoint. Frappe enforces document and field permissions.
        This contract defines the fields and filter format the application uses.
      parameters:
        - name: fields
          in: query
          description: |
            URL-encoded JSON array. If omitted, Frappe returns only name.
            Frappe returns only the fields the user can read.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum: [name, employee, employee_name, leave_type, from_date, to_date, status, docstatus, modified, total_leave_days, leave_balance]
                default: [name]
              example: [name, status, modified]
        - name: filters
          in: query
          description: |
            URL-encoded JSON. Use an object for equality conditions or an array of name membership filters.
            Frappe applies all conditions together.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    properties:
                      name: {type: string}
                      employee: {type: string}
                      leave_type: {type: string}
                      status: {type: string, enum: [Open, Approved, Rejected, Cancelled]}
                      docstatus: {type: integer, enum: [0, 1, 2]}
                  - type: array
                    items:
                      type: array
                      minItems: 3
                      prefixItems:
                        - {const: name}
                        - {const: in}
                        - type: array
                          items: {type: string}
                      items: false
              example: {status: Open, docstatus: 0}
        - name: order_by
          in: query
          description: Supply an explicit order for stable paging. Use the name to break ties between matching modification timestamps.
          schema:
            type: string
            enum: ["modified desc, name asc", "name asc"]
        - name: limit_start
          in: query
          description: Number of records to skip. The first record is at offset 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit_page_length
          in: query
          description: |
            Clients that follow this contract request up to 100 records per page.
            The standard Frappe endpoint treats 0 as unlimited, which is outside this contract.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "The user's own applications, their team's applications, or all applications on the site."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveApplicationListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "417":
          description: Frappe could not validate the requested fields, filters, or ordering.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrappeError"
  /resource/Leave%20Application/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
        description: Leave application record name.
    get:
      operationId: getLeaveApplication
      summary: Read a leave application.
      responses:
        "200":
          description: Returns the fields the user can read. The balance field requires its own read permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveApplicationResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/LeaveNotFound"
  /method/hrms_tr.api.approve_leave:
    post:
      operationId: approveLeaveApplication
      summary: Approve and submit an open leave application.
      description: |
        Managers approve applications from their team. HR can approve applications across the site.
        Authorized operations roles can approve applications across the site.
        Send the modified value from the application response in the version field.
      parameters:
        - in: header
          name: X-Frappe-CSRF-Token
          description: Frappe requires this header for a write request if the session has a CSRF token.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveLeaveRequest"
      responses:
        "200":
          description: Name of the approved record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveLeaveResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/LeaveNotFound"
        "429":
          description: The authenticated user exceeded the approval request limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrappeError"
        "417":
          description: |
            The application version changed, input validation failed, the application is not an open draft,
            or HRMS validation failed. A version conflict returns TimestampMismatchError.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrappeError"
              example:
                exc_type: TimestampMismatchError
  /method/hrms_tr.hrms_endpoints.deny_legacy_leave_query:
    get:
      operationId: denyLegacyLeaveQueryGet
      x-frappe-original:
        - hrms.www.hrms.get_context_for_dev
        - hrms.hr.doctype.leave_application.leave_application.get_leave_details
        - hrms.hr.doctype.leave_application.leave_application.get_leave_balance_on
        - hrms.api.get_leave_balance_map
        - hrms.api.get_leave_types
        - hrms.payroll.doctype.salary_slip.salary_slip.make_salary_slip_from_timesheet
        - hrms.payroll.doctype.salary_structure.salary_structure.make_salary_slip
        - hrms.hr.doctype.leave_application.leave_application.get_events
      summary: Deny access to an unsupported legacy leave endpoint.
      description: Denies the request without reading leave data.
      responses:
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      operationId: denyLegacyLeaveQueryPost
      x-frappe-original:
        - hrms.www.hrms.get_context_for_dev
        - hrms.hr.doctype.leave_application.leave_application.get_leave_details
        - hrms.hr.doctype.leave_application.leave_application.get_leave_balance_on
        - hrms.api.get_leave_balance_map
        - hrms.api.get_leave_types
        - hrms.payroll.doctype.salary_slip.salary_slip.make_salary_slip_from_timesheet
        - hrms.payroll.doctype.salary_structure.salary_structure.make_salary_slip
        - hrms.hr.doctype.leave_application.leave_application.get_events
      summary: Deny access to an unsupported legacy leave endpoint.
      description: Denies the request without reading leave data.
      responses:
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /v2/document/Attendance%20Request/{name}/method/get_attendance_warnings/:
    parameters:
      - in: path
        name: name
        required: true
        schema: {type: string}
        description: Attendance request record name.
    get:
      summary: Deny requests for legacy attendance warnings.
      responses:
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      summary: Deny requests for legacy attendance warnings.
      responses:
        "403":
          $ref: "#/components/responses/PermissionDenied"
x-ai-tool:
  name: hrms_tr_approve_leave
  kind: write
  destructive: true
  roles: [HRMS TR Manager, HRMS TR Admin]
  versioned: true
  arguments:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: {type: string, minLength: 1, maxLength: 140, description: "Document name of the leave application."}
  description: The tool creates a proposal and records the current modified value. The approval flow checks that value before submitting the application.
  preview:
    type: object
    properties:
      changes:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [fieldname, label, old, new]
          properties:
            fieldname: {type: string}
            label: {type: string}
            old: {type: [string, integer]}
            new: {type: [string, integer]}
components:
  securitySchemes:
    frappeSession:
      type: apiKey
      in: cookie
      name: sid
      description: Frappe session cookie.
    frappeApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: "Frappe API key and secret. Header value: token <api_key>:<api_secret>"
  responses:
    AuthenticationFailed:
      description: Frappe rejected the supplied credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrappeError"
          example:
            exc_type: AuthenticationError
    PermissionDenied:
      description: Access denied. The session or a required permission may be missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrappeError"
          example:
            exc_type: PermissionError
    LeaveNotFound:
      description: Leave application not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrappeError"
  schemas:
    LeaveName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 140, description: "Leave application record name."}
    ApproveLeaveRequest:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {type: string, minLength: 1, maxLength: 140, description: "Leave application record name."}
        version:
          type: string
          minLength: 1
          maxLength: 40
          description: The modified value returned when reading the leave application.
          example: "2026-11-22 09:00:00.000001"
    LeaveApplication:
      type: object
      properties:
        name: {type: string}
        employee: {type: [string, "null"]}
        employee_name: {type: [string, "null"]}
        leave_type: {type: [string, "null"]}
        from_date: {type: [string, "null"], format: date}
        to_date: {type: [string, "null"], format: date}
        status: {type: [string, "null"], enum: [Open, Approved, Rejected, Cancelled, null]}
        docstatus: {type: integer, enum: [0, 1, 2]}
        modified:
          type: string
          description: Record version sent as version in the approval request.
        total_leave_days: {type: [number, "null"]}
        leave_balance:
          type: [number, "null"]
          description: Frappe returns this field only when the user has read permission.
    LeaveApplicationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LeaveApplication"
      examples:
        - data:
            - name: HR-LAP-TEST-01
              status: Open
              modified: "2026-11-22 09:00:00.000001"
    LeaveApplicationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/LeaveApplication"
      examples:
        - data:
            name: HR-LAP-TEST-01
            status: Open
            modified: "2026-11-22 09:00:00.000001"
    ApproveLeaveResponse:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/LeaveName"
      examples:
        - message:
            name: HR-LAP-TEST-01
    FrappeError:
      type: object
      properties:
        exc_type: {type: string}
        exception: {type: string}
        _server_messages: {type: string}
