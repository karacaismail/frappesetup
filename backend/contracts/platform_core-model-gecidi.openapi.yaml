openapi: 3.1.0
info:
  title: Platform Core Model Gateway
  version: 0.1.0
paths:
  /api/method/platform_core.api.model.complete:
    post:
      summary: Generate a model response
      description: >
        Selects an eligible API for the active tenant and route. Checks permissions, quota,
        and the route data policy before dispatch. External dispatch masks content when the route permits it. Attempts may incur provider charges.
        Tool calls are returned as data for the caller to authorize and execute.
      operationId: complete
      security:
        - session: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Completion'
      responses:
        '200':
          $ref: '#/components/responses/Result'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/method/platform_core.api.model.test_api:
    post:
      summary: Test one configured API
      description: >
        Requires an authenticated AI Manager or System Manager. Sends one short model
        request and may incur a charge. Records the attempt and returns no credentials.
      operationId: test_api
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [api, model]
              properties:
                api:
                  type: string
                  minLength: 1
                  description: AI API document name
                model:
                  type: string
                  minLength: 1
                  description: AI Model document name
      responses:
        '200':
          $ref: '#/components/responses/Result'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/method/platform_core.api.model.resolve_usage:
    post:
      summary: Resolve an unsettled attempt
      description: A manager records the verified charge in the attempt currency and can add a short note. The original result is retained.
      operationId: resolve_usage
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [log, cost]
              properties:
                log: {type: string, minLength: 1, maxLength: 140}
                cost: {type: number, minimum: 0, exclusiveMaximum: 1000000000000, multipleOf: 0.000000001}
                note:
                  type: string
                  maxLength: 240
                  description: Optional single-line reconciliation note.
      responses:
        '200':
          description: Reconciled usage record
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '417':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/method/platform_core.api.model.purge_usage:
    post:
      summary: Preview or purge old usage records
      description: This destructive manager operation defaults to preview. Execution deletes up to 500 closed records past the retention window.
      operationId: purge_usage
      security:
        - session: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dry_run: {type: boolean, default: true}
      responses:
        '200':
          description: Eligible and deleted counts
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '417':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/method/platform_core.api.model.clear_api_credential:
    post:
      summary: Clear a disabled API credential
      description: This destructive manager operation removes the stored credential from a disabled API.
      operationId: clear_api_credential
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [api]
              properties:
                api: {type: string, minLength: 1, maxLength: 140}
      responses:
        '200':
          description: Credential cleared
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '417':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sid
      description: Frappe session with the required CSRF header
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Native Frappe User API credentials in token or Basic form.
  responses:
    Error:
      description: Gateway error or Frappe request rejection
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [message]
                properties:
                  message:
                    type: object
                    required: [error]
                    properties:
                      error:
                        type: string
                        enum: [invalid_request, invalid_route, invalid_target, invalid_cost, invalid_note, output_limit_exceeds_deadline,
                          authentication_required, permission_denied, data_policy_denied,
                          transaction_active, attempt_in_progress, attempt_already_settled,
                          quota_exceeded, gateway_busy, endpoint_unavailable, gateway_unavailable,
                          provider_unavailable, invalid_retention]
              - type: object
                required: [exc_type]
                properties:
                  exc_type: {type: string}
    Result:
      description: Normalized Frappe RPC response
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                $ref: '#/components/schemas/Result'
  schemas:
    Completion:
      type: object
      additionalProperties: false
      required: [route, messages]
      description: Messages, tools, and schema together may occupy at most 256 KiB when encoded as UTF-8 JSON.
      properties:
        route:
          type: string
          minLength: 1
          description: AI Route document name
        messages:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role:
                enum: [system, user, assistant]
              content:
                type: string
        tools:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [name, parameters]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 64
                pattern: '^[A-Za-z_][A-Za-z0-9_-]{0,63}$'
              description:
                type: string
              parameters:
                type: object
                description: JSON Schema for the tool arguments
        schema:
          type: object
          description: Optional JSON Schema for structured output
        limit:
          type: integer
          minimum: 1
          maximum: 16384
          default: 1024
          description: Maximum output tokens. The gateway rejects limits that exceed the model speed and route deadline.
    Result:
      type: object
      required: [text, tool_calls, usage, model, api]
      properties:
        text:
          type: string
        tool_calls:
          type: array
          items:
            type: object
            required: [id, name, arguments]
            properties:
              id:
                type: string
              name:
                type: string
              arguments:
                type: object
        usage:
          type: object
          required: [input, output]
          properties:
            input:
              type: [integer, 'null']
              minimum: 0
            output:
              type: [integer, 'null']
              minimum: 0
        model:
          type: string
        api:
          type: string
