openapi: 3.1.0
info:
  title: Platform Core Model Gateway
  version: 0.1.0
paths:
  /api/method/platform_core.api.model.complete:
    post:
      summary: Generate a model response
      description: >
        Selects an eligible API for the active tenant and route. Checks permissions, quota,
        and the route data policy before dispatch. Attempts may incur provider charges.
        Tool calls are returned as data for the caller to authorize and execute.
      operationId: complete
      security:
        - session: []
        - agent: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Completion'
      responses:
        '200':
          $ref: '#/components/responses/Result'
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Route or operation denied
        '429':
          description: Quota exceeded
        '503':
          description: No eligible API or provider available
  /api/method/platform_core.api.model.test_api:
    post:
      summary: Test one configured API
      description: >
        Requires an authenticated AI Manager or System Manager. Sends one short model
        request and may incur a charge. Records the attempt and returns no credentials.
      operationId: test_api
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [api, model]
              properties:
                api:
                  type: string
                  minLength: 1
                  description: AI API document name
                model:
                  type: string
                  minLength: 1
                  description: AI Model document name
      responses:
        '200':
          $ref: '#/components/responses/Result'
        '400':
          description: Invalid API or model combination
        '401':
          description: Authentication required
        '403':
          description: Manager role required
        '429':
          description: Quota exceeded
        '503':
          description: Test connection unavailable
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sid
      description: Frappe session with the required CSRF header
    agent:
      type: http
      scheme: bearer
      description: Tenant-bound, short-lived agent token
  responses:
    Result:
      description: Normalized Frappe RPC response
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                $ref: '#/components/schemas/Result'
  schemas:
    Completion:
      type: object
      additionalProperties: false
      required: [route, messages]
      properties:
        route:
          type: string
          minLength: 1
          description: AI Route document name
        messages:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role:
                enum: [system, user, assistant]
              content:
                type: string
        tools:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [name, parameters]
            properties:
              name:
                type: string
                minLength: 1
              description:
                type: string
              parameters:
                type: object
                description: JSON Schema for the tool arguments
        schema:
          type: object
          description: Optional JSON Schema for structured output
        limit:
          type: integer
          minimum: 1
          maximum: 16384
          description: Maximum output tokens
    Result:
      type: object
      required: [text, tool_calls, usage, model, api]
      properties:
        text:
          type: string
        tool_calls:
          type: array
          items:
            type: object
            required: [id, name, arguments]
            properties:
              id:
                type: string
              name:
                type: string
              arguments:
                type: object
        usage:
          type: object
          required: [input, output]
          properties:
            input:
              type: [integer, 'null']
              minimum: 0
            output:
              type: [integer, 'null']
              minimum: 0
        model:
          type: string
        api:
          type: string
