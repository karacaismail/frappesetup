  /platform_core.api.identity.anonymize_user:
    post:
      tags: [sync]
      operationId: identityAnonymizeUser
      summary: Disables the linked user and anonymizes the fields that identify the person.
      description: |
        The sync service calls this endpoint in step 4 of the account deletion flow (project record O-27).
        The service token must carry `azp=identity-sync`.

        **This endpoint cannot be undone.** The rules are in docs/sozlesmeler.md section 7, anonymization rules.
        The general account deletion rules also apply in Press (`press_tr.api.identity.anonymize_user`).

        The work has two steps. Both steps are safe to repeat.
        The server makes up to three attempts per step. It retries database deadlocks and stale snapshots
        (`QueryDeadlockError`) before a commit. A lock wait timeout fails immediately.
        A lock conflict after a commit or on the final attempt returns 500 `IdentityInternalError`.

        1. Step 1 locks the existing User first, then the identity link and the deletion record. It disables the user.
           It deletes the API key, the API secret and the stored password.
           It writes the deletion record with state “Disabled” and commits.
           Then it closes every session of the user, page by page. Frappe returns at most 100 sessions per query.
        2. Step 2 locks the same rows again. It anonymizes the personal data.
           It renames the user to `deleted-user-<16 hex characters>@deleted.invalid`.
           It deletes the identity link, so the raw `sub` value is gone.
           It sets the record state to “Anonymized”.

        The deletion record is the “Platform Identity Deletion” DocType. It does not keep the raw identity.
        It keeps the HMAC-SHA256 digest of the `(issuer, subject)` pair. The key is the `kimlik_deletion_hmac_key` site setting.
        `provision`, `set_enabled` and `change_email` check this record before changing data and take the same row locks.
        A deleted identity gets 410 `IdentityDeleted` there. It cannot be provisioned, enabled or renamed again.
        This holds already after step 1. Sign-in with a deleted identity gets 403.

        The scope comes from the `user_data_fields` hooks of all installed apps, plus the extra records in rule 4.
        Only rows bound to the user change. Frappe's full-name search over every row is not used.
        So another person with the same name keeps their data.
        Business records are not deleted. For example a leave request stays. Its person field changes to the anonymous name.
        Frappe's “Personal Data Deletion Request” is not used. No e-mail goes to the user.
        The sync service got the consent with the account deletion request.

        If step 2 fails, its changes roll back. The record stays “Disabled”. A retry finishes the work.
        Two calls at the same time finish once. The second call returns the same body.
        If the request comes again after the work is done, it returns the same body.
        A successful response includes `anonymized: true` and `found: true`.
        If neither the `(issuer, subject)` link nor a deletion record exists, it returns HTTP 200.
        The response then carries only `anonymized: true` and `found: false`.
        The `Administrator` and `Guest` accounts cannot be anonymized. In this case it returns 409.
        If the `kimlik_deletion_hmac_key` setting is missing, it returns 503 `DeletionKeyMissing`. Nothing changes.
        The request body is at most 16 KB.
      x-yikici: true
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonymizeUserRequest"
            examples:
              sil:
                summary: Anonymize the user.
                value:
                  issuer: http://identity.localhost:8660/realms/platform
                  subject: 11111111-1111-4111-8111-111111111111
      responses:
        "200":
          description: The account is anonymized or the identity is unknown. A repeated request gets the same body.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/AnonymizeUserResult"}
              examples:
                anonim:
                  value:
                    message:
                      user: deleted-user-3f9a1c7e5b2d8f40@deleted.invalid
                      enabled: false
                      status: Anonymized
                      anonymized: true
                      found: true
                unknown_identity:
                  value:
                    message: {anonymized: true, found: false}
        "400":
          $ref: "#/components/responses/GirdiGecersiz"
        "401":
          $ref: "#/components/responses/ServisBelirteciReddi"
        "429":
          $ref: "#/components/responses/IstekSiniri"
        "403":
          $ref: "#/components/responses/ServisYetkisiYok"
        "409":
          description: "The linked account is `Administrator` or `Guest`. The `exc_type` value is `IdentityConflict`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "413":
          description: The request body is larger than 16 KB. The `exc_type` value is `PayloadTooLarge`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "417":
          description: |
            Frappe returns `DataError` when it cannot parse the request body as JSON.
            The anonymization step returns `ValidationError` for a required field in `clear_fields`
            or malformed field changes in a Version record. Correct the site data or configuration before retrying.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "410":
          $ref: "#/components/responses/KimlikSilindi"
        "500":
          $ref: "#/components/responses/IdentityLockRetryExhausted"
        "503":
          description: |
            Either the identity provider keys are not available (`KeycloakKeysUnavailable`),
            or the `kimlik_deletion_hmac_key` setting is missing (`DeletionKeyMissing`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}

  /platform_core.api.atonota_login.evaluate:
    post:
      tags: [atonota-login]
      operationId: atonotaLoginEvaluate
      summary: Says whether the signed-in user may take one action now.
      description: |
        Keycloak answers who the person is. This endpoint answers whether the person may take one action now (G-161).
        The rules are in the `atonota_login` package (`atonota_login/policy/actions.json`). The package has no Frappe code.

        The endpoint accepts only a signed-in user. A guest request gets 403 and `PermissionError`.

        The server collects the evidence itself. The caller cannot send evidence.
        Extra body fields such as `evidence` or `user` are dropped before the endpoint runs.
        The endpoint does not read roles from a token. It reads two Frappe records:

        - `identity`: the user is enabled and has a `PLT Identity Link` record.
        - `membership`: the user is enabled and is a `System User` of this tenant site.

        Evidence collected in one request holds for that request only.
        The final step of an action collects it again (see `open_paid_plan`).

        The result has one of three states:

        - `ready`: every required control passed. The result holds for the named action and policy version only.
        - `denied`: a required control has no valid evidence. `reasons` names the controls.
        - `configuration_required`: a rule of the action has no value yet. `owner_tasks` names the rule and its owner.
          The server opens one Frappe `ToDo` per rule for the `System Manager` role.
          It does not open a second open task for the same rule and action.

        An unknown action gives `denied` with the reason `unknown-action`.
        A request writes at most one task per empty rule. It writes no other record. No endpoint does paid work.
      security:
        - frappeSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtonotaDecisionRequest"
            examples:
              siparis:
                summary: Ask whether the user may place an order.
                value: {action: place-order}
      responses:
        "200":
          description: The decision for the action.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/AtonotaDecision"}
              examples:
                hazir:
                  value:
                    message:
                      status: ready
                      action: place-order
                      policy_version: 0f3c0b5e2d9a4c1b8e7f6a5d4c3b2a190817263544536271809a8b7c6d5e4f3a
                      reasons: []
                      owner_tasks: []
                kural_bekliyor:
                  value:
                    message:
                      status: configuration_required
                      action: open-paid-plan
                      policy_version: 0f3c0b5e2d9a4c1b8e7f6a5d4c3b2a190817263544536271809a8b7c6d5e4f3a
                      reasons: [configuration-required]
                      owner_tasks:
                        - {rule: paid-plan-pricing, owner: product-owner, action: open-paid-plan}
        "400":
          description: The `action` field is missing, is not text or is longer than 140 characters. The `exc_type` value is `InvalidInput`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "403":
          description: Guest request. The `exc_type` value is `PermissionError`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "401":
          $ref: "#/components/responses/OturumBitti"

  /platform_core.api.atonota_login.open_paid_plan:
    post:
      tags: [atonota-login]
      operationId: atonotaLoginOpenPaidPlan
      summary: Opens a paid AtonotA Login plan. The gate is closed until the price decision (G-166).
      description: |
        This endpoint is the example final step of an action (G-161).
        It judges the `open-paid-plan` action, collects the evidence again and calls `Policy.confirm` right before the write.
        The write runs only when the final check says `ready` again.
        A policy change between the two checks refuses the action with the reason `policy-changed`.

        **The gate is closed today.** The `paid-plan-pricing` rule has no value. The price decision is open (G-166, K-61).
        So every call returns 403 and `ActionRefused`, and the rule owner gets a task.
        A system manager or administrator cannot pass the gate. The caller cannot send evidence.
        A refused call writes no plan record and no billing record.
        The plan record and its price come with the price decision. This file holds no price, currency or amount.

        The request has no body fields. Extra fields are dropped.
      security:
        - frappeSession: []
          csrfToken: []
      responses:
        "200":
          description: |
            Not reachable today. The gate is closed. When the price decision closes, this response returns the new plan.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: object}
        "403":
          description: |
            Guest request (`PermissionError`), or the action is refused (`ActionRefused`).
            The message names the decision state, for example `configuration_required`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
              examples:
                kapali:
                  value:
                    exc_type: ActionRefused
                    exception: "platform_core.identity.atonota.decision_api.ActionRefused: The action open-paid-plan is not allowed now (configuration_required)."
        "401":
          $ref: "#/components/responses/OturumBitti"

  /platform_core.api.atonota_login.verification_notice:
    post:
      tags: [atonota-login]
      operationId: atonotaLoginVerificationNotice
      summary: Receives one result notice of the external document and face check (G-164).
      description: |
        The external verification provider calls this endpoint. The browser does not call it.
        The provider carries no session, so the endpoint is open to guests. The signature authorizes the notice.
        The provider is not chosen yet. Until the `atonota_verification_secret` site setting exists,
        every notice gets 503 and `VerificationNotConfigured`, and nothing is stored.

        Order of work:

        1. The endpoint reads the raw body with `frappe.request.get_data()`.
        2. It checks the `X-Verification-Signature` header over these raw bytes, before it reads any field.
           The header is `t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>." + raw body>`.
           The time may differ from the server clock by at most 300 seconds. Several `v1` values may be sent; one match is enough.
           A missing, wrong or old signature gets 401 and `NoticeSignatureRejected`. Nothing is stored.
        3. It reads four fields: `event_id`, `case_id`, `attempt` and `outcome`. Bad fields get 400 and `InvalidInput`.
        4. It stores one `PLT Verification Notice` record. The provider's `event_id` is unique.
           The same notice again gives `duplicate` and stores nothing new.
        5. It hands the processing to the queue (`frappe.enqueue`, after the commit). Processing never runs in the request.

        Frappe itself copies JSON body fields into its form fields before the endpoint runs.
        The endpoint does not use them and empties them first, so they cannot reach an error log.
        Other body fields, such as document images or face data, are dropped. They never reach a record or a log.

        The queue job applies each notice once. Only the newest attempt of a case decides.
        A notice for an older attempt is kept as `stale`. A notice for an unknown attempt is kept as `unknown-attempt`.
        No scheduled job runs. A System Manager replays unknown-attempt notices by hand with
        `bench execute platform_core.identity.atonota.verification_api.replay_unknown`.
        No endpoint marks a case complete from the browser.

        At most 300 requests per minute are accepted from the same IP address. Extra requests get 429.
        This is the same limit as `keycloak_backchannel_logout`.
      x-yikici: false
      security: []
      parameters:
        - name: X-Verification-Signature
          in: header
          required: true
          schema: {type: string}
          description: Signature over the raw body, as described above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtonotaVerificationNotice"
            examples:
              onay:
                summary: The provider approved attempt 1 of a case.
                value: {event_id: evt-0001, case_id: case-0001, attempt: 1, outcome: approved}
      responses:
        "200":
          description: |
            The notice was stored (`accepted`) or was stored before (`duplicate`). Only `accepted` queues processing.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/AtonotaVerificationReceipt"}
              examples:
                yeni:
                  value: {message: {status: accepted}}
                tekrar:
                  value: {message: {status: duplicate}}
        "400":
          description: |
            The signature is valid but a field is missing or wrong. The `exc_type` value is `InvalidInput`.
            A body that is not JSON may also get the Frappe value `DataError`. Nothing is stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "401":
          description: The signature is missing, wrong or too old. The `exc_type` value is `NoticeSignatureRejected`. Nothing is stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "429":
          $ref: "#/components/responses/IstekSiniri"
        "503":
          description: No verification provider is configured. The `exc_type` value is `VerificationNotConfigured`. Nothing is stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}

  /platform_core.identity.enterprise_membership.approve_exception:
    post:
      tags: [atonota-login]
      operationId: approveEnterpriseIdpException
      summary: Approves a waiting corporate provider exception record (G-160).
      description: |
        A corporate provider must require the `email_verified` claim. A provider that never sends the claim
        needs an approved `PLT Enterprise IdP Exception` record. This endpoint approves one waiting grant record.

        The caller needs three things. Without any of them the endpoint returns 403 and `PermissionError`:

        - the `System Manager` role,
        - read permission on the named record,
        - a human session: a cookie session with a checked CSRF token. A request with an `Authorization` header is refused.
          Agent tokens and MCP OAuth tokens are refused this way.

        The approver must be another user than the requester. The endpoint writes only three fields:
        `approved_by`, `approved_on` and `approval_principal`. No role has write permission on the record.
        The record never changes after approval and is never deleted.
        A rule break returns 417 and `ValidationError`. The endpoint does not write Keycloak.
        The `atonota-login apply` command reads the approved records later.
      x-yikici: false
      security:
        - frappeSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 140, description: Name of the waiting grant record.}
      responses:
        "200":
          description: The name of the approved record.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, description: Name of the approved record.}
        "403":
          description: Guest, no `System Manager` role, no read permission or no human session. The `exc_type` value is `PermissionError`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "417":
          description: The record is not a waiting grant or breaks a rule. The `exc_type` value is `ValidationError`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "401":
          $ref: "#/components/responses/OturumBitti"

  /platform_core.identity.enterprise_membership.revoke_exception:
    post:
      tags: [atonota-login]
      operationId: revokeEnterpriseIdpException
      summary: Opens a revocation record that ends a corporate provider exception (G-160).
      description: |
        The endpoint opens a new revocation record. The new record supersedes the named current grant.
        The old record stays unchanged. A revocation record means the provider has no exception.

        The caller needs the same three things as `approve_exception`. Without any of them the endpoint
        returns 403 and `PermissionError`: the `System Manager` role, read permission on the named record and
        a human session with a checked CSRF token.

        Only a current grant can be revoked. Otherwise the endpoint returns 417 and `ValidationError`.
        The endpoint does not write Keycloak. The `atonota-login apply` command reads the records later.
      x-yikici: false
      security:
        - frappeSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, reason]
              properties:
                name: {type: string, minLength: 1, maxLength: 140, description: Name of the current grant record.}
                reason: {type: string, minLength: 1, description: Why the exception ends.}
      responses:
