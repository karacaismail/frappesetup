          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "429":
          $ref: "#/components/responses/IstekSiniri"
        default:
          description: While the gate is off, the response of the original Frappe function. This contract does not define it.
  /platform_core.identity.login_policy.ldap_login:
    post:
      tags: [yerel-giris-kapisi]
      operationId: gatedLdapLoginPost
      summary: Closed local sign-in function. It replaces the Frappe function `frappe.integrations.doctype.ldap_settings.ldap_settings.login`.
      description: |
        This endpoint is a gated wrapper of the Frappe function `frappe.integrations.doctype.ldap_settings.ldap_settings.login`. It signs in with the LDAP directory of the organization.
        The `override_whitelisted_methods` hook routes the Frappe address to this function.
        So `/api/method/frappe.integrations.doctype.ldap_settings.ldap_settings.login` gets the same response. The address is listed in `x-frappe-original`.
        The `/api/v1/method`, `/api/v2/method` and `cmd` forms are covered too.

        While the `kimlik_yalniz_keycloak` setting is 1, the endpoint returns 403 and `PermissionError` on every call.
        Calls with and without sign-in get the same response. The endpoint changes no record.
        While the setting is 0, the endpoint calls the original Frappe function with the same parameters. The response is the Frappe response.
        Allowed HTTP methods: POST. Other methods are refused by Frappe.
        At most 20 requests per minute are accepted from the same IP address. Extra requests get 429.
        The request body is at most 16 KB. A larger body gets 413.
        The scope is in the `x-yerel-giris-kapisi` extension.
      x-yikici: false
      x-frappe-original: [frappe.integrations.doctype.ldap_settings.ldap_settings.login]
      security: []
      responses:
        "400":
          $ref: "#/components/responses/EksikYerelGirisBilgisi"
        "403":
          $ref: "#/components/responses/YerelGirisKapali"
        "413":
          description: The request body is larger than 16 KB. The `exc_type` value is `PayloadTooLarge`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "429":
          $ref: "#/components/responses/IstekSiniri"
        default:
          description: While the gate is off, the response of the original Frappe function. This contract does not define it.

  /platform_core.api.identity.set_user_role_profiles:
    post:
      tags: [user-admin]
      operationId: setUserRoleProfiles
      summary: Gives a user of this tenant exactly these role profiles (G-98).
      description: |
        The user's roles follow the profiles. Frappe keeps the roles when the list is empty: only the profile links go.
        A user of the tenant is a Website User with an identity link to the site's issuer.
        Any other user gets 403: a user of another tenant, a desk user, the Administrator or a missing user.
        The answer does not tell whether the person exists.

        A profile with the “System Manager” or “Administrator” role gets 403. A profile with a desk role gets 403.
        The guard of the access module still runs on the save. A role that is not plain gets 403 there.
        Every change writes a Permission Log row.
        An unknown body field gets 400.
      x-yikici: false
      security:
        - frappeSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user, role_profiles]
              properties:
                user: {type: string, description: The user's name (the e-mail address).}
                role_profiles:
                  type: array
                  items: {type: string}
                  description: The names of the role profiles. The list replaces the user's profiles.
      responses:
        "200":
          description: The profiles and the roles of the user after the change.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: object
                    required: [user, role_profiles, roles]
                    properties:
                      user: {type: string}
                      role_profiles: {type: array, items: {type: string}}
                      roles: {type: array, items: {type: string}}
        "400":
          description: An unknown field, or `role_profiles` is not a list of names. `exc_type` is `InvalidInput`.
        "403":
          description: The caller has neither of the two manager roles, the user is not a user of this tenant, or a profile holds a protected, desk or closed role.
        "404":
          description: A role profile does not exist.

  /platform_core.api.identity.invite_user:
    post:
      tags: [user-admin]
      operationId: inviteUser
      summary: Previews or runs the invitation of a person into this tenant (G-16, G-79, G-98).
      description: |
        The site calls identity-sync `POST /v1/invitations` with its own service token.
        identity-sync creates the Keycloak user if it does not exist, adds the user to the tenant's organization
        and sends the password e-mail (UPDATE_PASSWORD and CONFIGURE_TOTP).
        The organization comes from the `keycloak_organization_id` site setting, never from the request.
        identity-sync checks again that the organization is the tenant's own. Another organization gets 403.

        The flow has two steps.
        1. The panel sends `dry_run: true`. identity-sync only reads. The answer carries the operations and a `preview_digest`.
        2. The person looks at the preview. The panel sends `dry_run: false` with the same fields and the `preview_digest`.
           This second call is the person's approval. The site gives it a new, single-use approval id.
           identity-sync runs only the approved plan. If the plan changed, the answer is 409 and nothing is written.

        The e-mail of a desk user gets 409 and makes no call (G-16).
        The Website User of the invited person is made when the person signs in for the first time.
        A sent e-mail cannot be taken back.
        An unknown body field gets 400. For example `organization_id` gets 400.
      x-yikici: false
      security:
        - frappeSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, dry_run]
              properties:
                email: {type: string, maxLength: 254}
                first_name: {type: string, maxLength: 150}
                last_name: {type: string, maxLength: 150}
                dry_run:
                  type: boolean
                  description: true for the preview, false for the run. The field must be written.
                preview_digest:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: Required when `dry_run` is false. The digest of the preview.
      responses:
        "200":
          description: The preview or the result of the run.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: object
                    required: [dry_run, subject, previews]
                    properties:
                      dry_run: {type: boolean}
                      subject:
                        type: [string, "null"]
                        description: The Keycloak id of the user. Null in a preview when the user does not exist yet.
                      previews:
                        type: array
                        items:
                          type: object
                          required: [operation]
                          properties:
                            operation: {type: string}
                            target: {type: string}
                            destructive: {type: boolean}
                      preview_digest:
                        type: string
                        description: Only in a preview. The run must send it back.
        "400":
          description: An unknown field, a wrong e-mail, a missing `dry_run` or a run without its `preview_digest`. `exc_type` is `InvalidInput`.
        "403":
          description: The caller has neither of the two manager roles, or identity-sync refused the organization.
        "409":
          description: The e-mail belongs to a desk user (`IdentityConflict`), or the plan changed after the preview (`InvitationChanged`).
        "503":
          description: The site has no organization setting, or identity-sync did not answer. `exc_type` is `IdentityServiceUnavailable`.

components:
  securitySchemes:
    frappeSession:
      type: apiKey
      in: cookie
      name: sid
      description: |
        Frappe session cookie. It is not enough on its own. A POST request also carries the `csrfToken` header.
        No `Authorization` header is sent together with this cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-Frappe-CSRF-Token
      description: |
        The Frappe CSRF token. The `/panel` page carries this value.
        The separate frontend reads it from the `get_csrf_token` endpoint instead.
        If the header is missing or wrong, Frappe returns 403.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Service token issued by Keycloak. It is looked for only on the `platform_core.api.identity.*` paths.
        The server verifies the token with the `libs/oidc_verify` library. The rules are these:

        - Only an RS256 signature is accepted.
        - `iss` matches the `iss` value of the site exactly.
        - `aud` is a single value. The value is the `keycloak_client_id` setting of the site.
        - The `azp` value must be in the `kimlik_servis_azp` list. The default list is `["identity-sync"]`.
        - `exp` is required. The clock skew allowance is 30 seconds.
        - If the request has a `cmd` field, the request is rejected.
        - If the request carries both a non-Guest session cookie and a token, the request is rejected.

        The rejection response is 401 and `ServiceTokenRejected`. The message carries the code of the rejection reason.
        The message does not carry the token. The server does not write the token to the log.
        If there is no token at all, the endpoint returns 403 and `PermissionError`.
        If the Keycloak key list cannot be fetched, the endpoint returns 503 and `KeycloakKeysUnavailable`.

  responses:
    YerelGirisKapali:
      description: |
        Local sign-in is closed. The `kimlik_yalniz_keycloak` setting is 1. The `exc_type` value is `PermissionError`.
        The tenant sign-in page redirects guests to the identity provider's sign-in flow.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            kapali:
              value:
                exc_type: PermissionError
                exception: "frappe.exceptions.PermissionError: Local sign-in is disabled. Sign in with the identity provider."
    EksikYerelGirisBilgisi:
      description: The local sign-in gate is off, but the request does not supply the required arguments.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
        text/html:
          schema: {$ref: "#/components/schemas/HtmlSayfa"}
    TarayiciIstekSiniri:
      description: |
        The per-IP rate limit was exceeded. API paths return JSON by default or HTML when requested.
        Legacy `cmd` dispatch returns JSON.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
        text/html:
          schema: {$ref: "#/components/schemas/HtmlSayfa"}
    IstekSiniri:
      description: |
        The rate limit was exceeded. The limit is counted per IP address.
        The `exc_type` value is the Frappe value `RateLimitExceededError`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
    KimlikSilindi:
      description: |
        The identity `(issuer, subject)` was deleted. The `exc_type` value is `IdentityDeleted`.
        The deletion record is checked before changes, under the same row locks as the deletion (docs/sozlesmeler.md section 7, rule 3).
        If the `kimlik_deletion_hmac_key` setting is missing, the endpoint returns 503 `DeletionKeyMissing` instead.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            silindi:
              value:
                exc_type: IdentityDeleted
                exception: "platform_core.identity.exceptions.IdentityDeleted: This identity was deleted and cannot be used again."
    OturumBitti:
      description: |
        The session has expired. The user made no real request for 1 hour or the session was closed (O-25).
        Background requests do not renew the time. The rule is in step 8 of `keycloak_callback`.
        The `exc_type` value is the Frappe value `SessionExpired`. Frappe deletes the `sid` cookie.
        This response is not a permission denial. The client sends the user to the sign-in page (SZ-8).
        If there is no cookie at all, this response is not returned. In that case it returns 403 and `PermissionError`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            boslukta:
              value:
                exc_type: SessionExpired
                exception: "frappe.exceptions.SessionExpired"
    GovdeBozuk:
      description: |
        The body could not be parsed as JSON. Frappe rejected the request before passing it to the endpoint.
        The `exc_type` value is the Frappe value `DataError`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
    ServisBelirteciReddi:
      description: |
        The service token is not valid. The `exc_type` value is `ServiceTokenRejected`. The message carries the rejection code.
        The codes can be `malformed`, `invalid_signature`, `unknown_kid`, `wrong_issuer`, `wrong_audience`,
        `wrong_azp`, `expired` and `not_yet_valid`.
        If the request has a `cmd` field or also a non-Guest cookie, the same error is returned.
        If there is no token at all, this response is not returned. In that case it returns 403.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            suresiDolmus:
              value:
                exc_type: ServiceTokenRejected
                exception: "platform_core.identity.exceptions.ServiceTokenRejected: expired"
                _server_messages: '["{\"message\": \"Service token rejected: expired\"}"]'
    ServisYetkisiYok:
      description: |
        The caller has no permission for this endpoint. The `exc_type` value is `PermissionError`.

        - The request carries no service token. For example there is only a session cookie or no identity at all.
        - The token is valid but the `azp` value is not `identity-sync`.
        - The service user lacks permission to read the identity links on a list request.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
    GirdiGecersiz:
      description: |
        A field is missing or malformed. The `exc_type` value is `InvalidInput`.
        For example `subject` is missing, `enabled` is not true or false, or `new_email` is not in e-mail form.
        The message names the wrong field.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            enabledYanlis:
              value:
                exc_type: InvalidInput
                exception: "platform_core.identity.exceptions.InvalidInput: enabled"
                _server_messages: '["{\"message\": \"Field enabled must be true or false.\"}"]'
    AnahtarListesiYok:
      description: |
        The Keycloak key list could not be fetched. The token could not be verified. The `exc_type` value is `KeycloakKeysUnavailable`.
        The server did not process the request. The caller sends the request again later.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            keycloakKapali:
              value:
                exc_type: KeycloakKeysUnavailable
                exception: "platform_core.identity.exceptions.KeycloakKeysUnavailable: jwks"
                _server_messages: '["{\"message\": \"Identity provider keys are not available.\"}"]'
    BagYok:
      description: "The `(issuer, subject)` link does not exist. The `exc_type` value is `IdentityNotFound`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            bagYok:
              value:
                exc_type: IdentityNotFound
                exception: "platform_core.identity.exceptions.IdentityNotFound: subject"
                _server_messages: '["{\"message\": \"No user is linked to this identity.\"}"]'
    IdentityLockRetryExhausted:
      description: The server stopped on a lock conflict. The `exc_type` value is `IdentityInternalError`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}

  schemas:
    Issuer:
      type: string
      format: uri
      minLength: 1
      maxLength: 255
      description: |
        The `iss` value of the identity server. It must match the `iss` value of the site exactly.
        The form is `<keycloak_public_url>/realms/<keycloak_realm>`.
        It is at most 255 characters. The `issuer` field of the “Platform Identity Link” record has the same length.
      examples:
        - http://identity.localhost:8660/realms/platform
    Subject:
      type: string
      minLength: 1
      maxLength: 140
      description: |
        The `sub` value of the user in Keycloak. It is the second part of the permanent key.
        It is at most 140 characters. The `subject` field of the “Platform Identity Link” record has the same length.
      examples:
        - 11111111-1111-4111-8111-111111111111
    Email:
      type: string
      format: email
      maxLength: 140
      description: The e-mail of the user. In Frappe the user name is this value.
      examples:
        - tenant1.kullanici1@example.test

    HtmlSayfa:
      type: string
      description: |
        HTML page shown in the browser. The page has a title and a short explanation.
        The page does not carry `exc_type`. The page does not show tokens, codes or personal data.

    LoginUrlRequest:
      type: object
      additionalProperties: false
      properties:
        redirect_to:
          type: string
          maxLength: 2048
          pattern: '^/(?!/)[A-Za-z0-9\-._~/?#@!$&()*+,;=%:\[\]]*$'
          description: |
            Relative path to return to after sign-in. It starts with `/`. It cannot start with `//`.
            It cannot contain a backslash anywhere. It cannot contain a space or a control character.
            It cannot contain quotes, `<`, `>` or backticks.
            It is at most 2048 characters. If it is not given, the return address is `platform_panel_url`.
          examples:
            - /panel
            - /panel/kayitlar?durum=acik

    LoginUrl:
      type: object
      required: [login_url, brand_name, label]
      properties:
        login_url:
          type: string
          format: uri
          description: |
            Keycloak authorization address. The browser goes to this address.
            The address carries `state`, `nonce`, `code_challenge`, `code_challenge_method=S256` and `redirect_uri`.
            The `redirect_uri` value is the `keycloak_callback` endpoint of this site.
        brand_name:
          type: string
          description: Brand name. It comes from the `kimlik_marka_adi` setting.
        label:
          type: string
          description: |
            Label of the sign-in button. The English source text is `Sign in with {0}`. The brand name fills `{0}`.
            The Turkish text comes from `translations/tr.csv` with the context `platform_core.identity`.

    LogoutUrl:
      type: object
      required: [logout_url]
      properties:
        logout_url:
          type: string
          format: uri
          description: |
            Keycloak logout address. It carries `client_id` and `post_logout_redirect_uri`.
            It does not carry `id_token_hint`.

    LoginProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          maxItems: 100
          items:
            type: object
            required: [alias, display_name]
            properties:
              alias: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"}
              display_name: {type: string, minLength: 1, maxLength: 80}
            additionalProperties: false
      additionalProperties: false
    LinkedAccounts:
      type: object
      required: [providers, local_sign_in_methods]
      properties:
        providers:
          type: array
          maxItems: 100
          items:
            type: object
            required: [alias, display_name, linked]
            properties:
              alias: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"}
              display_name: {type: string, minLength: 1, maxLength: 80}
              linked: {type: boolean}
            additionalProperties: false
        local_sign_in_methods: {type: integer, minimum: 0}
      additionalProperties: false
    CsrfToken:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          minLength: 1
          description: |
            The CSRF token of the session. The frontend sends it in the `X-Frappe-CSRF-Token` header
            of POST, PUT, PATCH and DELETE requests. The value is bound to this session only.

    LogoutTokenForm:
      type: object
      required: [logout_token]
      properties:
        logout_token:
          type: string
          minLength: 1
          description: Logout token (JWT) signed by Keycloak. The `exp` and `jti` fields are required.

    BackchannelLogoutResult:
      type: object
      required: [closed_sessions]
      properties:
        closed_sessions:
          type: integer
          minimum: 0
          description: Number of closed Frappe sessions. If there is no match, it is 0.

    SetupResult:
      type: object
      required: [social_login_key, enabled, provider_name]
      properties:
        social_login_key:
          type: string
          const: keycloak
          description: Name of the “Social Login Key” record.
        enabled:
          type: boolean
          const: false
          description: The record is enabled.
        provider_name:
          type: string
          description: Brand name in the record. It comes from the `kimlik_marka_adi` setting.

    ProvisionRequest:
      type: object
      required: [issuer, subject, email, email_verified, enabled]
      additionalProperties: false
      properties:
        issuer: {$ref: "#/components/schemas/Issuer"}
        subject: {$ref: "#/components/schemas/Subject"}
        email: {$ref: "#/components/schemas/Email"}
        email_verified:
          type: boolean
          description: Did Keycloak verify the e-mail? It is required. If it is false, no first link is made.
        first_name:
          type: string
          maxLength: 140
          description: First name. It is optional. If it is given, it must be text.
        last_name:
          type: string
          maxLength: 140
          description: Last name. It is optional. If it is given, it must be text.
        enabled:
          type: boolean
          description: Is the user enabled? It is required. If it is false, the user is disabled.
        role_profiles:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 140
          description: |
            Role profiles to give to the user. It is optional.
            Each role profile must exist on the site. It cannot contain a role that grants desk access.

    ProvisionResult:
      type: object
      required: [user, enabled, linked, user_type]
      properties:
        user: {$ref: "#/components/schemas/Email"}
        enabled:
          type: boolean
          description: The latest state of the user.
        linked:
          type: boolean
          const: true
          description: The link is in place.
        user_type:
          type: string
          const: Website User
          description: The type of the user. This endpoint creates only “Website User” users.

    SetEnabledRequest:
      type: object
      required: [issuer, subject, enabled]
      additionalProperties: false
      properties:
        issuer: {$ref: "#/components/schemas/Issuer"}
        subject: {$ref: "#/components/schemas/Subject"}
        enabled:
          type: boolean
          description: If it is true, the user is enabled. If it is false, the user is disabled.

    SetEnabledResult:
      type: object
      required: [user, enabled]
      properties:
        user: {$ref: "#/components/schemas/Email"}
        enabled:
          type: boolean
          description: The latest state of the user.

    ChangeEmailRequest:
      type: object
      required: [issuer, subject, new_email]
      additionalProperties: false
      properties:
        issuer: {$ref: "#/components/schemas/Issuer"}
        subject: {$ref: "#/components/schemas/Subject"}
        new_email:
          allOf:
            - $ref: "#/components/schemas/Email"
          description: The new e-mail of the user. It cannot belong to another user.

    AnonymizeUserRequest:
      type: object
      required: [issuer, subject]
      additionalProperties: false
      properties:
        issuer: {$ref: "#/components/schemas/Issuer"}
        subject: {$ref: "#/components/schemas/Subject"}

    AnonymizeUserResult:
      oneOf:
        - $ref: "#/components/schemas/AnonymizedIdentity"
        - $ref: "#/components/schemas/UnknownAnonymizeIdentity"

    UnknownAnonymizeIdentity:
      type: object
      description: The endpoint found neither an identity link nor a deletion record. There was nothing to anonymize.
      required: [anonymized, found]
      additionalProperties: false
      properties:
        anonymized:
          type: boolean
          const: true
        found:
          type: boolean
          const: false

    AnonymizedIdentity:
      type: object
      required: [user, enabled, status, anonymized, found]
      additionalProperties: false
      properties:
        user:
          type: string
          maxLength: 140
          description: The anonymous name of the user. Its form is `deleted-user-<16 hex characters>@deleted.invalid`. It does not identify the person.
        enabled:
          type: boolean
          const: false
          description: The user is always disabled.
        status:
          type: string
          const: Anonymized
          description: The state of the “Platform Identity Deletion” record. The response comes only after step 2.
        anonymized:
          type: boolean
          const: true
          description: The account anonymization is complete.
        found:
          type: boolean
          const: true
          description: The endpoint found an identity link or a completed deletion record.

    ChangeEmailResult:
      type: object
      required: [user]
      properties:
        user:
          allOf:
            - $ref: "#/components/schemas/Email"
          description: The new name of the user. If nothing changed, the old name is returned.

    AtonotaDecisionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 140
          description: Id of the action in `actions.json`, for example `place-order` or `open-paid-plan`.
    AtonotaOwnerTask:
      type: object
      additionalProperties: false
      required: [rule, owner, action]
      properties:
        rule: {type: string, description: Id of the rule that has no value yet.}
        owner: {type: string, description: Role name of the rule owner, for example `product-owner`.}
        action: {type: string, description: The action that waits for the rule.}
    AtonotaDecision:
      type: object
      additionalProperties: false
      required: [status, action, policy_version, reasons, owner_tasks]
      properties:
        status:
          type: string
          enum: [ready, denied, configuration_required]
          description: The decision state.
        action: {type: string, description: The judged action.}
        policy_version:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the policy file. A ready result holds for this version only.
        reasons:
          type: array
          items: {type: string}
          description: Ids of the controls that failed, or a general reason such as `unknown-action`.
        owner_tasks:
          type: array
          items: {$ref: "#/components/schemas/AtonotaOwnerTask"}
          description: Rules without a value and their owners. Empty unless the state is `configuration_required`.
    AtonotaVerificationNotice:
      type: object
      required: [event_id, case_id, attempt, outcome]
      description: |
        Fields the endpoint reads. Other fields are allowed and dropped. They are never stored.
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 140
          description: The provider's event id. It is unique.
        case_id:
          type: string
          minLength: 1
          maxLength: 140
        attempt:
          type: integer
          minimum: 1
        outcome:
          type: string
          enum: [approved, rejected, review]
    AtonotaVerificationReceipt:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, duplicate]
    FrappeError:
      type: object
      description: |
        The usual Frappe error body. The client recognizes the error from the `exc_type` field.
        The custom values in this file are these: `InvalidRedirect`, `KeycloakLoginNotConfigured`,
        `InvalidLogoutToken`, `ServiceTokenRejected`, `UnknownIssuer`, `EmailMismatch`,
        `EmailNotVerified`, `IdentityConflict`, `DeskRoleNotAllowed`, `IdentityNotFound`,
        `EmailInUse`, `KeycloakSettingsMissing`, `InvalidInput`, `KeycloakKeysUnavailable`, `IdentityInternalError`,
        `ActionRefused`, `NoticeSignatureRejected` and `VerificationNotConfigured`.
        The general Frappe values can be `PermissionError`, `AuthenticationError`, `CSRFTokenError`,
        `DataError`, `RateLimitExceededError` and `ValidationError`.
        The `start_login` and `keycloak_callback` endpoints do not return this body. These two endpoints return an HTML page.
      required: [exc_type]
      properties:
        exc_type:
          type: string
          description: Name of the error class.
        exception:
          type: string
          description: Full path of the error class and a short message. It does not carry tokens or secrets.
        _server_messages:
          type: string
          description: |
            Text of a JSON array. Each item is the text of a JSON object and carries a `message` field.
            The message can be shown to the user.
