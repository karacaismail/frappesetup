openapi: 3.1.0
info:
  title: platform_core kimlik uçları
  version: 0.3.0
  summary: Keycloak ile giriş, dönüş, çıkış ve kullanıcı eşitleme uçları.
  description: |
    Bu sözleşme `platform_core.kimlik` modülünün uçlarını tarif eder.
    Kurallar `backend/docs/sozlesmeler.md` dosyasının 3, 4, 5 ve 8. bölümlerindedir.

    İşin amacı şudur. Kiracı sitesinin kullanıcısı Keycloak ile oturum açar.
    Keycloak kimlik sunucusudur. Parola ve kullanıcı kaydı orada durur.
    Kullanıcının kalıcı anahtarı `(iss, sub)` çiftidir. E-posta yalnız iletişim bilgisidir.
    Eşitleme servisi (`identity_sync`) kullanıcıyı bu uçlarla açar, kapatır ve günceller.

    Kiracı girişi kendi dönüş ucunu kullanır. Dönüş ucu `keycloak_callback` ucudur.
    Frappe'nin hazır `login_via_keycloak` ucu kullanılmaz. Nedeni şudur.
    Hazır uç `state` değerini tarayıcıya bağlamaz. Hazır uç kimlik belirtecini de saklamaz.
    Bu yüzden Keycloak oturum kimliği (`sid`) bulunmaz.
    Bu dosyada yalnız platform-core-kimlik işinin yazdığı uçlar vardır.

    Üç kimlik türü vardır.

    - Misafir uçlar kimlik istemez. `get_login_url`, `start_login`, `keycloak_callback` ve `keycloak_backchannel_logout` böyledir.
      Bu dört uç istek sınırlıdır. Sınır aşılınca 429 döner.
    - Oturum uçları `sid` çerezini ve `X-Frappe-CSRF-Token` başlığını birlikte ister.
      `logout` ve `setup_keycloak_login` böyledir.
    - Servis uçları `Authorization: Bearer <JWT>` başlığını ister. `identity.*` uçları böyledir.
      Belirteç kuralları `serviceToken` şemasının açıklamasındadır.

    Yol `/api/method/<python yolu>` biçimindedir. Bu Frappe'nin RPC yoludur.
    `start_login` ve `keycloak_callback` GET ister. Öteki uçlar POST ister.

    Giriş akışı şöyledir.

    1. Giriş iki yoldan başlar. Giriş sayfasındaki düğme `start_login` ucuna gider.
       Panel ise `get_login_url` ucunu çağırır ve dönen adrese gider.
       İki uç aynı işi yapar. Sunucu `state`, PKCE doğrulayıcısı ve `nonce` üretir.
       Sunucu bir tarayıcı değeri de üretir. Değer `kimlik_login` çerezine yazılır.
       Sunucu `state` kaydında bu değerin SHA-256 özetini, PKCE doğrulayıcısını, `nonce` değerini ve dönüş yolunu saklar. Kayıt 600 saniye yaşar.
    2. Tarayıcı Keycloak yetki adresine gider. Kullanıcı Keycloak'ta oturum açar.
    3. Keycloak tarayıcıyı `keycloak_callback` ucuna döndürür. Sunucu `state` kaydını tek bölünmez işlemle okur ve siler.
       Sunucu çerezi ve kimlik belirtecini doğrular. Sunucu Frappe oturumu açar ve tarayıcıyı dönüş yoluna yönlendirir.

    Giriş sayfası şöyledir.

    `platform_core` kiracının `/login` sayfasını kendi `www/login` sayfasıyla geçersiz kılar.
    Sayfada marka düğmesi vardır. Düğme metni `kimlik_marka_adi` ayarından gelir: “{marka} ile oturum aç”.
    Düğme `start_login` ucuna gider.
    `kimlik_yalniz_keycloak` ayarı açıkken sayfada yalnız bu düğme vardır. Parola formu yoktur.
    Ayar kapalıyken sayfada ayrıca yalın bir parola formu vardır. Form Frappe'nin `/api/method/login` ucunu kullanır.
    Sayfa `redirect-to` sorgu alanını alır. Değer güvenliyse sayfa onu `start_login` ucuna `redirect_to` olarak geçirir.

    Başarı gövdesi Frappe sarmalıdır: `{"message": <sonuç>}`.
    `start_login` ve `keycloak_callback` uçları bunun dışındadır. Bu iki uç tarayıcı akışıdır.
    Yanıtları HTML sayfa ya da yönlendirmedir.

    Hata gövdesi Frappe'nin olağan biçimidir. Şeması `FrappeError` altındadır.
    İstemci hatayı `exc_type` alanından tanır. Her hata yanıtında beklenen `exc_type` değerleri yazılıdır.
    `identity.*` uçlarında eksik ya da yanlış biçimli alan 400 ve `InvalidInput` döner.
    Gövde JSON olarak ayrıştırılamazsa Frappe uca gelmeden 417 ve `DataError` döner.
    Bu durum uçtaki `InvalidInput` denetiminden önce olur. Bu yanıt her JSON gövdeli uçta olabilir.
    Keycloak anahtar listesi alınamazsa belirteç doğrulanamaz. O zaman uç 503 ve `KeycloakKeysUnavailable` döner.

    `x-yikici` alanı ucun oturum kapatan ya da kullanıcıyı kapatan iş yapıp yapmadığını söyler.
    Hiçbir uç ücretli iş yapmaz.

    Site ayarları `x-site-settings` uzantısındadır. Sır değerleri bu dosyada yoktur.
    Yerel giriş kapısının kapsamı `x-yerel-giris-kapisi` uzantısındadır.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: "{site_url}/api/method"
    description: Kiracı sitesinin Frappe uç kökü.
    variables:
      site_url:
        default: http://kiraci1.localhost:8661
        description: Kiracı sitesinin kök adresi. Sonunda eğik çizgi olmaz.

tags:
  - name: giris
    description: Tarayıcının giriş, dönüş ve çıkış uçları.
  - name: kurulum
    description: Sitede Keycloak girişini açan yönetim ucu.
  - name: eşitleme
    description: Eşitleme servisinin kullanıcı uçları. Servis belirteci ister.

x-site-settings:
  description: |
    Ayarlar `site_config.json` dosyasında durur. Sır taşıyan ayar depoya girmez.
    `iss` değeri `<keycloak_public_url>/realms/<keycloak_realm>` olur.
    Anahtar listesi adresi `<keycloak_internal_url ya da keycloak_public_url>/realms/<keycloak_realm>/protocol/openid-connect/certs` olur.
  settings:
    - key: keycloak_public_url
      example: http://kimlik.localhost:8660
      required: true
      note: Tarayıcının gördüğü Keycloak adresi.
    - key: keycloak_internal_url
      example: ""
      required: false
      note: Sunucunun ulaştığı Keycloak adresi. Boşsa `keycloak_public_url` kullanılır.
    - key: keycloak_realm
      example: platform
      required: false
      note: Varsayılan `platform`.
    - key: keycloak_client_id
      example: site-kiraci1
      required: true
      note: Bu sitenin Keycloak istemcisi. Servis belirtecinde `aud` bu değerdir.
    - key: keycloak_client_secret
      example: "(sır, bu dosyada yazılmaz)"
      required: true
      note: Yalnız site ayarında ve `.env` dosyasında durur.
    - key: kimlik_marka_adi
      example: Atonota
      required: true
      note: Giriş düğmesinin metni bundan üretilir.
    - key: platform_panel_url
      example: http://kiraci1.localhost:8661/panel
      required: true
      note: Çıkıştan sonra tarayıcının döneceği adres. Girişte `redirect_to` yoksa dönüş adresi de budur.
    - key: kimlik_yalniz_keycloak
      example: 0
      required: false
      note: Varsayılan 0. Değer 1 olunca yerel giriş kapanır (AU-19). Kapsam `x-yerel-giris-kapisi` uzantısındadır.
    - key: kimlik_servis_azp
      example: ["identity-sync"]
      required: false
      note: Servis belirtecinde kabul edilen `azp` listesi. Varsayılan `["identity-sync"]`.

x-yerel-giris-kapisi:
  description: |
    `kimlik_yalniz_keycloak` ayarı 1 iken Frappe'nin yerel giriş işlevleri kapanır.
    Kapatma adrese değil, çağrılan işleve uygulanır. Bunun için `override_whitelisted_methods` kancası kullanılır.
    `/api/method`, `/api/v1/method`, `/api/v2/method` ve `cmd` biçimlerinin hepsi kapsamdadır.
    `start_login`, `keycloak_callback` ve bu dosyadaki öteki uçlar etkilenmez.
    Kapı açıkken `/login` sayfasında yalnız marka düğmesi vardır. Düğme `start_login` ucuna gider. Parola formu yoktur.
    Yönetici kurtarma yolu yalnız site ayarıyla açılır. Ayarı sunucuya erişen yönetici yazar.
  parola_girisi:
    description: Parola girişi 401 ve `AuthenticationError` döner.
    yollar:
      - /api/method/login
      - /api/v2/method/login
      - cmd=login
  kapatilan_islevler:
    description: Şu işlevler 403 ve `PermissionError` döner.
    islevler:
      - frappe.core.doctype.user.user.reset_password
      - frappe.core.doctype.user.user.update_password
      - frappe.core.doctype.user.user.sign_up
      - frappe.www.login.send_login_link
      - frappe.www.login.login_via_key
      - frappe.www.login.login_via_token
      - frappe.integrations.oauth2_logins.* (hazır sosyal giriş uçları)

paths:
  /platform_core.api.auth.get_login_url:
    post:
      tags: [giris]
      operationId: getLoginUrl
      summary: Keycloak giriş adresini üretir ve tarayıcı çerezini verir.
      description: |
        Panel sayfası bu ucu çağırır. Kullanıcı henüz oturum açmamıştır.
        Uç Keycloak'ın yetki adresini üretir ve döner.

        `login_url` içinde şunlar bulunur: `state`, `nonce`, `code_challenge`,
        `code_challenge_method=S256` ve `redirect_uri`.
        `redirect_uri` değeri `<site>/api/method/platform_core.api.auth.keycloak_callback` olur.
        `state`, `nonce` ve PKCE doğrulayıcısını sunucu üretir. Sunucu bunları 600 saniye saklar.

        Yanıt `Set-Cookie` başlığıyla bir tarayıcı değeri verir. Çerezin adı geliştirmede `kimlik_login` olur.
        HTTPS'te adı `__Host-kimlik_login` olur. Çerez `HttpOnly` ve `SameSite=Lax` olur.
        HTTPS'te `Secure` de olur. Ömrü 600 saniyedir.
        Sunucu `state` kaydında bu değerin SHA-256 özetini saklar. Dönüş ucu çerezi bu özetle karşılaştırır.

        `redirect_to` isteğe bağlıdır. Giriş bitince tarayıcı bu yola döner.
        Yalnız `/` ile başlayan göreli yol kabul edilir. `//` ile başlayan yol reddedilir.
        Ters eğik çizgi hiçbir yerde kabul edilmez. Boşluk ya da denetim karakteri de kabul edilmez.
        En çok 2048 karakter olabilir. Uygun olmayan yol 400 ve `InvalidRedirect` döner.
        `redirect_to` yoksa dönüş adresi `platform_panel_url` ayarıdır.

        Zorunlu site ayarlarından biri eksikse uç 503 döner.
        Zorunlu anahtarlar `x-site-settings` uzantısında yazılıdır.

        Aynı IP adresinden dakikada en çok 20 istek kabul edilir. Fazlası 429 alır.
        Uç kalıcı kayıt değiştirmez. Uç kişisel veri dönmez.
      x-yikici: false
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUrlRequest"
            examples:
              panelAnaSayfa:
                summary: Giriş bitince panele dön.
                value: {redirect_to: /panel}
              gövdesiz:
                summary: Dönüş yolu verilmedi. Dönüş adresi `platform_panel_url` olur.
                value: {}
      responses:
        "200":
          description: Giriş adresi, düğme metni ve tarayıcı çerezi.
          headers:
            Set-Cookie:
              description: |
                Giriş akışını tarayıcıya bağlayan çerez. Adı geliştirmede `kimlik_login`, HTTPS'te `__Host-kimlik_login` olur.
                Öznitelikleri `HttpOnly`, `SameSite=Lax`, `Path=/` ve `Max-Age=600` olur. HTTPS'te `Secure` de olur.
                Değer rastgeledir. Sunucu yalnız özetini saklar.
              schema:
                type: string
              examples:
                gelistirme:
                  value: "kimlik_login=9f3b2c1d8e7a6b5c4d3e2f1a0b9c8d7e; Path=/; Max-Age=600; HttpOnly; SameSite=Lax"
                https:
                  value: "__Host-kimlik_login=9f3b2c1d8e7a6b5c4d3e2f1a0b9c8d7e; Path=/; Max-Age=600; Secure; HttpOnly; SameSite=Lax"
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/LoginUrl"}
              examples:
                atonota:
                  value:
                    message:
                      login_url: "http://kimlik.localhost:8660/realms/platform/protocol/openid-connect/auth?client_id=site-kiraci1&response_type=code&scope=openid+profile+email&redirect_uri=http%3A%2F%2Fkiraci1.localhost%3A8661%2Fapi%2Fmethod%2Fplatform_core.api.auth.keycloak_callback&state=a1b2c3d4e5f6a7b8&nonce=c9d8e7f6a5b4c3d2&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256"
                      brand_name: Atonota
                      label: Atonota ile oturum aç
        "400":
          description: "`redirect_to` güvenli değil. `exc_type` değeri `InvalidRedirect` olur."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
              examples:
                disAdres:
                  value:
                    exc_type: InvalidRedirect
                    exception: "platform_core.kimlik.hatalar.InvalidRedirect: redirect_to"
                    _server_messages: '["{\"message\": \"Dönüş yolu güvenli değil.\"}"]'
        "417":
          $ref: "#/components/responses/GovdeBozuk"
        "429":
          $ref: "#/components/responses/IstekSiniri"
        "503":
          description: |
            Keycloak girişi bu sitede kurulu değil. `exc_type` değeri `KeycloakLoginNotConfigured` olur.
            Zorunlu site ayarlarından biri eksik. Hata iletisi eksik anahtarın adını söyler. Değerini söylemez.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
              examples:
                kuruluDegil:
                  value:
                    exc_type: KeycloakLoginNotConfigured
                    exception: "platform_core.kimlik.hatalar.KeycloakLoginNotConfigured: keycloak_client_id"
                    _server_messages: '["{\"message\": \"Keycloak girişi bu sitede kurulu değil: keycloak_client_id\"}"]'

  /platform_core.api.auth.start_login:
    get:
      tags: [giris]
      operationId: startLogin
      summary: Giriş akışını başlatır ve tarayıcıyı Keycloak'a yönlendirir.
      description: |
        Giriş sayfasındaki “{marka} ile oturum aç” düğmesi bu uca gider. Kullanıcı henüz oturum açmamıştır.
        Bu uç tarayıcı akışıdır. Yanıt yönlendirme ya da HTML sayfadır.
        Hata yanıtları JSON değildir. Bu yüzden `exc_type` yoktur. Sayfa bir başlık ve kısa bir açıklama gösterir.

        Uç `get_login_url` ile aynı işi yapar. Sunucu `state`, PKCE doğrulayıcısı ve `nonce` üretir.
        Sunucu tarayıcı değerini `kimlik_login` çerezine yazar. Çerez kuralları `get_login_url` ucundaki gibidir.
        Sunucu `state` kaydını 600 saniye saklar.
        Sonra uç tarayıcıyı Keycloak yetki adresine 302 ile yönlendirir. Adres `get_login_url` ucunun döndürdüğü adresle aynı biçimdedir.

        `redirect_to` isteğe bağlıdır. Kuralı `get_login_url` ucundaki ile aynıdır.
        Yalnız `/` ile başlayan göreli yol kabul edilir. `//` ile başlayan yol reddedilir.
        Ters eğik çizgi hiçbir yerde kabul edilmez. Uygun olmayan yol 400 döner.
        `redirect_to` yoksa dönüş adresi `platform_panel_url` ayarıdır.

        Zorunlu site ayarlarından biri eksikse uç 503 döner.
        Aynı IP adresinden dakikada en çok 20 istek kabul edilir. Fazlası 429 alır.
        Uç kalıcı kayıt değiştirmez. Uç oturum açmaz. Oturumu `keycloak_callback` ucu açar.
      x-yikici: false
      security: []
      parameters:
        - name: redirect_to
          in: query
          required: false
          description: |
            Giriş bitince dönülecek göreli yol. `/` ile başlar. `//` ile başlayamaz.
            Ters eğik çizgi hiçbir yerde olamaz. Boşluk ve denetim karakteri içeremez.
            En çok 2048 karakter olur. Verilmezse dönüş adresi `platform_panel_url` olur.
          schema:
            type: string
            maxLength: 2048
            pattern: '^/(?!/)[^\\\s\x00-\x1f\x7f]*$'
          examples:
            panel:
              value: /panel
      responses:
        "302":
          description: Akış başlatıldı. Tarayıcı Keycloak yetki adresine gider.
          headers:
            Location:
              description: |
                Keycloak yetki adresi. Adres `state`, `nonce`, `code_challenge`, `code_challenge_method=S256` ve `redirect_uri` taşır.
                `redirect_uri` değeri bu sitenin `keycloak_callback` ucudur.
              schema: {type: string, format: uri}
              examples:
                atonota:
                  value: "http://kimlik.localhost:8660/realms/platform/protocol/openid-connect/auth?client_id=site-kiraci1&response_type=code&scope=openid+profile+email&redirect_uri=http%3A%2F%2Fkiraci1.localhost%3A8661%2Fapi%2Fmethod%2Fplatform_core.api.auth.keycloak_callback&state=a1b2c3d4e5f6a7b8&nonce=c9d8e7f6a5b4c3d2&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256"
            Set-Cookie:
              description: |
                Giriş akışını tarayıcıya bağlayan çerez. Adı geliştirmede `kimlik_login`, HTTPS'te `__Host-kimlik_login` olur.
                Öznitelikleri `HttpOnly`, `SameSite=Lax`, `Path=/` ve `Max-Age=600` olur. HTTPS'te `Secure` de olur.
              schema: {type: string}
              examples:
                gelistirme:
                  value: "kimlik_login=9f3b2c1d8e7a6b5c4d3e2f1a0b9c8d7e; Path=/; Max-Age=600; HttpOnly; SameSite=Lax"
        "400":
          description: |
            `redirect_to` güvenli değil. Sayfa başlığı “Dönüş yolu güvenli değil” olur.
            Sayfa kullanıcıya giriş sayfasına dönmesini söyler.
          content:
            text/html:
              schema: {$ref: "#/components/schemas/HtmlSayfa"}
        "429":
          description: İstek sınırı aşıldı. Sınır IP adresine göre sayılır. Yanıt HTML sayfadır.
          content:
            text/html:
              schema: {$ref: "#/components/schemas/HtmlSayfa"}
        "503":
          description: |
            Keycloak girişi bu sitede kurulu değil. Zorunlu site ayarlarından biri eksik.
            Sayfa başlığı “Giriş bu sitede kurulu değil” olur. Sayfa eksik anahtarın adını göstermez.
          content:
            text/html:
              schema: {$ref: "#/components/schemas/HtmlSayfa"}

  /platform_core.api.auth.keycloak_callback:
    get:
      tags: [giris]
      operationId: keycloakCallback
      summary: Keycloak'tan dönen tarayıcıyı karşılar ve Frappe oturumu açar.
      description: |
        Keycloak tarayıcıyı bu uca döndürür. Kullanıcı Keycloak'ta oturum açmıştır.
        Bu uç tarayıcı akışıdır. Yanıt HTML sayfa ya da yönlendirmedir.
        Hata yanıtları JSON değildir. Bu yüzden `exc_type` yoktur. Sayfa bir başlık ve kısa bir açıklama gösterir.

        Sunucu şu sırayla çalışır.

        1. Sunucu `state` kaydını tek bölünmez işlemle okur ve siler. Örneğin Redis `GETDEL` kullanılır.
           Kayıt yoksa, süresi dolmuşsa ya da daha önce kullanılmışsa 400 döner.
        2. Sunucu `kimlik_login` çerezini okur. Çerez yoksa 400 döner.
           Çerezdeki değerin SHA-256 özeti kayıttaki özetle eşleşmezse 403 döner.
        3. Keycloak `error` döndürmüşse sunucu 400 döner. Kod değişimi yapılmaz.
        4. Sunucu kodu Keycloak token ucunda PKCE `code_verifier` ile belirteçle değiştirir.
           Değişim başarısız olursa 400 döner.
        5. Sunucu kimlik belirtecini `oidc_verify.verify_id_token` ile doğrular. `nonce` da denetlenir.
           Belirteç geçersizse 400 döner.
        6. Sunucu kullanıcıyı `(iss, sub)` bağıyla bulur.
           Bağ yoksa ve e-posta doğrulanmışsa aynı e-postalı kullanıcıya ilk bağ kurulur.
           Doğrulanmamış e-postayla ilk bağ kurulmaz. Bu durumda 403 döner.
           Bilinmeyen e-posta 403 alır. Kayıt açılmaz. Kullanıcıyı eşitleme servisi açar.
           Bağ başka kullanıcıya aitse 403 döner. Aynı e-posta başka `sub` değerine bağlıysa 403 döner.
           Kapalı kullanıcı 403 alır.
        7. Kullanıcı çalışansa sunucu kimlik belirtecinin `auth_time` değerine bakar (O-25).
           Çalışan, masaüstü rolü olan “System User” kullanıcısıdır.
           Değer yoksa ya da 3600 saniyeden eskiyse oturum açılmaz.
           Sunucu yeni bir `state` üretir ve tarayıcıyı `prompt=login` ile Keycloak'a geri yollar. Yanıt 302 olur.
           Böylece açık Keycloak çerezi yeniden kimlik doğrulamayı atlatmaz.
           Bu ikinci denemede de değer eskiyse 403 döner. Müşteri bu adımdan geçmez.
        8. Sunucu Frappe oturumu açar. Keycloak oturum kimliği (`sid`) oturum verisine yazılır.
           Arka kanal çıkışı bu değerle eşleşir.
           Oturum 1 saat işlem olmazsa kapanır. Süre oturum verisinde `session_expiry` olarak durur.
        9. Sunucu tarayıcıyı `redirect_to` yoluna yönlendirir. Yol kayıtta yoksa `platform_panel_url` adresine yönlendirir.

        Keycloak'a ulaşılamazsa ya da anahtar listesi alınamazsa 503 döner.
        Aynı IP adresinden dakikada en çok 20 istek kabul edilir. Fazlası 429 alır.

        Uç oturum açar. Uç oturum kapatmaz. Uç kullanıcı kaydı açmaz.
      x-yikici: false
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Keycloak'ın verdiği yetki kodu. Tek kullanımlıktır.
          schema: {type: string, minLength: 1, maxLength: 4096}
        - name: state
          in: query
          required: true
          description: "`get_login_url` ucunun ürettiği `state` değeri. Kayıt bu değerle bulunur."
          schema: {type: string, minLength: 1, maxLength: 255}
        - name: error
          in: query
          required: false
          description: Keycloak giriş başarısız olunca bunu gönderir. Örneğin `access_denied`. Varsa sunucu 400 döner.
          schema: {type: string, maxLength: 255}
        - name: error_description
          in: query
          required: false
          description: Keycloak'ın hata açıklaması. Sayfada kullanıcıya gösterilmez. Günlüğe kısaltılarak yazılır.
          schema: {type: string, maxLength: 1024}
        - name: kimlik_login
          in: cookie
          required: true
          description: |
            `get_login_url` ucunun verdiği tarayıcı çerezi. HTTPS'te adı `__Host-kimlik_login` olur.
            Çerez yoksa 400 döner. Özeti kayıtla eşleşmezse 403 döner.
          schema: {type: string, minLength: 1, maxLength: 255}
      responses:
        "302":
          description: Giriş başarılı. Frappe oturumu açıldı. Tarayıcı dönüş yoluna gider.
          headers:
            Location:
              description: "`redirect_to` yolu. Kayıtta yol yoksa `platform_panel_url` adresi."
              schema: {type: string}
              examples:
                panel:
                  value: /panel
            Set-Cookie:
              description: Frappe oturum çerezleri. `sid` bunlardan biridir. Giriş çerezi `kimlik_login` silinir.
              schema: {type: string}
        "400":
          description: |
            Giriş tamamlanamadı. Sayfa başlığı “Giriş tamamlanamadı” olur. Nedenlerden biri şudur:

            - `state` eksik, süresi dolmuş ya da daha önce kullanılmış,
            - `kimlik_login` çerezi eksik,
            - Keycloak `error` döndürmüş,
            - kod değişimi başarısız,
            - kimlik belirteci geçersiz. `nonce` uyuşmazlığı da buna girer.

            Sayfa kullanıcıya girişi yeniden başlatmasını söyler.
          content:
            text/html:
              schema: {$ref: "#/components/schemas/HtmlSayfa"}
        "403":
          description: |
            Giriş reddedildi. Sayfa başlığı “Giriş reddedildi” olur. Nedenlerden biri şudur:

            - çerez özeti kayıtla uyuşmuyor,
            - kimlik bağı başka kullanıcıya ait,
            - aynı e-posta başka bir `sub` değerine bağlı,
            - e-posta doğrulanmamış,
            - kullanıcı bu sitede yok,
            - kullanıcı kapalı.

            Sayfa nedeni ayrıntılı yazmaz. Sayfa kullanıcıya yöneticisine başvurmasını söyler.
          content:
            text/html:
              schema: {$ref: "#/components/schemas/HtmlSayfa"}
        "429":
          description: İstek sınırı aşıldı. Sınır IP adresine göre sayılır. Yanıt HTML sayfadır.
          content:
            text/html:
              schema: {$ref: "#/components/schemas/HtmlSayfa"}
        "503":
          description: |
            Keycloak'a ulaşılamadı ya da anahtar listesi alınamadı. Sayfa başlığı “Kimlik sunucusuna ulaşılamadı” olur.
            Sayfa kullanıcıya biraz sonra yeniden denemesini söyler.
          content:
            text/html:
              schema: {$ref: "#/components/schemas/HtmlSayfa"}

  /platform_core.api.auth.logout:
    post:
      tags: [giris]
      operationId: logout
      summary: Frappe oturumunu kapatır ve Keycloak çıkış adresini döner.
      description: |
        Panel sayfası bu ucu çağırır. Kullanıcı çıkış düğmesine basmıştır.

        **Bu uç oturum kapatır.** Uç çağıranın Frappe oturumunu hemen kapatır.
        `sid` çerezi bundan sonra geçersizdir. Geri alınamaz.

        Uç Keycloak çıkış adresini döner. Panel tarayıcıyı bu adrese yönlendirir.
        Keycloak oturumu ancak o zaman kapanır.
        Adres `client_id` ve `post_logout_redirect_uri` taşır. Dönüş adresi `platform_panel_url` ayarıdır.

        Bilinen sınır: Adreste `id_token_hint` yoktur. Sunucu kimlik belirtecini saklamaz.
        Bu yüzden Keycloak bir onay ekranı gösterebilir.

        İstek gövdesizdir. Misafir isteği 403 alır. Süresi biten oturum 401 alır.
      x-yikici: true
      security:
        - frappeSession: []
          csrfToken: []
      responses:
        "200":
          description: Frappe oturumu kapandı. Tarayıcı `logout_url` adresine gitmelidir.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/LogoutUrl"}
              examples:
                atonota:
                  value:
                    message:
                      logout_url: "http://kimlik.localhost:8660/realms/platform/protocol/openid-connect/logout?client_id=site-kiraci1&post_logout_redirect_uri=http%3A%2F%2Fkiraci1.localhost%3A8661%2Fpanel"
        "403":
          description: |
            Misafir isteği. Çerez hiç yoktur. `exc_type` değeri `PermissionError` olur.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "400":
          description: CSRF başlığı yok ya da yanlış. `exc_type` değeri `CSRFTokenError` olur.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "401":
          $ref: "#/components/responses/OturumBitti"

  /platform_core.api.auth.setup_keycloak_login:
    post:
      tags: [kurulum]
      operationId: setupKeycloakLogin
      summary: Sitede Keycloak girişini açar.
      description: |
        Site yöneticisi bu ucu çağırır. Yalnız “System Manager” rolü çağırabilir.

        Uç “Social Login Key” kaydı `keycloak` yoksa kaydı açar. Kayıt varsa kaydı günceller.
        Kayıt `provider_name` alanında marka adını taşır. Kullanıcı kimliği `sub` alanından okunur.
        Kayıt yalnız yönetim ekranında görünürlük içindir. Giriş akışı bu kayıttan geçmez.
        Giriş akışı `get_login_url` ve `keycloak_callback` uçlarındadır.

        Uç aynı isteği iki kez alırsa aynı sonucu döner. İkinci çağrı bir şey bozmaz.

        Site ayarlarında zorunlu bir anahtar eksikse uç 400 döner.
        Zorunlu anahtarlar `x-site-settings` uzantısında yazılıdır.

        İstek gövdesizdir. Uç oturum kapatmaz. Uç ücretli iş yapmaz.
      x-yikici: false
      security:
        - frappeSession: []
          csrfToken: []
      responses:
        "200":
          description: Keycloak girişi açık.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/SetupResult"}
              examples:
                atonota:
                  value:
                    message:
                      social_login_key: keycloak
                      enabled: true
                      provider_name: Atonota
        "400":
          description: |
            Site ayarı eksik. `exc_type` değeri `KeycloakSettingsMissing` olur.
            Hata iletisi eksik anahtarın adını söyler. Değerini söylemez.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
              examples:
                markaEksik:
                  value:
                    exc_type: KeycloakSettingsMissing
                    exception: "platform_core.kimlik.hatalar.KeycloakSettingsMissing: kimlik_marka_adi"
                    _server_messages: '["{\"message\": \"Site ayarı eksik: kimlik_marka_adi\"}"]'
        "403":
          description: |
            Çağıran “System Manager” değil ya da misafir. `exc_type` değeri `PermissionError` olur.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
        "401":
          $ref: "#/components/responses/OturumBitti"

  /platform_core.api.keycloak_backchannel_logout:
    post:
      tags: [giris]
      operationId: keycloakBackchannelLogout
      summary: Keycloak'ın çıkış belirteciyle eşleşen Frappe oturumlarını kapatır.
      description: |
        Keycloak bu ucu çağırır. Kullanıcı Keycloak'ta çıkış yapınca Keycloak `logout_token` gönderir.
        Bu uç OpenID Connect “Back-Channel Logout” ucudur. Tarayıcı bu ucu çağırmaz.

        **Bu uç oturum kapatır.** Eşleşen bütün Frappe oturumları hemen kapanır. Geri alınamaz.

        Belirteç şöyle doğrulanır: imza, `iss`, `aud`, `iat`, `exp`, `jti`, çıkış olayı anahtarı,
        `sid` ya da `sub` varlığı ve `nonce` yokluğu. Saat payı 30 saniyedir.
        `events` içindeki çıkış olayının değeri JSON nesnesi olmalıdır. `sid` varsa metin olmalıdır.
        Sunucu işlenen `jti` değerini belirtecin ömrü boyunca saklar. Aynı `jti` yeniden gelirse reddedilir.
        Kurallar `docs/sozlesmeler.md` 3. bölümdedir.

        Eşleşme sırası:

        1. Belirteçte `sid` varsa oturum verisinde aynı `keycloak_sid` değerini taşıyan oturumlar kapanır.
        2. Eşleşme yoksa ve `sub` varsa `(iss, sub)` bağındaki kullanıcının oturumları kapanır.
           Bu yedek yol yalnız belirtecin `iat` değerinden önce açılmış oturumları kapatır.
           Bildiriden sonra açılan oturumlar açık kalır.

        Eşleşen oturum yoksa yanıt yine 200 olur. `closed_sessions` değeri 0 olur.
        Yanıt `Cache-Control: no-store` başlığı taşır.

        İstek misafir olmalıdır. İstek Guest dışı bir oturum çerezi taşırsa 400 döner.
        Belirteç eksik ya da geçersizse 400 döner. Uç nedeni ayrıntılı yazmaz.
        Keycloak anahtar listesi alınamazsa 503 döner. Keycloak isteği sonra yeniden gönderir.

        Aynı IP adresinden dakikada en çok 300 istek kabul edilir. Fazlası 429 alır.
      x-yikici: true
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LogoutTokenForm"
            examples:
              keycloak:
                summary: Keycloak'ın gönderdiği form.
                value:
                  logout_token: eyJhbGciOiJSUzI1NiIsImtpZCI6Im9ybmVrIn0.eyJpc3MiOiJodHRwOi8va2ltbGlrLmxvY2FsaG9zdDo4NjYwL3JlYWxtcy9wbGF0Zm9ybSJ9.ornek-imza
      responses:
        "200":
          description: İstek işlendi. Kapanan oturum sayısı döner.
          headers:
            Cache-Control:
              description: Her zaman `no-store` olur.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/BackchannelLogoutResult"}
              examples:
                ikiOturum:
                  value: {message: {closed_sessions: 2}}
                eslesmeYok:
                  value: {message: {closed_sessions: 0}}
        "400":
          description: |
            Belirteç kabul edilmedi. `exc_type` değeri `InvalidLogoutToken` olur. Nedenlerden biri şudur:

            - `logout_token` eksik,
            - imza, `iss` ya da `aud` yanlış,
            - `iat`, `exp` ya da `jti` eksik,
            - `exp` geçmiş ya da `iat` ileride,
            - `events` içinde çıkış olayı yok ya da değeri JSON nesnesi değil,
            - `sid` ve `sub` ikisi de yok,
            - `sid` var ama metin değil,
            - `nonce` var,
            - aynı `jti` daha önce işlenmiş (tekrar gönderim),
            - istek Guest dışı oturum çerezi taşıyor.

            İleti nedeni ayrıntılı yazmaz.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
              examples:
                gecersiz:
                  value:
                    exc_type: InvalidLogoutToken
                    exception: "platform_core.kimlik.hatalar.InvalidLogoutToken: logout_token"
                    _server_messages: '["{\"message\": \"Çıkış belirteci geçersiz.\"}"]'
        "429":
          $ref: "#/components/responses/IstekSiniri"
        "503":
          $ref: "#/components/responses/AnahtarListesiYok"

  /platform_core.api.identity.provision:
    post:
      tags: [eşitleme]
      operationId: identityProvision
      summary: Kullanıcıyı açar ya da günceller ve kimlik bağını kurar.
      description: |
        Eşitleme servisi bu ucu çağırır. Servis belirteci `azp=identity-sync` taşımalıdır.

        Uç önce girdiyi denetler. `issuer`, `subject`, `email`, `email_verified` ve `enabled` zorunludur.
        `email_verified` ve `enabled` doğru ya da yanlış olmalıdır. `first_name` ve `last_name` metin olmalıdır.
        `role_profiles` içindeki her rol profili sitede var olmalıdır. Aksi durumda 400 ve `InvalidInput` döner.

        Uç sonra `issuer` değerini sitenin `iss` değeriyle karşılaştırır. Farklıysa 400 döner.

        Bağ `(issuer, subject)` varsa kullanıcı bulunmuştur. Uç ad, soyad, `enabled` ve
        `role_profiles` alanlarını günceller. `email` kullanıcının adından farklıysa 409 döner.
        E-posta değişikliği yalnız `change_email` ucundan yapılır.

        Bağ yoksa uç yeni bağ kurar. Bunun için `email_verified` doğru olmalıdır.
        Aynı e-postalı kullanıcı aynı `issuer` ile başka bir `subject` değerine bağlıysa 409 döner.
        Aynı e-postalı kullanıcı var ama “Website User” değilse 409 döner.
        Aynı e-postalı kullanıcının masaüstü erişimi açık bir rolü varsa da 409 döner.
        Yönetim hesapları eşitlemeyle sahiplenilmez.
        Kullanıcı yoksa uç “Website User” türünde kullanıcı açar. Hoş geldin e-postası gönderilmez.
        Yeni kullanıcıya rol verilmez.

        `role_profiles` içindeki bir rolün `desk_access` değeri 1 ise 400 döner.
        Masaüstü erişimi bu uçtan verilmez.

        Uç aynı istekte aynı gövdeyi döner. İkinci çağrı bir şey değiştirmez.
        `enabled` yanlış gelirse kullanıcı kapanır. Bu bakımdan uç yıkıcı iş yapabilir.
      x-yikici: true
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionRequest"
            examples:
              yeniKullanici:
                summary: Doğrulanmış e-postalı yeni kullanıcı.
                value:
                  issuer: http://kimlik.localhost:8660/realms/platform
                  subject: 11111111-1111-4111-8111-111111111111
                  email: kiraci1.kullanici1@example.test
                  email_verified: true
                  first_name: Deneme
                  last_name: Kullanıcı
                  enabled: true
                  role_profiles: [Portal Kullanıcısı]
      responses:
        "200":
          description: Kullanıcı açık ya da güncel. İki çağrıda aynı gövde döner.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/ProvisionResult"}
              examples:
                yeniKullanici:
                  value:
                    message:
                      user: kiraci1.kullanici1@example.test
                      enabled: true
                      linked: true
                      user_type: Website User
        "400":
          description: |
            Girdi kabul edilmedi. `exc_type` değeri şunlardan biri olur.

            - `issuer` sitenin `iss` değerinden farklıysa `UnknownIssuer` döner.
            - `role_profiles` içinde masaüstü erişimi veren rol varsa `DeskRoleNotAllowed` döner.
            - Alan eksikse ya da yanlış biçimliyse `InvalidInput` döner. Örnekler şunlardır.
              `email` eksik. `email_verified` eksik. `enabled` doğru ya da yanlış değil.
              `first_name` metin değil. `role_profiles` içinde var olmayan rol profili var.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
              examples:
                yabanciIssuer:
                  value:
                    exc_type: UnknownIssuer
                    exception: "platform_core.kimlik.hatalar.UnknownIssuer: issuer"
                    _server_messages: '["{\"message\": \"issuer bu sitenin kimlik sunucusu değil.\"}"]'
                dogrulamaEksik:
                  value:
                    exc_type: InvalidInput
                    exception: "platform_core.kimlik.hatalar.InvalidInput: email_verified"
                    _server_messages: '["{\"message\": \"email_verified alanı zorunlu.\"}"]'
        "401":
          $ref: "#/components/responses/ServisBelirteciReddi"
        "403":
          $ref: "#/components/responses/ServisYetkisiYok"
        "409":
          description: |
            İstek sitedeki durumla çelişiyor. `exc_type` değeri şunlardan biri olur.

            - Bağ var ama `email` kullanıcının adından farklıysa `EmailMismatch` döner. E-postayı `change_email` ile değiştirin.
            - Bağ yok ve `email_verified` yanlışsa `EmailNotVerified` döner. İlk bağ kurulmaz.
            - Aynı e-postalı kullanıcı aynı `issuer` ile başka bir `subject` değerine bağlıysa `IdentityConflict` döner.
            - Bağsız var olan kullanıcı “Website User” değilse `IdentityConflict` döner.
            - Bağsız var olan kullanıcının masaüstü erişimi açık bir rolü varsa `IdentityConflict` döner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
              examples:
                dogrulanmamis:
                  value:
                    exc_type: EmailNotVerified
                    exception: "platform_core.kimlik.hatalar.EmailNotVerified: email_verified"
                    _server_messages: '["{\"message\": \"E-posta doğrulanmadan ilk bağ kurulmaz.\"}"]'
                yonetimHesabi:
                  value:
                    exc_type: IdentityConflict
                    exception: "platform_core.kimlik.hatalar.IdentityConflict: email"
                    _server_messages: '["{\"message\": \"Bu e-posta eşitlemeyle sahiplenilemeyen bir hesaba ait.\"}"]'
        "417":
          $ref: "#/components/responses/GovdeBozuk"
        "503":
          $ref: "#/components/responses/AnahtarListesiYok"

  /platform_core.api.identity.set_enabled:
    post:
      tags: [eşitleme]
      operationId: identitySetEnabled
      summary: Bağlı kullanıcıyı açar ya da kapatır.
      description: |
        Eşitleme servisi bu ucu çağırır. Servis belirteci `azp=identity-sync` taşımalıdır.

        **Bu uç kullanıcıyı kapatabilir.** `enabled` yanlış gelince kullanıcı kapanır.
        Kapalı kullanıcı oturum açamaz. Aynı uç `enabled` doğru ile çağrılınca kullanıcı yeniden açılır.

        Bağ `(issuer, subject)` yoksa 404 döner. Uç yeni kullanıcı açmaz.
        Uç aynı istekte aynı gövdeyi döner.
      x-yikici: true
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEnabledRequest"
            examples:
              kapat:
                summary: Kullanıcıyı kapat.
                value:
                  issuer: http://kimlik.localhost:8660/realms/platform
                  subject: 11111111-1111-4111-8111-111111111111
                  enabled: false
      responses:
        "200":
          description: Kullanıcının son durumu.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/SetEnabledResult"}
              examples:
                kapatildi:
                  value:
                    message: {user: kiraci1.kullanici1@example.test, enabled: false}
        "400":
          $ref: "#/components/responses/GirdiGecersiz"
        "401":
          $ref: "#/components/responses/ServisBelirteciReddi"
        "403":
          $ref: "#/components/responses/ServisYetkisiYok"
        "404":
          $ref: "#/components/responses/BagYok"
        "417":
          $ref: "#/components/responses/GovdeBozuk"
        "503":
          $ref: "#/components/responses/AnahtarListesiYok"

  /platform_core.api.identity.change_email:
    post:
      tags: [eşitleme]
      operationId: identityChangeEmail
      summary: Bağlı kullanıcının e-postasını değiştirir.
      description: |
        Eşitleme servisi bu ucu çağırır. Servis belirteci `azp=identity-sync` taşımalıdır.

        **Bu uç kullanıcının adını değiştirir.** Frappe'de kullanıcının adı e-postasıdır.
        Uç kaydı `rename_doc` ile yeniden adlandırır. Kullanıcıya bağlı bütün kayıtlar yeni ada taşınır.
        Eski e-postayla açık oturumlar kapanabilir. İşlem geri alınmaz.
        Geri almak için uç eski e-postayla yeniden çağrılır.

        Bağ `(issuer, subject)` yoksa 404 döner.
        `new_email` başka bir kullanıcıya aitse 409 döner.
        `new_email` kullanıcının şimdiki e-postasıysa hiçbir şey değişmez ve 200 döner.
        Uç aynı istekte aynı gövdeyi döner.
      x-yikici: true
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
            examples:
              yeniEposta:
                value:
                  issuer: http://kimlik.localhost:8660/realms/platform
                  subject: 11111111-1111-4111-8111-111111111111
                  new_email: kiraci1.kullanici1.yeni@example.test
      responses:
        "200":
          description: Kullanıcının yeni adı.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/ChangeEmailResult"}
              examples:
                degisti:
                  value:
                    message: {user: kiraci1.kullanici1.yeni@example.test}
        "400":
          $ref: "#/components/responses/GirdiGecersiz"
        "401":
          $ref: "#/components/responses/ServisBelirteciReddi"
        "403":
          $ref: "#/components/responses/ServisYetkisiYok"
        "404":
          $ref: "#/components/responses/BagYok"
        "409":
          description: "`new_email` başka bir kullanıcıya ait. `exc_type` değeri `EmailInUse` olur."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrappeError"}
              examples:
                kullanimda:
                  value:
                    exc_type: EmailInUse
                    exception: "platform_core.kimlik.hatalar.EmailInUse: new_email"
                    _server_messages: '["{\"message\": \"Bu e-posta başka bir kullanıcıya ait.\"}"]'
        "417":
          $ref: "#/components/responses/GovdeBozuk"
        "503":
          $ref: "#/components/responses/AnahtarListesiYok"

components:
  securitySchemes:
    frappeSession:
      type: apiKey
      in: cookie
      name: sid
      description: |
        Frappe oturum çerezi. Tek başına yetmez. POST isteği `csrfToken` başlığını da taşır.
        Bu çerezle birlikte `Authorization` başlığı gönderilmez.
    csrfToken:
      type: apiKey
      in: header
      name: X-Frappe-CSRF-Token
      description: |
        Frappe'nin CSRF belirteci. `/panel` sayfası bu değeri taşır.
        Başlık yoksa ya da yanlışsa Frappe 403 döner.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak'ın verdiği servis belirteci. Yalnız `platform_core.api.identity.*` yollarında aranır.
        Sunucu belirteci `libs/oidc_verify` kitaplığıyla doğrular. Kurallar şunlardır:

        - Yalnız RS256 imzası kabul edilir.
        - `iss` sitenin `iss` değeriyle tam eşleşir.
        - `aud` tek değerdir. Değer sitenin `keycloak_client_id` ayarıdır.
        - `azp` değeri `kimlik_servis_azp` listesinde olmalıdır. Varsayılan liste `["identity-sync"]` olur.
        - `exp` zorunludur. Saat payı 30 saniyedir.
        - İstekte `cmd` alanı varsa istek reddedilir.
        - İstek hem Guest dışı oturum çerezi hem belirteç taşıyorsa istek reddedilir.

        Red yanıtı 401 ve `ServiceTokenRejected` olur. İleti ret nedeninin kodunu taşır.
        İleti belirteci taşımaz. Sunucu belirteci günlüğe yazmaz.
        Belirteç hiç yoksa uç 403 ve `PermissionError` döner.
        Keycloak anahtar listesi alınamazsa uç 503 ve `KeycloakKeysUnavailable` döner.

  responses:
    IstekSiniri:
      description: |
        İstek sınırı aşıldı. Sınır IP adresine göre sayılır.
        `exc_type` değeri Frappe'nin `RateLimitExceededError` değeridir.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
    OturumBitti:
      description: |
        Oturumun süresi bitti. Kullanıcı 1 saat işlem yapmadı ya da oturum kapatıldı (O-25).
        `exc_type` değeri Frappe'nin `SessionExpired` değeridir. Frappe `sid` çerezini siler.
        Bu yanıt yetki reddi değildir. İstemci kullanıcıyı giriş sayfasına yollar (SZ-8).
        Çerez hiç yoksa bu yanıt dönmez. O durumda 403 ve `PermissionError` döner.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            boslukta:
              value:
                exc_type: SessionExpired
                exception: "frappe.exceptions.SessionExpired"
    GovdeBozuk:
      description: |
        Gövde JSON olarak ayrıştırılamadı. Frappe isteği uca iletmeden reddetti.
        `exc_type` değeri Frappe'nin `DataError` değeridir.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
    ServisBelirteciReddi:
      description: |
        Servis belirteci geçersiz. `exc_type` değeri `ServiceTokenRejected` olur. İleti ret kodunu taşır.
        Kodlar `malformed`, `invalid_signature`, `unknown_kid`, `wrong_issuer`, `wrong_audience`,
        `wrong_azp`, `expired` ve `not_yet_valid` olabilir.
        İstekte `cmd` alanı varsa ya da Guest dışı çerez de varsa aynı hata döner.
        Belirteç hiç yoksa bu yanıt dönmez. O durumda 403 döner.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            suresiDolmus:
              value:
                exc_type: ServiceTokenRejected
                exception: "platform_core.kimlik.hatalar.ServiceTokenRejected: expired"
                _server_messages: '["{\"message\": \"Servis belirteci reddedildi: expired\"}"]'
    ServisYetkisiYok:
      description: |
        Çağıranın bu uca yetkisi yok. `exc_type` değeri `PermissionError` olur. İki durumda döner.

        - İstek servis belirteci taşımıyor. Örneğin yalnız oturum çerezi var ya da hiç kimlik yok.
        - Belirteç geçerli ama `azp` değeri `identity-sync` değil.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
    GirdiGecersiz:
      description: |
        Alan eksik ya da yanlış biçimli. `exc_type` değeri `InvalidInput` olur.
        Örneğin `subject` eksik, `enabled` doğru ya da yanlış değil, `new_email` e-posta biçiminde değil.
        İleti hatalı alanın adını söyler.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            enabledYanlis:
              value:
                exc_type: InvalidInput
                exception: "platform_core.kimlik.hatalar.InvalidInput: enabled"
                _server_messages: '["{\"message\": \"enabled alanı doğru ya da yanlış olmalı.\"}"]'
    AnahtarListesiYok:
      description: |
        Keycloak anahtar listesi alınamadı. Belirteç doğrulanamadı. `exc_type` değeri `KeycloakKeysUnavailable` olur.
        Sunucu isteği işlemedi. Çağıran isteği sonra yeniden gönderir.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            keycloakKapali:
              value:
                exc_type: KeycloakKeysUnavailable
                exception: "platform_core.kimlik.hatalar.KeycloakKeysUnavailable: jwks"
                _server_messages: '["{\"message\": \"Keycloak anahtar listesi alınamadı.\"}"]'
    BagYok:
      description: "`(issuer, subject)` bağı yok. `exc_type` değeri `IdentityNotFound` olur."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            bagYok:
              value:
                exc_type: IdentityNotFound
                exception: "platform_core.kimlik.hatalar.IdentityNotFound: subject"
                _server_messages: '["{\"message\": \"Bu kimlik için bağ yok.\"}"]'

  schemas:
    Issuer:
      type: string
      format: uri
      minLength: 1
      maxLength: 255
      description: |
        Kimlik sunucusunun `iss` değeri. Sitenin `iss` değeriyle tam eşleşmelidir.
        Biçim `<keycloak_public_url>/realms/<keycloak_realm>` olur.
        En çok 255 karakter olur. “Platform Identity Link” kaydının `issuer` alanı da bu uzunluktadır.
      examples:
        - http://kimlik.localhost:8660/realms/platform
    Subject:
      type: string
      minLength: 1
      maxLength: 140
      description: |
        Kullanıcının Keycloak'taki `sub` değeri. Kalıcı anahtarın ikinci parçasıdır.
        En çok 140 karakter olur. “Platform Identity Link” kaydının `subject` alanı da bu uzunluktadır.
      examples:
        - 11111111-1111-4111-8111-111111111111
    Email:
      type: string
      format: email
      maxLength: 140
      description: Kullanıcının e-postası. Frappe'de kullanıcının adı bu değerdir.
      examples:
        - kiraci1.kullanici1@example.test

    HtmlSayfa:
      type: string
      description: |
        Tarayıcıya gösterilen HTML sayfa. Sayfanın bir başlığı ve kısa bir açıklaması vardır.
        Sayfa `exc_type` taşımaz. Sayfa belirteç, kod ya da kişisel veri göstermez.

    LoginUrlRequest:
      type: object
      additionalProperties: false
      properties:
        redirect_to:
          type: string
          maxLength: 2048
          pattern: '^/(?!/)[^\\\s\x00-\x1f\x7f]*$'
          description: |
            Giriş bitince dönülecek göreli yol. `/` ile başlar. `//` ile başlayamaz.
            Ters eğik çizgi hiçbir yerde olamaz. Boşluk ve denetim karakteri içeremez.
            En çok 2048 karakter olur. Verilmezse dönüş adresi `platform_panel_url` olur.
          examples:
            - /panel
            - /panel/kayitlar?durum=acik

    LoginUrl:
      type: object
      required: [login_url, brand_name, label]
      properties:
        login_url:
          type: string
          format: uri
          description: |
            Keycloak yetki adresi. Tarayıcı bu adrese gider.
            Adres `state`, `nonce`, `code_challenge`, `code_challenge_method=S256` ve `redirect_uri` taşır.
            `redirect_uri` değeri bu sitenin `keycloak_callback` ucudur.
        brand_name:
          type: string
          description: Marka adı. `kimlik_marka_adi` ayarından gelir.
        label:
          type: string
          description: Giriş düğmesinin metni. Biçim `<marka> ile oturum aç` olur.

    LogoutUrl:
      type: object
      required: [logout_url]
      properties:
        logout_url:
          type: string
          format: uri
          description: |
            Keycloak çıkış adresi. `client_id` ve `post_logout_redirect_uri` taşır.
            `id_token_hint` taşımaz.

    LogoutTokenForm:
      type: object
      required: [logout_token]
      properties:
        logout_token:
          type: string
          minLength: 1
          description: Keycloak'ın imzaladığı çıkış belirteci (JWT). `exp` ve `jti` alanları zorunludur.

    BackchannelLogoutResult:
      type: object
      required: [closed_sessions]
      properties:
        closed_sessions:
          type: integer
          minimum: 0
          description: Kapanan Frappe oturumu sayısı. Eşleşme yoksa 0 olur.

    SetupResult:
      type: object
      required: [social_login_key, enabled, provider_name]
      properties:
        social_login_key:
          type: string
          const: keycloak
          description: “Social Login Key” kaydının adı.
        enabled:
          type: boolean
          const: true
          description: Kayıt açık.
        provider_name:
          type: string
          description: Kayıttaki marka adı. `kimlik_marka_adi` ayarından gelir.

    ProvisionRequest:
      type: object
      required: [issuer, subject, email, email_verified, enabled]
      additionalProperties: false
      properties:
        issuer: {$ref: "#/components/schemas/Issuer"}
        subject: {$ref: "#/components/schemas/Subject"}
        email: {$ref: "#/components/schemas/Email"}
        email_verified:
          type: boolean
          description: Keycloak e-postayı doğruladı mı? Zorunludur. Yanlışsa ilk bağ kurulmaz.
        first_name:
          type: string
          maxLength: 140
          description: Ad. İsteğe bağlı. Verilirse metin olmalıdır.
        last_name:
          type: string
          maxLength: 140
          description: Soyad. İsteğe bağlı. Verilirse metin olmalıdır.
        enabled:
          type: boolean
          description: Kullanıcı açık mı? Zorunludur. Yanlışsa kullanıcı kapanır.
        role_profiles:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 140
          description: |
            Kullanıcıya verilecek rol profilleri. İsteğe bağlı.
            Her rol profili sitede var olmalıdır. Masaüstü erişimi veren rol içeremez.

    ProvisionResult:
      type: object
      required: [user, enabled, linked, user_type]
      properties:
        user: {$ref: "#/components/schemas/Email"}
        enabled:
          type: boolean
          description: Kullanıcının son durumu.
        linked:
          type: boolean
          const: true
          description: Bağ kurulu.
        user_type:
          type: string
          const: Website User
          description: Kullanıcının türü. Bu uç yalnız “Website User” açar.

    SetEnabledRequest:
      type: object
      required: [issuer, subject, enabled]
      additionalProperties: false
      properties:
        issuer: {$ref: "#/components/schemas/Issuer"}
        subject: {$ref: "#/components/schemas/Subject"}
        enabled:
          type: boolean
          description: Doğru ise kullanıcı açılır. Yanlış ise kullanıcı kapanır.

    SetEnabledResult:
      type: object
      required: [user, enabled]
      properties:
        user: {$ref: "#/components/schemas/Email"}
        enabled:
          type: boolean
          description: Kullanıcının son durumu.

    ChangeEmailRequest:
      type: object
      required: [issuer, subject, new_email]
      additionalProperties: false
      properties:
        issuer: {$ref: "#/components/schemas/Issuer"}
        subject: {$ref: "#/components/schemas/Subject"}
        new_email:
          allOf:
            - $ref: "#/components/schemas/Email"
          description: Kullanıcının yeni e-postası. Başka kullanıcıya ait olamaz.

    ChangeEmailResult:
      type: object
      required: [user]
      properties:
        user:
          allOf:
            - $ref: "#/components/schemas/Email"
          description: Kullanıcının yeni adı. Değişiklik yoksa eski ad döner.

    FrappeError:
      type: object
      description: |
        Frappe'nin olağan hata gövdesi. İstemci hatayı `exc_type` alanından tanır.
        Bu dosyadaki özel değerler şunlardır: `InvalidRedirect`, `KeycloakLoginNotConfigured`,
        `InvalidLogoutToken`, `ServiceTokenRejected`, `UnknownIssuer`, `EmailMismatch`,
        `EmailNotVerified`, `IdentityConflict`, `DeskRoleNotAllowed`, `IdentityNotFound`,
        `EmailInUse`, `KeycloakSettingsMissing`, `InvalidInput` ve `KeycloakKeysUnavailable`.
        Frappe'nin genel değerleri `PermissionError`, `AuthenticationError`, `CSRFTokenError`,
        `DataError` ve `RateLimitExceededError` olabilir.
        `start_login` ve `keycloak_callback` uçları bu gövdeyi dönmez. Bu iki uç HTML sayfa döner.
      required: [exc_type]
      properties:
        exc_type:
          type: string
          description: Hata sınıfının adı.
        exception:
          type: string
          description: Hata sınıfının tam yolu ve kısa ileti. Belirteç ya da sır taşımaz.
        _server_messages:
          type: string
          description: |
            JSON dizisi metni. Her öğe bir JSON nesnesi metnidir ve `message` alanı taşır.
            İleti kullanıcıya gösterilebilir.
