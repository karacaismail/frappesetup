components:
  securitySchemes:
    frappeSession:
      type: apiKey
      in: cookie
      name: sid
      description: |
        Frappe session cookie. It is not enough on its own. A POST request also carries the `csrfToken` header.
        No `Authorization` header is sent together with this cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-Frappe-CSRF-Token
      description: |
        The Frappe CSRF token. The `/panel` page carries this value.
        If the header is missing or wrong, Frappe returns 403.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Service token issued by Keycloak. It is looked for only on the `platform_core.api.identity.*` paths.
        The server verifies the token with the `libs/oidc_verify` library. The rules are these:

        - Only an RS256 signature is accepted.
        - `iss` matches the `iss` value of the site exactly.
        - `aud` is a single value. The value is the `keycloak_client_id` setting of the site.
        - The `azp` value must be in the `kimlik_servis_azp` list. The default list is `["identity-sync"]`.
        - `exp` is required. The clock skew allowance is 30 seconds.
        - If the request has a `cmd` field, the request is rejected.
        - If the request carries both a non-Guest session cookie and a token, the request is rejected.

        The rejection response is 401 and `ServiceTokenRejected`. The message carries the code of the rejection reason.
        The message does not carry the token. The server does not write the token to the log.
        If there is no token at all, the endpoint returns 403 and `PermissionError`.
        If the Keycloak key list cannot be fetched, the endpoint returns 503 and `KeycloakKeysUnavailable`.

  responses:
    YerelGirisKapali:
      description: |
        Local sign-in is closed. The `kimlik_yalniz_keycloak` setting is 1. The `exc_type` value is `PermissionError`.
        The user signs in with the brand button on the sign-in page.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            kapali:
              value:
                exc_type: PermissionError
                exception: "frappe.exceptions.PermissionError: Local sign-in is disabled. Sign in with the identity provider."
    IstekSiniri:
      description: |
        The rate limit was exceeded. The limit is counted per IP address.
        The `exc_type` value is the Frappe value `RateLimitExceededError`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
    KimlikSilindi:
      description: |
        The identity `(issuer, subject)` was deleted. The `exc_type` value is `IdentityDeleted`.
        The deletion record is checked first, under the same row locks as the deletion (docs/sozlesmeler.md section 7, rule 3).
        If the `kimlik_deletion_hmac_key` setting is missing, the endpoint returns 503 `DeletionKeyMissing` instead.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            silindi:
              value:
                exc_type: IdentityDeleted
                exception: "platform_core.kimlik.exceptions.IdentityDeleted: This identity was deleted and cannot be used again."
    OturumBitti:
      description: |
        The session has expired. The user made no real request for 1 hour or the session was closed (O-25).
        Background requests do not renew the time. The rule is in step 8 of `keycloak_callback`.
        The `exc_type` value is the Frappe value `SessionExpired`. Frappe deletes the `sid` cookie.
        This response is not a permission denial. The client sends the user to the sign-in page (SZ-8).
        If there is no cookie at all, this response is not returned. In that case it returns 403 and `PermissionError`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            boslukta:
              value:
                exc_type: SessionExpired
                exception: "frappe.exceptions.SessionExpired"
    GovdeBozuk:
      description: |
        The body could not be parsed as JSON. Frappe rejected the request before passing it to the endpoint.
        The `exc_type` value is the Frappe value `DataError`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
    ServisBelirteciReddi:
      description: |
        The service token is not valid. The `exc_type` value is `ServiceTokenRejected`. The message carries the rejection code.
        The codes can be `malformed`, `invalid_signature`, `unknown_kid`, `wrong_issuer`, `wrong_audience`,
        `wrong_azp`, `expired` and `not_yet_valid`.
        If the request has a `cmd` field or also a non-Guest cookie, the same error is returned.
        If there is no token at all, this response is not returned. In that case it returns 403.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            suresiDolmus:
              value:
                exc_type: ServiceTokenRejected
                exception: "platform_core.kimlik.hatalar.ServiceTokenRejected: expired"
                _server_messages: '["{\"message\": \"Service token rejected: expired\"}"]'
    ServisYetkisiYok:
      description: |
        The caller has no permission for this endpoint. The `exc_type` value is `PermissionError`. It is returned in two cases.

        - The request carries no service token. For example there is only a session cookie or no identity at all.
        - The token is valid but the `azp` value is not `identity-sync`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
    GirdiGecersiz:
      description: |
        A field is missing or malformed. The `exc_type` value is `InvalidInput`.
        For example `subject` is missing, `enabled` is not true or false, or `new_email` is not in e-mail form.
        The message names the wrong field.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            enabledYanlis:
              value:
                exc_type: InvalidInput
                exception: "platform_core.kimlik.hatalar.InvalidInput: enabled"
                _server_messages: '["{\"message\": \"Field enabled must be true or false.\"}"]'
    AnahtarListesiYok:
      description: |
        The Keycloak key list could not be fetched. The token could not be verified. The `exc_type` value is `KeycloakKeysUnavailable`.
        The server did not process the request. The caller sends the request again later.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            keycloakKapali:
              value:
                exc_type: KeycloakKeysUnavailable
                exception: "platform_core.kimlik.hatalar.KeycloakKeysUnavailable: jwks"
                _server_messages: '["{\"message\": \"Identity provider keys are not available.\"}"]'
    BagYok:
      description: "The `(issuer, subject)` link does not exist. The `exc_type` value is `IdentityNotFound`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FrappeError"}
          examples:
            bagYok:
              value:
                exc_type: IdentityNotFound
                exception: "platform_core.kimlik.hatalar.IdentityNotFound: subject"
                _server_messages: '["{\"message\": \"No user is linked to this identity.\"}"]'

  schemas:
    Issuer:
      type: string
      format: uri
      minLength: 1
      maxLength: 255
      description: |
        The `iss` value of the identity server. It must match the `iss` value of the site exactly.
        The form is `<keycloak_public_url>/realms/<keycloak_realm>`.
        It is at most 255 characters. The `issuer` field of the “Platform Identity Link” record has the same length.
      examples:
        - http://kimlik.localhost:8660/realms/platform
    Subject:
      type: string
      minLength: 1
      maxLength: 140
      description: |
        The `sub` value of the user in Keycloak. It is the second part of the permanent key.
        It is at most 140 characters. The `subject` field of the “Platform Identity Link” record has the same length.
      examples:
        - 11111111-1111-4111-8111-111111111111
    Email:
      type: string
      format: email
      maxLength: 140
      description: The e-mail of the user. In Frappe the user name is this value.
      examples:
        - kiraci1.kullanici1@example.test

    HtmlSayfa:
      type: string
      description: |
        HTML page shown in the browser. The page has a title and a short explanation.
        The page does not carry `exc_type`. The page does not show tokens, codes or personal data.

    LoginUrlRequest:
      type: object
      additionalProperties: false
      properties:
        redirect_to:
          type: string
          maxLength: 2048
          pattern: '^/(?!/)[A-Za-z0-9\-._~/?#@!$&()*+,;=%:\[\]]*$'
          description: |
            Relative path to return to after sign-in. It starts with `/`. It cannot start with `//`.
            It cannot contain a backslash anywhere. It cannot contain a space or a control character.
            It cannot contain quotes, `<`, `>` or backticks.
            It is at most 2048 characters. If it is not given, the return address is `platform_panel_url`.
          examples:
            - /panel
            - /panel/kayitlar?durum=acik

    LoginUrl:
      type: object
      required: [login_url, brand_name, label]
      properties:
        login_url:
          type: string
          format: uri
          description: |
            Keycloak authorization address. The browser goes to this address.
            The address carries `state`, `nonce`, `code_challenge`, `code_challenge_method=S256` and `redirect_uri`.
            The `redirect_uri` value is the `keycloak_callback` endpoint of this site.
        brand_name:
          type: string
          description: Brand name. It comes from the `kimlik_marka_adi` setting.
        label:
          type: string
          description: |
            Label of the sign-in button. The English source text is `Sign in with {0}`. The brand name fills `{0}`.
            The Turkish text comes from `translations/tr.csv` with the context `platform_core.kimlik`.

    LogoutUrl:
      type: object
      required: [logout_url]
      properties:
        logout_url:
          type: string
          format: uri
          description: |
            Keycloak logout address. It carries `client_id` and `post_logout_redirect_uri`.
            It does not carry `id_token_hint`.

    LogoutTokenForm:
      type: object
      required: [logout_token]
      properties:
        logout_token:
          type: string
          minLength: 1
          description: Logout token (JWT) signed by Keycloak. The `exp` and `jti` fields are required.

    BackchannelLogoutResult:
      type: object
      required: [closed_sessions]
      properties:
        closed_sessions:
          type: integer
          minimum: 0
          description: Number of closed Frappe sessions. If there is no match, it is 0.

    SetupResult:
      type: object
      required: [social_login_key, enabled, provider_name]
      properties:
        social_login_key:
          type: string
          const: keycloak
          description: Name of the “Social Login Key” record.
        enabled:
          type: boolean
          const: true
          description: The record is enabled.
        provider_name:
          type: string
          description: Brand name in the record. It comes from the `kimlik_marka_adi` setting.

    ProvisionRequest:
      type: object
      required: [issuer, subject, email, email_verified, enabled]
      additionalProperties: false
      properties:
        issuer: {$ref: "#/components/schemas/Issuer"}
        subject: {$ref: "#/components/schemas/Subject"}
        email: {$ref: "#/components/schemas/Email"}
        email_verified:
          type: boolean
          description: Did Keycloak verify the e-mail? It is required. If it is false, no first link is made.
        first_name:
          type: string
          maxLength: 140
          description: First name. It is optional. If it is given, it must be text.
        last_name:
          type: string
          maxLength: 140
          description: Last name. It is optional. If it is given, it must be text.
        enabled:
          type: boolean
          description: Is the user enabled? It is required. If it is false, the user is disabled.
        role_profiles:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 140
          description: |
            Role profiles to give to the user. It is optional.
            Each role profile must exist on the site. It cannot contain a role that grants desk access.

    ProvisionResult:
      type: object
      required: [user, enabled, linked, user_type]
      properties:
        user: {$ref: "#/components/schemas/Email"}
        enabled:
          type: boolean
          description: The latest state of the user.
        linked:
          type: boolean
          const: true
          description: The link is in place.
        user_type:
          type: string
          const: Website User
          description: The type of the user. This endpoint creates only “Website User” users.

    SetEnabledRequest:
      type: object
      required: [issuer, subject, enabled]
      additionalProperties: false
      properties:
        issuer: {$ref: "#/components/schemas/Issuer"}
        subject: {$ref: "#/components/schemas/Subject"}
        enabled:
          type: boolean
          description: If it is true, the user is enabled. If it is false, the user is disabled.

    SetEnabledResult:
      type: object
      required: [user, enabled]
      properties:
        user: {$ref: "#/components/schemas/Email"}
        enabled:
          type: boolean
          description: The latest state of the user.

    ChangeEmailRequest:
      type: object
      required: [issuer, subject, new_email]
      additionalProperties: false
      properties:
        issuer: {$ref: "#/components/schemas/Issuer"}
        subject: {$ref: "#/components/schemas/Subject"}
        new_email:
          allOf:
            - $ref: "#/components/schemas/Email"
          description: The new e-mail of the user. It cannot belong to another user.

    AnonymizeUserRequest:
      type: object
      required: [issuer, subject]
      additionalProperties: false
      properties:
        issuer: {$ref: "#/components/schemas/Issuer"}
        subject: {$ref: "#/components/schemas/Subject"}

    AnonymizeUserResult:
      type: object
      required: [user, enabled, status]
      additionalProperties: false
      properties:
        user:
          type: string
          maxLength: 140
          description: The anonymous name of the user. Its form is `deleted-user-<number>@<site>`. It does not identify the person.
        enabled:
          type: boolean
          const: false
          description: The user is always disabled.
        status:
          type: string
          const: Anonymized
          description: The state of the “Platform Identity Deletion” record. The response comes only after step 2.

    ChangeEmailResult:
      type: object
      required: [user]
      properties:
        user:
          allOf:
            - $ref: "#/components/schemas/Email"
          description: The new name of the user. If nothing changed, the old name is returned.

    FrappeError:
      type: object
      description: |
        The usual Frappe error body. The client recognizes the error from the `exc_type` field.
        The custom values in this file are these: `InvalidRedirect`, `KeycloakLoginNotConfigured`,
        `InvalidLogoutToken`, `ServiceTokenRejected`, `UnknownIssuer`, `EmailMismatch`,
        `EmailNotVerified`, `IdentityConflict`, `DeskRoleNotAllowed`, `IdentityNotFound`,
        `EmailInUse`, `KeycloakSettingsMissing`, `InvalidInput` and `KeycloakKeysUnavailable`.
        The general Frappe values can be `PermissionError`, `AuthenticationError`, `CSRFTokenError`,
        `DataError` and `RateLimitExceededError`.
        The `start_login` and `keycloak_callback` endpoints do not return this body. These two endpoints return an HTML page.
      required: [exc_type]
      properties:
        exc_type:
          type: string
          description: Name of the error class.
        exception:
          type: string
          description: Full path of the error class and a short message. It does not carry tokens or secrets.
        _server_messages:
          type: string
          description: |
            Text of a JSON array. Each item is the text of a JSON object and carries a `message` field.
            The message can be shown to the user.
