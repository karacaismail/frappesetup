openapi: 3.1.0
info:
  title: Telefon eşitlemesi
  version: 1.0.0
  description: |
    Telefon, bağlantı gelince bekleyen işleri gönderir ve değişiklikleri alır.
    İstek gövdesi en çok 256 KiB olabilir. Aşımda 413 döner.
    Sunucu her hesaba dakikada en çok 60 istek işler. Aşımda 429 döner.
    Bu sürümde izin listesi boş başlar. Sunucu dosya kabul etmez.
servers:
  - url: /api/method
security:
  - mobileBearer: []
paths:
  /platform_core.api.mobile.v1_register:
    post:
      operationId: mobileV1Register
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/ContractVersion' }
      description: |
        Telefon kurulumunu doğrulanmış Keycloak oturumuna bağlar.
        İptal edilen kurulum yeniden açılamaz. Yeni oturum yeni kurulum kimliği ister.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Device' }
      responses:
        '200': { $ref: '#/components/responses/DeviceSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /platform_core.api.mobile.v1_revoke:
    post:
      operationId: mobileV1Revoke
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/ContractVersion' }
      description: |
        Hesabın bir kurulumunu veya bütün etkin kurulumlarını iptal eder.
        Yanıttaki sayı yerel iptali gösterir. Sunucu daha sonra oturum kapatma isteği gönderir.
        Başka bir geçerli oturumla tekli iptal yinelenebilir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/Device' }
                - type: object
                  additionalProperties: false
                  required: [all]
                  properties:
                    all: { const: true }
      responses:
        '200': { $ref: '#/components/responses/RevokedSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /platform_core.api.mobile.v1_push:
    post:
      operationId: mobileV1Push
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/ContractVersion' }
      description: |
        En çok 20 işi sırayla işler. Bir iş başarısız olursa bütün grubu geri alır.
        Sunucu aynı kimlik ve içerikle gelen işe ilk kesinleşen sonucu verir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id, operations]
              properties:
                installation_id: { $ref: '#/components/schemas/UUID' }
                operations:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { $ref: '#/components/schemas/Operation' }
      responses:
        '200': { $ref: '#/components/responses/AppliedOperationsSuccess' }
        '409': { $ref: '#/components/responses/Error', description: İşlem içeriği değişti veya kayıt sürümü eski. }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /platform_core.api.mobile.v1_pull:
    post:
      operationId: mobileV1Pull
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/ContractVersion' }
      description: İmleç yoksa ilk kopyayı başlatır. Sonraki çağrılar sunucunun verdiği imleci kullanır.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id]
              properties:
                installation_id: { $ref: '#/components/schemas/UUID' }
                cursor: { type: string, maxLength: 2048 }
                limit: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '410': { $ref: '#/components/responses/Error', description: İmleç geçersiz veya süresi doldu. Tam kopya alın. }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /platform_core.api.mobile.v1_cleanup:
    post:
      operationId: mobileV1Cleanup
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/ContractVersion' }
      description: Site yöneticisi süresi dolmuş olayları ve işlem kayıtlarını elle temizler. Önizleme kayıt silmez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dry_run: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/CleanupResultSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    mobileBearer: { type: http, scheme: bearer }
  parameters:
    AppVersion:
      name: X-Mobile-App-Version
      in: header
      required: true
      schema: { type: string, pattern: '^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$' }
    ContractVersion:
      name: X-Mobile-Contract-Version
      in: header
      required: true
      schema: { type: string, const: '1' }
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Device:
      type: object
      additionalProperties: false
      required: [installation_id]
      properties:
        installation_id: { $ref: '#/components/schemas/UUID' }
    Operation:
      type: object
      additionalProperties: false
      required: [operation_id, command, record_id]
      properties:
        operation_id: { $ref: '#/components/schemas/UUID' }
        command: { type: string, minLength: 1, maxLength: 80 }
        record_id: { $ref: '#/components/schemas/UUID' }
        version: { type: string, minLength: 1, maxLength: 128, description: Güncelleme ve silmede zorunlu kayıt sürümü. }
        fields: { type: object, description: Komutun izin verdiği alanlar. }
    Change:
      type: object
      additionalProperties: false
      required: [record_type, record_id, kind]
      properties:
        record_type: { type: string }
        record_id: { $ref: '#/components/schemas/UUID' }
        kind: { enum: [upsert, remove] }
        version: { type: string }
        fields: { type: object }
    Revoked:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer, minimum: 0 }
    AppliedOperations:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [operation_id, status]
            properties:
              operation_id: { $ref: '#/components/schemas/UUID' }
              status: { const: applied }
    CleanupResult:
      type: object
      required: [dry_run, removed, operations_removed, eligible_changes, eligible_operations, deliveries_removed, eligible_deliveries]
      properties:
        dry_run: { type: boolean }
        removed: { type: integer, minimum: 0, maximum: 2000 }
        operations_removed: { type: integer, minimum: 0, maximum: 1000 }
        eligible_changes: { type: integer, minimum: 0, maximum: 2000 }
        eligible_operations: { type: integer, minimum: 0, maximum: 1000 }
        deliveries_removed: { type: integer, minimum: 0, maximum: 1000 }
        eligible_deliveries: { type: integer, minimum: 0, maximum: 1000 }
    Error:
      type: object
      anyOf:
        - required: [code]
        - required: [exc_type]
      properties:
        code:
          type: string
          description: Mobil ucun verdiği hata kodu.
          enum:
            - body_too_large
            - cleanup_forbidden
            - command_disabled
            - cursor_key_unavailable
            - installation_limit
            - installation_unavailable
            - invalid_batch_size
            - invalid_client_version
            - invalid_command
            - invalid_cursor
            - invalid_fields
            - invalid_json
            - invalid_mobile_route
            - invalid_mobile_settings
            - invalid_operation
            - invalid_page_size
            - invalid_request
            - invalid_retention_setting
            - invalid_uuid
            - json_required
            - mixed_authentication
            - mobile_busy
            - mobile_schema_unavailable
            - mobile_session_revoked
            - mobile_sequence_exhausted
            - mobile_token_required
            - mobile_token_revoked
            - operation_conflict
            - rate_limit
            - record_not_found
            - unexpected_version
            - unknown_command
            - unsupported_contract_version
            - version_conflict
            - version_required
        exc_type: { type: string, description: Frappe isteği uca ulaşmadan reddederse gelen hata türü. }
        current: { $ref: '#/components/schemas/Change', description: Kullanıcının görebildiği güncel kayıt. }
  responses:
    DeviceSuccess:
      description: İstek tamamlandı.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { $ref: '#/components/schemas/Device' }
    RevokedSuccess:
      description: İstek tamamlandı.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { $ref: '#/components/schemas/Revoked' }
    AppliedOperationsSuccess:
      description: İstek tamamlandı.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { $ref: '#/components/schemas/AppliedOperations' }
    CleanupResultSuccess:
      description: İstek tamamlandı.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { $ref: '#/components/schemas/CleanupResult' }
    Page:
      description: Kayıt sayfası ve sonraki çağrı için imleç.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: object
                required: [changes, cursor, has_more]
                properties:
                  changes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Change' } }
                  cursor: { type: string, maxLength: 2048 }
                  has_more: { type: boolean }
    Error:
      description: İstek reddedildi.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Throttled:
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
      description: İstek sıklığı sınırı aşıldı.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
    Unavailable:
      description: Sunucu şu anda işlemi tamamlayamadı.
      headers:
        Retry-After:
          description: Yeni denemeden önce beklenecek saniye.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
