openapi: 3.1.0
info:
  title: platform_core yapay zekâ erişim katmanı
  version: 0.1.0
  summary: MCP ucu, aracı belirteci ve insan onayı uçları.
  description: |
    Bu sözleşme `platform_core.yapay_zeka` modülünün uçlarını tarif eder.
    Karar notu `docs/kararlar/0002-yapay-zeka-katmani.md` dosyasıdır.

    Kimlik türleri:

    - İnsan oturumu: Frappe oturum çerezi ve `X-Frappe-CSRF-Token` başlığı.
      `Authorization` başlığı taşıyan istek insan oturumu sayılmaz.
    - Aracı belirteci: `Authorization: Bearer fsat_...` başlığı. Yalnız MCP ucunda geçer.

    API anahtarı ve OAuth belirteci bu uçlarda kabul edilmez.
    Hem çerez hem `Authorization` başlığı taşıyan istek reddedilir.

    Hiçbir şemada `confirm`, `approved` ya da `force` alanı yoktur.
    Onay yalnız `approve_proposal` ucundan ve yalnız insan oturumundan gelir.
servers:
  - url: /api/method
    description: Kiracı sitesinin Frappe uç kökü
tags:
  - name: mcp
    description: Modelin kullandığı MCP ucu
  - name: belirtec
    description: Aracı belirteci
  - name: oneri
    description: Yazma önerileri ve insan onayı
  - name: yonetim
    description: Elle başlatılan bakım komutları

paths:
  /platform_core.api.ai.mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: MCP ucu (Streamable HTTP, tek JSON yanıt).
      description: |
        JSON-RPC 2.0 isteği alır. Desteklenen yöntemler `initialize` (yalnız 2025-11-25),
        `server/discover` (yalnız 2026-07-28), `ping`, `tools/list` ve `tools/call` olur.
        Uç oturum tutmaz. Yanıt akış değil, tek JSON'dur. Bildirim 202 döner.

        Okuma araçları kullanıcının izniyle çalışır. Yazma araçları kaydı değiştirmez.
        Yazma aracı bir öneri açar ve `approval_required` durumunu döner.
        Araç hatası HTTP hatası değildir. Araç hatası `isError: true` taşıyan sonuçtur.
        Her çağrı ve her ret “AI Action Log” kaydına yazılır.
      security:
        - insanOturumu: []
        - araciBelirteci: []
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          description: 2026-07-28 sürümünde zorunludur. Yoksa 2025-11-25 varsayılır.
          schema: {type: string, enum: ["2026-07-28", "2025-11-25"]}
        - name: Mcp-Method
          in: header
          required: false
          description: 2026-07-28 sürümünde zorunludur. Gövdedeki `method` ile aynı olmalıdır.
          schema: {type: string}
        - name: Mcp-Name
          in: header
          required: false
          description: 2026-07-28 sürümünde `tools/call` için zorunludur. Araç adıyla aynı olmalıdır.
          schema: {type: string}
        - name: Mcp-Conversation-Id
          in: header
          required: false
          description: İstemcinin konuşma kimliği. Günlükte `session_id` alanına yazılır. Güvenilmeyen metindir.
          schema: {type: string, maxLength: 140}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JsonRpcRequest"}
      responses:
        "200":
          description: JSON-RPC sonucu ya da JSON-RPC hatası.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JsonRpcResponse"}
        "202": {description: Bildirim kabul edildi. Gövde yoktur.}
        "400": {description: Geçersiz JSON-RPC gövdesi, başlık uyuşmazlığı ya da desteklenmeyen sürüm.}
        "401": {description: "Belirteç bilinmiyor, süresi dolmuş, bağlı oturumu bitmiş ya da çağrı hakkı tükenmiş."}
        "403": {description: "İstek kimlik taşımıyor, köken izinli değil, kimlik türü kabul edilmiyor ya da çerezle belirteç birlikte geldi. Uç misafire açık değildir. Frappe kimliksiz isteği 403 ile reddeder."}
        "404": {description: Bilinmeyen yöntem ya da bilinmeyen araç.}
        "406": {description: "`Accept` başlığı `application/json` değerine izin vermiyor."}
        "415": {description: "`Content-Type` değeri `application/json` değil."}

  /platform_core.api.ai.issue_agent_token:
    post:
      tags: [belirtec]
      operationId: issueAgentToken
      summary: İnsan oturumundan kısa ömürlü aracı belirteci üretir.
      description: |
        Belirteç 300 saniye ve en çok 20 araç çağrısı için geçerlidir. Belirteç yalnız MCP ucunda geçer.
        Belirteç, isteği yapan Frappe oturumuna bağlıdır. Oturum kapanınca belirteç geçersiz olur.
        Sunucu belirtecin yalnız özetini saklar. Belirteç yalnız bu yanıtta görünür.
        Belirteci tarayıcı deposuna yazmayın. Yalnız bellekte tutun (G-148).
      security: [{insanOturumu: []}]
      responses:
        "200":
          description: Belirteç üretildi.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/AgentToken"}
        "403": {description: İstek insan oturumundan gelmedi.}

  /platform_core.api.ai.list_proposals:
    get:
      tags: [oneri]
      operationId: listProposals
      summary: Oturumdaki kullanıcının yazma önerilerini listeler.
      description: Yalnız kullanıcının kendi önerileri döner. En yeni öneri başta gelir.
      security: [{insanOturumu: []}]
      parameters:
        - name: status
          in: query
          required: false
          schema: {$ref: "#/components/schemas/ProposalStatus"}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: Öneri listesi.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: array
                    items: {$ref: "#/components/schemas/Proposal"}
        "403": {description: İstek insan oturumundan gelmedi.}

  /platform_core.api.ai.get_proposal:
    get:
      tags: [oneri]
      operationId: getProposal
      summary: Bir önerinin önizlemesini, özetini ve durumunu döner.
      description: İnsan bu yanıttaki önizlemeyi okur. Onay isteği bu yanıttaki `digest` değerini taşır.
      security: [{insanOturumu: []}]
      parameters:
        - name: proposal_id
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Öneri.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/Proposal"}
        "403": {description: İstek insan oturumundan gelmedi ya da öneri başka kullanıcıya ait.}
        "404": {description: Öneri yok.}

  /platform_core.api.ai.approve_proposal:
    post:
      tags: [oneri]
      operationId: approveProposal
      summary: Öneriyi onaylar ve işi bu istekte yürütür.
      description: |
        YIKICI OLABİLİR. Bu uç kaydı oluşturur, değiştirir, onaya gönderir, iptal eder ya da siler.
        Uygulama aracı ücretli bir iş de başlatabilir. Önerideki `destructive` ve `billable` alanlarına bakın.

        Yazan her insan isteği `X-Frappe-CSRF-Token` başlığını taşır. Oturumda CSRF belirteci yoksa istek reddedilir.
        Onay tek kullanımlıktır. Sunucu sırayla şunları denetler: insan oturumu, aynı kullanıcı,
        `pending` durumu, süre, özet eşleşmesi, kaydın değişmemiş olması, güncel izin ve
        aynı hedefte sonucu bilinmeyen iş.
        Denetim başarısızsa iş yürümez ve yanıt `executed: false` ile ret nedenini taşır.

        Sunucu yürütmeden önce sonucu `unknown` olarak kaydeder. Süreç yarıda kesilirse sonuç `unknown` kalır.
        Yürütme hata verirse sonuç yalnız şu durumda `failed` olur: hata katmanın kendi ön denetiminde,
        Frappe'nin kayıt yöntemi çağrılmadan önce oluşmuştur. Kayıt yöntemi çağrıldıktan sonraki her hata
        `unknown` olur. Kayıt yöntemleri `insert`, `save`, `submit`, `cancel`, silme ve bunların kancalarıdır.
        Araç, hedefi yazmadan hemen önce kilitler ve sürümünü önizlemedekiyle karşılaştırır.
        Uygulama aracı hata verirse sonuç yine `unknown` kalır. Araç dış sisteme dokunmuş olabilir.
        Aynı hedefe kör tekrar yapılmaz. İnsan durumu `resolve_proposal` ile kapatır.
      security: [{insanOturumu: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposal_id, digest]
              properties:
                proposal_id: {type: string}
                digest:
                  type: string
                  description: İnsanın gördüğü önizlemenin özeti. `get_proposal` yanıtından alınır.
                  pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Onay sonucu. Ret de 200 döner ve `executed` yanlış olur.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/ApprovalOutcome"}
        "401": {description: "İstek aracı belirteci taşıyor. Belirteç yalnız MCP ucunda geçer. Ret günlüğe `token_out_of_scope` koduyla yazılır."}
        "403": {description: "İstek insan oturumundan gelmedi, oturumda CSRF belirteci yok ya da öneri başka kullanıcıya ait. Başkasının önerisi yanıtta dönmez."}
        "404": {description: Öneri yok.}

  /platform_core.api.ai.reject_proposal:
    post:
      tags: [oneri]
      operationId: rejectProposal
      summary: Bekleyen öneriyi reddeder.
      description: Kayda hiçbir şey yazılmaz. Reddedilen öneri sonradan onaylanamaz. Öneri `pending` değilse 417 döner.
      security: [{insanOturumu: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposal_id]
              properties:
                proposal_id: {type: string}
      responses:
        "200":
          description: Önerinin yeni durumu.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/Proposal"}
        "403": {description: İstek insan oturumundan gelmedi ya da öneri başka kullanıcıya ait.}

  /platform_core.api.ai.resolve_proposal:
    post:
      tags: [oneri]
      operationId: resolveProposal
      summary: Sonucu bilinmeyen öneriyi insan kararıyla kapatır.
      description: |
        İnsan hedef kaydı kendi gözüyle denetler. Sonra işin uygulanıp uygulanmadığını bildirir.
        Bu uç kayda yazmaz. Yalnız önerinin sonucunu `succeeded` ya da `failed` yapar.
        Sonra aynı hedefe yeni öneri açılabilir.
      security: [{insanOturumu: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposal_id, outcome]
              properties:
                proposal_id: {type: string}
                outcome: {type: string, enum: [succeeded, failed]}
      responses:
        "200":
          description: Önerinin yeni durumu.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/Proposal"}
        "403": {description: İstek insan oturumundan gelmedi ya da öneri başka kullanıcıya ait.}

  /platform_core.api.ai.purge_logs:
    post:
      tags: [yonetim]
      operationId: purgeLogs
      summary: Saklama süresi dolan günlük ve öneri kayıtlarını siler.
      description: |
        YIKICI. Geri alınamaz. Yalnız “System Manager” rolü ve insan oturumu çağırabilir.
        `dry_run` doğruysa hiçbir şey silinmez. Yanıt silinecek kayıt sayısını döner. Varsayılan budur.
        Saklama süresi en az 365 gündür. Sonucu bilinmeyen öneriler silinmez.
        Zamanlanmış iş yoktur. Bu uç elle başlatılır. Aynı işin komutu şudur:
        `bench --site <site> execute platform_core.yapay_zeka.retention.purge --kwargs "{'older_than_days': 365}"`.
        Yapay zekâ aynı işi `purge_action_log` aracıyla, önizleme ve insan onayıyla başlatır.
      security: [{insanOturumu: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                older_than_days: {type: integer, minimum: 365, default: 365}
                dry_run: {type: boolean, default: true}
      responses:
        "200":
          description: Silinen ya da silinecek kayıt sayıları.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: "#/components/schemas/PurgeResult"}
        "403": {description: İstek insan oturumundan gelmedi ya da kullanıcı yönetici değil.}
        "417": {description: Saklama süresi 365 günden kısa verildi.}

components:
  securitySchemes:
    insanOturumu:
      type: apiKey
      in: cookie
      name: sid
      description: Frappe oturum çerezi. POST isteği `X-Frappe-CSRF-Token` başlığını da taşır.
    araciBelirteci:
      type: http
      scheme: bearer
      description: "`issue_agent_token` ucunun ürettiği `fsat_` önekli belirteç."

  schemas:
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: {const: "2.0"}
        id:
          description: Bildirimde bulunmaz.
          oneOf: [{type: string}, {type: integer}]
        method:
          type: string
          enum: [initialize, server/discover, ping, tools/list, tools/call, notifications/initialized]
        params:
          type: object
          description: "`tools/call` için `name` ve `arguments` taşır."

    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: {const: "2.0"}
        id:
          oneOf: [{type: string}, {type: integer}, {type: "null"}]
        result:
          description: "`tools/call` için ToolResult, `tools/list` için araç tanımları."
          type: object
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: integer}
            message: {type: string}

    ToolResult:
      type: object
      description: MCP araç sonucu.
      required: [content, isError]
      properties:
        content:
          type: array
          items:
            type: object
            required: [type, text]
            properties:
              type: {const: text}
              text: {type: string}
        structuredContent:
          type: object
          description: Başarıda aracın sonucu. Rette `error` nesnesi.
        isError: {type: boolean}

    ToolError:
      type: object
      description: Ret ya da hata durumunda `structuredContent` içeriği.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {$ref: "#/components/schemas/DenyReason"}
            message: {type: string}

    DenyReason:
      type: string
      description: Ret nedeninin kodu. “AI Action Log” kaydındaki `deny_reason` alanıyla aynıdır.
      enum:
        - invalid_arguments
        - unknown_doctype
        - permission
        - field_not_permitted
        - secret_field
        - blocked_doctype
        - admin_only
        - role_required
        - protected_role
        - not_found
        - not_human_session
        - token_out_of_scope
        - credential_not_accepted
        - session_ended
        - cookie_with_token
        - report_gate_unavailable
        - token_call_limit
        - unknown_tool
        - not_owner
        - not_pending
        - expired
        - digest_mismatch
        - document_changed
        - unresolved_unknown
        - execution_failed
        - internal_error

    AgentToken:
      type: object
      required: [token, expires_in, max_calls, audience]
      properties:
        token: {type: string, description: "`fsat_` önekli belirteç. Yalnız bu yanıtta görünür."}
        expires_in: {type: integer, description: Saniye cinsinden ömür., examples: [300]}
        max_calls: {type: integer, description: İzinli araç çağrısı sayısı., examples: [20]}
        audience: {type: string, description: "Belirtecin hedef servisi. `ai_agent_audience` site ayarından gelir."}

    ProposalStatus:
      type: string
      enum: [pending, rejected, expired, consumed]
      description: |
        `pending`: insan kararını bekler. `rejected`: insan reddetti ya da onay denetimi kalıcı olarak başarısız oldu.
        `expired`: süre doldu. `consumed`: onaylandı ve yürütme başladı. Sonuç `result` alanındadır.

    ProposalResult:
      type: string
      enum: ["", unknown, succeeded, failed]
      description: Boş değer yürütmenin başlamadığını gösterir. `unknown` kör tekrar yapılmayacağını gösterir.

    Proposal:
      type: object
      required: [proposal_id, status, result, tool, preview, digest, expires_at, destructive, billable]
      properties:
        proposal_id: {type: string}
        status: {$ref: "#/components/schemas/ProposalStatus"}
        result: {$ref: "#/components/schemas/ProposalResult"}
        tool: {type: string}
        target_doctype: {type: [string, "null"]}
        target_name: {type: [string, "null"]}
        destructive: {type: boolean}
        billable: {type: boolean}
        preview: {$ref: "#/components/schemas/Preview"}
        digest: {type: string, pattern: "^[0-9a-f]{64}$"}
        expires_at: {type: string, description: Sitenin saatine göre son geçerlilik zamanı.}
        result_document:
          type: [string, "null"]
          description: Yürütme başarılıysa etkilenen kaydın adı.
        error: {type: [string, "null"], description: Yürütme başarısızsa hata metni.}

    Preview:
      type: object
      description: İnsanın onaylayacağı değişikliğin özeti. Gizli alan değeri taşımaz.
      required: [action, summary]
      properties:
        action: {type: string, enum: [create, update, submit, cancel, delete, app_tool, admin]}
        summary: {type: string}
        changes:
          type: array
          items:
            type: object
            required: [fieldname, new]
            properties:
              fieldname: {type: string}
              label: {type: [string, "null"]}
              old: {}
              new: {}
        details: {type: object, description: Uygulama aracının önizleme üreticisinden gelen ek veri.}

    ApprovalOutcome:
      type: object
      required: [executed, proposal]
      properties:
        executed: {type: boolean}
        deny_reason:
          oneOf: [{$ref: "#/components/schemas/DenyReason"}, {type: "null"}]
        proposal: {$ref: "#/components/schemas/Proposal"}

    PurgeResult:
      type: object
      required: [dry_run, older_than_days, logs, proposals]
      properties:
        dry_run: {type: boolean}
        older_than_days: {type: integer}
        logs: {type: integer, description: Silinen ya da silinecek “AI Action Log” sayısı.}
        proposals: {type: integer, description: Silinen ya da silinecek “AI Action Proposal” sayısı.}

    ApprovalRequired:
      type: object
      description: Yazma aracının model tarafına döndüğü sonuç. Kayıt henüz değişmemiştir.
      required: [status, proposal_id, preview, expires_at]
      properties:
        status: {const: approval_required}
        proposal_id: {type: string}
        preview: {$ref: "#/components/schemas/Preview"}
        expires_at: {type: string}

# Araç şeması. `tools/list` bu adları ve girdi şemalarını döner.
# Her girdi şeması `additionalProperties: false` taşır. Bilinmeyen alan çağrıyı reddettirir.
x-mcp-tools:
  - name: search_doctypes
    class: definition
    annotations: {readOnlyHint: true}
    outputSchema: {$ref: "#/x-mcp-results/SearchDoctypes"}
    description: Search DocType names the user may read. Child tables are left out.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        query: {type: string, minLength: 1}
        limit: {type: integer, minimum: 1, maximum: 100, default: 50}
  - name: get_doctype_schema
    class: definition
    annotations: {readOnlyHint: true}
    outputSchema: {$ref: "#/x-mcp-results/DoctypeSchema"}
    description: >-
      Get the fields of a DocType with their descriptions, and what the user may do with it.
      Secret fields are listed with secret=true and never carry a value.
    inputSchema:
      type: object
      additionalProperties: false
      required: [doctype]
      properties:
        doctype: {type: string, minLength: 1}
  - name: list_documents
    class: read
    annotations: {readOnlyHint: true}
    outputSchema: {$ref: "#/x-mcp-results/ListDocuments"}
    description: "List documents the user may read. A filter is a value or an [operator, value] pair."
    inputSchema:
      type: object
      additionalProperties: false
      required: [doctype]
      properties:
        doctype: {type: string, minLength: 1}
        filters: {type: object, description: "Field name to value, or to an [operator, value] pair."}
        fields: {type: array, items: {type: string}}
        order_by: {type: string, description: "A field name, optionally followed by asc or desc."}
        start: {type: integer, minimum: 0, default: 0}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
  - name: get_document
    class: read
    annotations: {readOnlyHint: true}
    outputSchema: {$ref: "#/x-mcp-results/GetDocument"}
    description: Get one document with its child tables. Fields the user may not read are left out.
    inputSchema:
      type: object
      additionalProperties: false
      required: [doctype, name]
      properties:
        doctype: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
  - name: run_report
    class: read
    annotations: {readOnlyHint: true}
    outputSchema: {$ref: "#/x-mcp-results/RunReport"}
    description: Run a report the user may run and return its columns and rows.
    inputSchema:
      type: object
      additionalProperties: false
      required: [report]
      properties:
        report: {type: string, minLength: 1}
        filters: {type: object}
        limit: {type: integer, minimum: 1, maximum: 500, default: 100}
  - name: create_document
    class: write
    annotations: {readOnlyHint: false, destructiveHint: false}
    outputSchema: {$ref: "#/x-mcp-results/ApprovalRequired"}
    description: Propose a new document. Nothing is written until a human approves the proposal.
    inputSchema:
      type: object
      additionalProperties: false
      required: [doctype, data]
      properties:
        doctype: {type: string, minLength: 1}
        data: {type: object}
  - name: update_document
    class: write
    annotations: {readOnlyHint: false, destructiveHint: true}
    outputSchema: {$ref: "#/x-mcp-results/ApprovalRequired"}
    description: Propose changes to a document. Nothing is written until a human approves the proposal.
    inputSchema:
      type: object
      additionalProperties: false
      required: [doctype, name, data]
      properties:
        doctype: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        data: {type: object}
  - name: submit_document
    class: write
    annotations: {readOnlyHint: false, destructiveHint: true}
    outputSchema: {$ref: "#/x-mcp-results/ApprovalRequired"}
    description: "Propose submitting a draft document. Nothing is written until a human approves the proposal."
    inputSchema: {$ref: "#/x-mcp-schemas/DocumentTarget"}
  - name: cancel_document
    class: write
    annotations: {readOnlyHint: false, destructiveHint: true}
    outputSchema: {$ref: "#/x-mcp-results/ApprovalRequired"}
    description: "Propose cancelling a submitted document. Nothing is written until a human approves the proposal."
    inputSchema: {$ref: "#/x-mcp-schemas/DocumentTarget"}
  - name: delete_document
    class: write
    annotations: {readOnlyHint: false, destructiveHint: true}
    outputSchema: {$ref: "#/x-mcp-results/ApprovalRequired"}
    description: "Propose deleting a document. Nothing is written until a human approves the proposal."
    inputSchema: {$ref: "#/x-mcp-schemas/DocumentTarget"}
  - name: get_proposal
    class: flow
    annotations: {readOnlyHint: true}
    outputSchema: {$ref: "#/x-mcp-results/ProposalState"}
    description: >-
      Read the status and result of a proposal the user opened. A result of unknown means
      the outcome is not known. Do not repeat the action. Ask the user to check and resolve it.
    inputSchema:
      type: object
      additionalProperties: false
      required: [proposal_id]
      properties:
        proposal_id: {type: string, minLength: 1}

  # Yönetim araçları. Yalnız “System Manager” rolüne görünür. Hepsi önizleme ve insan onayı ister.
  - name: add_custom_field
    class: admin
    annotations: {readOnlyHint: false, destructiveHint: false}
    outputSchema: {$ref: "#/x-mcp-results/ApprovalRequired"}
    description: "Propose a new custom field on a DocType. A description is required. Admin only. Nothing is written until a human approves the proposal."
    inputSchema:
      type: object
      additionalProperties: false
      required: [doctype, fieldname, label, fieldtype, description]
      properties:
        doctype: {type: string, minLength: 1}
        fieldname: {type: string, pattern: "^[a-z][a-z0-9_]{1,60}$"}
        label: {type: string, minLength: 1}
        fieldtype:
          type: string
          enum: [Data, Small Text, Text, Long Text, Int, Float, Currency, Percent, Check, Date, Datetime, Time, Select, Link, Password]
        description: {type: string, minLength: 1}
        options: {type: string}
        reqd: {type: boolean, default: false}
        insert_after: {type: string}
        permlevel: {type: integer, minimum: 0, maximum: 9, default: 0}
  - name: set_field_property
    class: admin
    annotations: {readOnlyHint: false, destructiveHint: true}
    outputSchema: {$ref: "#/x-mcp-results/ApprovalRequired"}
    description: "Propose a change to one display or validation property of a field. Admin only. Nothing is written until a human approves the proposal."
    inputSchema:
      type: object
      additionalProperties: false
      required: [doctype, fieldname, property, value]
      properties:
        doctype: {type: string, minLength: 1}
        fieldname: {type: string, minLength: 1}
        property:
          type: string
          enum: [label, description, reqd, hidden, read_only, in_list_view, in_standard_filter, bold, permlevel, options, default, allow_on_submit, print_hide]
        value: {type: [string, integer, boolean]}
  - name: set_role_permission
    class: admin
    annotations: {readOnlyHint: false, destructiveHint: true}
    outputSchema: {$ref: "#/x-mcp-results/ApprovalRequired"}
    description: "Propose a change to what a role may do with a DocType at one permission level. Admin only. Nothing is written until a human approves the proposal."
    inputSchema:
      type: object
      additionalProperties: false
      required: [doctype, role, permissions]
      properties:
        doctype: {type: string, minLength: 1}
        role: {type: string, minLength: 1}
        permlevel: {type: integer, minimum: 0, maximum: 9, default: 0}
        permissions:
          type: object
          description: "Permission type to true or false. Types: read, write, create, delete, submit, cancel, amend, report, export, import, print, email, share, select, if_owner."
  - name: assign_role
    class: admin
    annotations: {readOnlyHint: false, destructiveHint: true}
    outputSchema: {$ref: "#/x-mcp-results/ApprovalRequired"}
    description: "Propose giving a role to a user. Protected roles cannot be given through AI. Admin only. Nothing is written until a human approves the proposal."
    inputSchema: {$ref: "#/x-mcp-schemas/UserRole"}
  - name: remove_role
    class: admin
    annotations: {readOnlyHint: false, destructiveHint: true}
    outputSchema: {$ref: "#/x-mcp-results/ApprovalRequired"}
    description: "Propose taking a role away from a user. Admin only. Nothing is written until a human approves the proposal."
    inputSchema: {$ref: "#/x-mcp-schemas/UserRole"}
  - name: purge_action_log
    class: admin
    annotations: {readOnlyHint: false, destructiveHint: true}
    outputSchema: {$ref: "#/x-mcp-results/ApprovalRequired"}
    description: "Propose deleting AI action logs and proposals older than the retention period. Cannot be undone. Admin only. Nothing is written until a human approves the proposal."
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        older_than_days: {type: integer, minimum: 365, default: 365}

# Araçların sonuç şeması. Başarılı çağrı bu biçimi `structuredContent` içinde döner.
# `tools/list` aynı şemayı `outputSchema` olarak yayımlar. Bir test kodu bu bölüme bağlar.
# Reddedilen çağrı bu şemaya uymaz. O çağrı `isError: true` ve `ToolError` nesnesini döner.
# Yazma ve yönetim araçlarının hepsi `ApprovalRequired` döner. Uygulamaların yazma araçları da öyle.
x-mcp-results:
  SearchDoctypes:
    type: object
    required: [doctypes]
    properties:
      doctypes:
        type: array
        items: {type: string}
  DoctypeSchema:
    type: object
    required: [doctype, module, is_submittable, is_single, is_child_table, generic_write_tools, permissions, fields]
    properties:
      doctype: {type: string}
      description:
        type: [string, 'null']
      module: {type: string}
      is_submittable: {type: boolean}
      is_single: {type: boolean}
      is_child_table: {type: boolean}
      title_field:
        type: [string, 'null']
      generic_write_tools:
        type: string
        enum: [open, closed]
      permissions:
        type: object
        required: [read, write, create, delete, submit, cancel]
        properties:
          read: {type: boolean}
          write: {type: boolean}
          create: {type: boolean}
          delete: {type: boolean}
          submit: {type: boolean}
          cancel: {type: boolean}
      fields:
        type: array
        items:
          type: object
          required: [fieldname, fieldtype, reqd, read_only, permlevel, secret, readable, writable]
          properties:
            fieldname: {type: string}
            fieldtype: {type: string}
            label: {type: string}
            description: {type: string}
            options: {type: string}
            reqd: {type: boolean}
            read_only: {type: boolean}
            permlevel: {type: integer}
            secret: {type: boolean}
            readable: {type: boolean}
            writable: {type: boolean}
  ListDocuments:
    type: object
    required: [documents, has_next_page]
    properties:
      documents:
        type: array
        items: {type: object}
      has_next_page: {type: boolean}
  GetDocument:
    type: object
    required: [document]
    properties:
      document: {type: object}
  RunReport:
    type: object
    required: [columns, rows, truncated]
    properties:
      columns: {type: array}
      rows: {type: array}
      truncated: {type: boolean}
  ApprovalRequired:
    type: object
    required: [status, proposal_id, preview, expires_at]
    properties:
      status:
        type: string
        enum: [approval_required]
      proposal_id: {type: string}
      preview:
        type: object
        required: [action, summary]
        properties:
          action:
            type: string
            enum: [create, update, submit, cancel, delete, app_tool, admin]
          summary: {type: string}
          changes:
            type: array
            items:
              type: object
              required: [fieldname, new]
              properties:
                fieldname: {type: string}
                label:
                  type: [string, 'null']
                old: {}
                new: {}
          details: {type: object}
      expires_at: {type: string}
  ProposalState:
    type: object
    required: [proposal_id, status, result, tool, destructive, billable, preview, expires_at]
    properties:
      proposal_id: {type: string}
      status:
        type: string
        enum: [pending, rejected, expired, consumed]
      result:
        type: string
        enum: ['', unknown, succeeded, failed]
      tool: {type: string}
      target_doctype:
        type: [string, 'null']
      target_name:
        type: [string, 'null']
      destructive: {type: boolean}
      billable: {type: boolean}
      preview:
        type: object
        required: [action, summary]
        properties:
          action:
            type: string
            enum: [create, update, submit, cancel, delete, app_tool, admin]
          summary: {type: string}
          changes:
            type: array
            items:
              type: object
              required: [fieldname, new]
              properties:
                fieldname: {type: string}
                label:
                  type: [string, 'null']
                old: {}
                new: {}
          details: {type: object}
      expires_at: {type: string}
      result_document:
        type: [string, 'null']
      error:
        type: [string, 'null']

x-mcp-schemas:
  DocumentTarget:
    type: object
    additionalProperties: false
    required: [doctype, name]
    properties:
      doctype: {type: string, minLength: 1}
      name: {type: string, minLength: 1}
  UserRole:
    type: object
    additionalProperties: false
    required: [user, role]
    properties:
      user: {type: string, minLength: 1}
      role: {type: string, minLength: 1}

# Alt tablo satırları için kurallar. `create_document` ve `update_document` araçları uygular.
x-child-table-rules:
  - Satır listesi tablonun tamamının yerine geçer. Listede olmayan satır silinir. Önizleme eski satırları gösterir.
  - Satırın `name` değeri yalnız güncellenen kaydın aynı tablosundaki bir satırın adı olabilir.
  - Yeni kayıtta ve yeni satırda `name` gönderilmez. Adı sunucu üretir.
  - Satır `parent`, `parenttype`, `parentfield`, `owner`, `docstatus` ve `idx` alanlarını taşıyamaz.
  - Satır alanlarında da alan düzeyi yazma izni aranır. Gizli alan satırda da yazılamaz.
  - Bu denetimler önizlemede ve yürütmede yapılır.

# `run_report` aracı raporu çalıştırmadan önce erişim motorunun rapor kapısını çağırır.
x-report-gate:
  - Kapı `platform_core.erisim.reports.guard(report_name)` işlevidir.
  - Kapı kullanıcıyı reddederse araç `permission` döner ve rapor çalışmaz.
  - Kapı kurulu değilse araç `report_gate_unavailable` döner. Rapor aracı kapalı kalır.

# Rapor sütunu şu durumlarda `run_report` yanıtından çıkar.
x-report-secret-rules:
  - Sütunun türü “Password” olur.
  - Sütunun alan adı ya da etiketi gizli ad kalıbına uyar.
  - Raporun kaynak DocType'ında aynı adlı alan gizlidir.
  - Raporu yazan, başka kaynaktan gelen gizli değeri bu üç yoldan biriyle işaretler.

# Uygulama bir DocType'ı genel yazma araçlarına kapatabilir.
x-ai-write-closed-hook:
  description: |
    Uygulama `hooks.py` dosyasına `ai_write_closed_doctypes = ["DocType adı"]` yazar.
    Listedeki DocType'a genel yazma araçları `blocked_doctype` döner.
    Örneğin kimlik bağı ya da erişim kuralı tutan DocType böyle kapatılır.

# Uygulamaların `ai_tools` kancasıyla bildirdiği aracın biçimi (G-105).
x-ai-tools-hook:
  description: |
    Uygulama `hooks.py` dosyasına `ai_tools = ["uygulama.yol.islev"]` yazar.
    İşlev aşağıdaki biçimde bir liste döner. Katman bildirimi yüklerken doğrular.
  declaration:
    type: object
    additionalProperties: false
    required: [name, description, arguments, kind, handler]
    properties:
      name:
        type: string
        pattern: "^[a-z][a-z0-9_]{2,63}$"
        description: Araç adı. Katman başına uygulama adını ekler. Örnek sonuç `hrms_tr_approve_leave` olur.
      description: {type: string, description: İngilizce açıklama. Türkçesi çeviri dosyasındadır.}
      arguments: {type: string, description: "Girdi modelinin yolu. Model bir `pydantic.BaseModel` sınıfıdır ve `extra=\"forbid\"` ayarını taşır. `confirm`, `approved` ve `force` gibi alan adları reddedilir."}
      kind: {type: string, enum: [read, write]}
      roles: {type: array, items: {type: string}, description: Aracı görebilen roller. Boşsa giriş yapmış her kullanıcı görür.}
      destructive: {type: boolean, default: false}
      billable: {type: boolean, default: false}
      handler: {type: string, description: "İşi yapan işlevin yolu. İşlev kendi izin denetimini yapar. Yazma aracında `name` anahtarıyla etkilenen kaydın adını döner."}
      prepare:
        type: string
        description: |
          İsteğe bağlı. Yazma aracının ön denetim işlevinin yolu. İşlev Frappe'nin kayıt yöntemini çağırmaz.
          Değer dönerse `handler` yalnız o değeri alır. Ön denetimdeki hata `failed` sonucunu verir.
          `prepare` yoksa aracın her hatası `unknown` sonucunu verir.
      versioned:
        type: boolean
        default: false
        description: |
          İsteğe bağlı. Doğruysa katman yürütmeden hemen önce hedef satırı kilitler ve önizlemeyi yeniden çalıştırır.
          `target_version` değiştiyse iş yürümez. Sonuç `failed`, hata `document_changed` olur.
          Önizleme `target_doctype`, `target_name` ve `target_version` dönmelidir.
      preview:
        type: string
        description: |
          Önizleme üreten işlevin yolu. `kind: write` için zorunludur. İşlev izni denetler ve bir sözlük döner.
          İşlev `frappe.ValidationError` verirse araç `invalid_arguments` döner. Onay anında verirse öneri `rejected` olur.
          Sözlükte `summary` zorunludur. `target_doctype`, `target_name`, `target_version`, `changes` ve `details` isteğe bağlıdır.
          Katman önizlemeyi onay anında yeniden çalıştırır. `target_version` değiştiyse onayı reddeder.
