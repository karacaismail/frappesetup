openapi: 3.1.0
info:
  title: identity_sync
  version: 0.6.0
  summary: Endpoints of the user sync service
  description: |
    This service carries user changes from Keycloak to Press and to the tenant sites (G-81).

    The service receives the event. Then it reads the current state of the user from Keycloak.
    It chooses the actions from this current state. So the result does not change even if the same event arrives twice.

    ## Endpoint markers

    The status extension key tells whether the endpoint exists in code. It is the `x-` key that takes the two values below.
    `uygulandi` means the endpoint is implemented in code.
    `planlandi` means the endpoint is not written yet.

    `x-yikici` tells whether the endpoint can do destructive work.
    Destructive work is work that disables a user or removes a membership.
    No endpoint does paid work.

    `x-yurutme` tells who can execute the endpoint. It takes three values.
    The value that names the approval layer means this. Only the approval layer starts the real execution.
    `otomatik` means the endpoint needs no human approval. For example, the event endpoint is like this.
    `yalniz-okur` means the endpoint changes no record.

    ## AI and human approval

    The rules are in section 10 of `docs/sozlesmeler.md`.

    AI cannot execute the write endpoints of this service directly.
    The AI agent only reads and asks for a preview. A preview changes no record.
    Real execution comes only from the approval layer inside `platform_core`.
    The approval layer calls with its own service token after a human approves.

    The flow is as follows.

    1. The agent or the approval layer calls the endpoint with `dry_run: true`.
    2. The service returns the operations that would run and a `preview_digest` value.
    3. The approval layer shows the operations to the human. The approval is bound to this digest.
    4. The human approves. The approval layer calls the endpoint with `dry_run: false`.
    5. The request carries the `preview_digest` and `approval_id` fields.
    6. The service records the approval id as single-use. This record is written before the first external write.
       If the same `approval_id` arrives a second time, the service returns 409 and `approval_used`.
    7. The service computes the plan again. If the digest does not match, it returns 409 and `preview_changed`.
    8. The service writes the caller, the approval id, the digest and the result to the log.

    The digest covers everything that will be written. It covers the name, the target and all field values of every operation.
    For example, if the email or the name changes after the preview, the digest does not match.
    The digest is a keyed hash value, HMAC-SHA256. The key is in the `IDENTITY_SYNC_DIGEST_KEY` environment secret.
    Only the service knows the key. So someone who sees the digest cannot compare an email guess with the digest.
    The digest in the log is the same keyed value. The preview text carries no email and no name.
    For an operation that creates an organization or adds a member to an organization, the digest also covers the real Keycloak id of the organization.
    The service looks up the organization during planning. It does not look it up again during execution.
    If the organization was created after the preview, or a different organization was found, the digest does not match.

    One request can cover more than one event. If the plan of any event changed, the whole request returns 409.
    The service writes no event in that request.
    The service computes the plan once more at execution time. If the plan is not exactly the same, the operation does not run.

    The service keeps two client lists.
    A client in the `IDENTITY_SYNC_PREVIEW_AZP` list only reads and previews.
    A client in the `IDENTITY_SYNC_EXECUTE_AZP` list can execute.
    Only a trusted service client goes into the execute list.
    The agent token and the model identity do not go into this list.
    The trust boundary is this. Only the client of the approval layer can call execution.
    This service does not give approval. The approval layer checks the lifetime of the approval.
    The approval id is bound to the digest it was first used with and cannot be used again.
    A request rejected because the plan changed also consumes the approval. A new plan needs a new approval.

    ## Account deletion and disabled accounts

    The source of the account deletion flow is the shared contract (`docs/sozlesmeler.md`), section 7, and project record O-27.
    The flow has five steps and the order is fixed.

    1. The service disables the Keycloak user and ends the user's sessions.
    2. The service sends an `all_organizations: true` request to Press. Press disables the user and invalidates the API keys.
    3. The service disables the user in every tenant. Then it has the phone installations and the notification links deleted.
    4. The service has the fields that identify the person anonymized in Press and in every tenant. Business records are not deleted.
    5. The service deletes the Keycloak user.

    Every step can be repeated. If a step fails, the request goes into the dead-letter queue.
    If one of the earlier steps failed, the service skips step 5. That is, it does not delete the Keycloak user.
    A human replays the request with the `POST /v1/dead-letters/replay` endpoint.
    When the work is done, only the id of the request stays in the service record. The record carries no email.
    The service processes the user by the `sub` id. It never stores the email.

    The Keycloak `DELETE_ACCOUNT` event also starts the same flow.
    In that case the user is already deleted in Keycloak. Steps 1 and 5 do nothing.

    For a user disabled in Keycloak, the service also has the phone installations revoked.
    This operation is part of the disable plan.

    Steps 3 and 4 call three endpoints in the tenant and in Press. The names are in the shared contract (`docs/sozlesmeler.md`), sections 5, 6 and 7.
    The endpoints are named `platform_core.api.mobile.revoke_user_installations`,
    `platform_core.api.identity.anonymize_user` and `press_tr.api.identity.anonymize_user`.
    The shared contract does not define the response body of these endpoints.
    The responses the service expects are in the `Target` schemas at the end of this file. These schemas are a proposal.
    Until these endpoints are written, those steps fail and the request stays in the dead-letter queue.

    ## Common errors of all endpoints

    These errors are not written separately on every endpoint.
    An unknown path returns 404 and `not_found`.
    A wrong method returns 405 and `method_not_allowed`.
    A body larger than 65,536 bytes returns 413 and `too_large`.
    An invalid `Content-Length` header also returns 413. The service does not support a chunked body.
    A storage file error returns 500 and `storage_failed`.
    If another process is handling an event, the service waits at most 10 seconds.
    If the time runs out, the service returns 503 and `busy`. The caller must send the request again.
    On the event endpoint, a resend needs a new timestamp and a new signature.
    The connection of a request that does not complete its headers and body within 10 seconds is closed.

    ## Definite success response of the target endpoints

    The service calls the write endpoints of Press and of the tenant.
    These endpoints are named `press_tr.api.identity.*` and `platform_core.api.identity.*`.
    The contracts of these endpoints are the Press contract `contracts/press_tr.openapi.yaml` (0.1.0) and
    the `platform_core` identity contract in the same `contracts/` folder (0.2.0).
    The service counts only this response as success. It is HTTP 200 with a body that fits the result schema of that endpoint.
    The schemas are at the end of this file and start with `Target`.
    The service also compares the final state in the response with the state it asked for.
    For example, if it disabled the user, `enabled` must be false in the response.
    The target must have finished the work before it responds.
    A 202, an empty body or a body that does not fit the schema is not success.

    For a user with no tenant link, the tenant returns 404 and `IdentityNotFound`.
    The service counts this response as success in two operations. They are disabling the user and changing the email.
    The reason is that without a link there is no record to disable or to rename.
    If the `exc_type` field is not `IdentityNotFound`, a 404 is an error. A wrong address also returns 404.

    In the tenant the service calls `change_email` first and `provision` after it.
    The reason is that the tenant rejects the `provision` request with `EmailMismatch` while the link shows the old email.
    The service writes such an event to the dead-letter queue with the `unknown` state.
    The service does not count this event as processed and does not retry it by itself.
    If the same event arrives again, the service does not repeat the write and returns `unknown` again.
    A human checks the target. Then the human replays the event with the `include_unknown` option.
    If the request reached the target but the response could not be read, the result is also `unknown`.
    The 502 and 504 responses also count as `unknown`. The reason is that the server in between may have forwarded the request.
    If the connection could not be made at all, the result is not `unknown`. In this case the service retries.

    ## Interrupted work

    The service writes an accepted event to the dead-letter queue before it starts the work.
    This record is in the `failed` state and its attempt count is 0.
    The service sets the record to `unknown` just before the first external write.
    If the process stops midway, the record stays in the queue.
    If no write started, the event is replayed by hand.
    If a write started, the result is not known. A human checks the target and replays with `include_unknown`.
    When the event finishes with success, the record leaves the queue.

    ## Disabled and deleted accounts

    A user disabled or deleted in Keycloak is disabled everywhere.
    This plan does not depend on the membership list or on the Organization record.
    The service sends the disable requests even if those reads fail.
    The service sends a single `all_organizations: true` request to Press.
    Press then disables the user and invalidates the API keys.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:{port}
    description: Development environment. The port is the `PANE_PORT` value plus 5.
    variables:
      port:
        default: "6115"
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Tells that the service is up.
      description: This endpoint only reads. It needs no authentication. It returns no personal data.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-okur
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/events:
    post:
      operationId: postEvent
      summary: Receives and processes one Keycloak event.
      description: |
        The event source is the event listener plugin installed in Keycloak (`docs/sozlesmeler.md`, section 7).
        The Keycloak realm job installs the plugin. The plugin sends user events and admin events to this endpoint, signed.
        Our own operations can also call this endpoint.
        An event can get lost. The backup path is the reconcile that is started by hand. That endpoint is `/v1/reconcile`.

        The service processes the event in the same request. If an action fails, the event goes into the dead-letter queue.
        In this case the response is still 202. The reason is that the service now keeps the event.

        This endpoint can do destructive work. For example, if the user was disabled in Keycloak,
        the service disables the user in all tenants and removes the Press membership.
        This endpoint needs no human approval. The reason is that the event carries a change that already happened in Keycloak.

        The service does not choose the action from the content of the event. It chooses from the current state of the user in Keycloak.

        The body can be one of two formats.
        The first format is the service envelope. Its schema is named `Event`.
        The second format is the native Keycloak event format.
        Its schemas are named `KeycloakUserEvent` and `KeycloakAdminEvent`.

        Keycloak writes the internal id of the realm to the `realmId` field. It does not write the realm name.
        The service compares this id with the `IDENTITY_SYNC_REALM_ID` setting.
        If the id does not match, the service ignores the event. If the setting is empty, the service rejects the Keycloak format with 400.

        There is one exception. Keycloak 26.8.2 does not give the id of the user in the member-add event.
        The service cannot process this event in the Keycloak format and returns `ignored`.
        To report a member add, send the envelope with the `user_id` field.
      x-durum: uygulandi
      x-yikici: true
      x-yurutme: otomatik
      security:
        - webhookSignature: []
      parameters:
        - name: dry_run
          in: query
          required: false
          description: |
            If the value is `true`, the service changes no record.
            The service only returns the preview of the operations that would run. The response code is 200.
            If the parameter is missing, the value counts as `false`.
            Any other value or a repeated parameter returns 400. The service does not execute that request.
            The signature covers this choice. A preview signature is not accepted for execution.
          schema:
            type: string
            enum: ["true", "false"]
        - name: X-Identity-Sync-Timestamp
          in: header
          required: true
          description: The moment the signature was produced. The unit is seconds (Unix time).
          schema:
            type: string
            pattern: "^[0-9]{1,12}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/Event"
                - $ref: "#/components/schemas/KeycloakUserEvent"
                - $ref: "#/components/schemas/KeycloakAdminEvent"
            examples:
              epostaDogrulandi:
                summary: The user verified the email.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000001
                  kind: user
                  type: VERIFY_EMAIL
                  realm: platform
                  time: 1795000000000
                  user_id: 11111111-1111-4111-8111-111111111111
              uyelikSilindi:
                summary: An admin removed the user from the Organization membership.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000002
                  kind: admin
                  type: ORGANIZATION_MEMBERSHIP_DELETE
                  realm: platform
                  time: 1795000000500
                  user_id: 11111111-1111-4111-8111-111111111111
                  organization_id: 22222222-2222-4222-8222-222222222222
              keycloakKullaniciOlayi:
                summary: A user event in the native Keycloak format.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000003
                  time: 1795000000900
                  type: UPDATE_EMAIL
                  realmId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  userId: 11111111-1111-4111-8111-111111111111
              keycloakYoneticiOlayi:
                summary: An admin event in the native Keycloak format.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000004
                  time: 1795000001000
                  realmId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  operationType: UPDATE
                  resourceType: USER
                  resourcePath: users/11111111-1111-4111-8111-111111111111
      responses:
        "200":
          description: |
            The response of a preview request. The service changed no record.
            The status is `preview`, `ignored` or `failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "202":
          description: The service received the event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "400":
          description: The body is not JSON, a required field is missing or the `dry_run` value is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            The signature is missing, wrong, expired or already used.
            The error code is `bad_signature`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/reconcile:
    post:
      operationId: runReconcile
      summary: Compares Keycloak, Press and tenant users and repairs the difference.
      description: |
        This endpoint is the HTTP counterpart of the reconcile command. The command is named `reconcile`.
        The endpoint is not scheduled. It runs only when it is called.
        Keycloak is the source of truth.

        A preview request carries `dry_run: true`. The service only reads.
        The response carries the differences, the preview of the repair operations and the `preview_digest` value.
        The response carries no email. It refers to the user by the `sub` id.
        Clients in the preview list and in the execute list can ask for a preview.

        A repair request carries `dry_run: false`. Only the approval layer starts the repair.
        The request must carry the `preview_digest` and `approval_id` fields.
        The service computes the plan again under the work lock.
        If the plan is not exactly the same as the approved plan, the service returns 409 and writes nothing.
        This endpoint can do destructive work. For example, it disables in the tenant a user who is disabled in Keycloak.

        The service tries every operation and reports the result of each operation separately.
        The result is `done`, `failed` or `unknown`. An uncertain result is not retried.
        A remaining difference shows up again in the next preview.

        Some differences have no safe repair. The service only reports them.
        The examples are a disabled user in Press, a different email in Press,
        an unverified email and a record of another identity server.

        For the comparison the service asks Press and the tenant for a user list.
        These endpoints are named `press_tr.api.identity.list_identities` and
        `platform_core.api.identity.list_identities`. The response is in the `TargetIdentityList` schema.
        These two endpoints do not exist yet in the contracts of Press and of the tenant.
      x-durum: uygulandi
      x-yikici: true
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileRequest"
      responses:
        "200":
          description: |
            In a preview it returns the difference report and the repair preview.
            In a repair it returns the differences and the result of every operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileReport"
        "400":
          description: The body is invalid. For example, `dry_run` is missing or the approval fields are missing in a repair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PreviewChanged"
        "502":
          $ref: "#/components/responses/UpstreamFailed"
  /v1/dead-letters:
    get:
      operationId: listDeadLetters
      summary: Lists the events in the dead-letter queue.
      description: |
        This endpoint is the HTTP counterpart of the `dead-letters` command.
        The endpoint only reads. The records carry no email.
        Clients in the preview list and in the execute list can call this endpoint.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-okur
      security:
        - serviceToken: []
      responses:
        "200":
          description: The waiting events. The oldest event comes first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetterList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/dead-letters/replay:
    post:
      operationId: replayDeadLetters
      summary: Replays the events in the dead-letter queue once.
      description: |
        This endpoint is the HTTP counterpart of the `replay-dead-letters` command.
        This endpoint can do destructive work. A waiting event can disable a user.

        The preview is open to both lists. A client in either list can send the `dry_run: true` request.
        Only the approval layer starts the real execution.
        The execute request must carry the `preview_digest` and `approval_id` fields.
        If the plan changed after the preview, the service returns 409 and processes no event.

        The service executes the whole request under the work lock.
        The service first computes the plan of all events and checks the digest.
        If the plan of any event differs from the approved plan, the service returns 409. No event is written.
        If the digest matches, the service writes exactly those plans. It does not read again between the check and the write.
        An event whose preview cannot be produced is not executed. The result of this event is `failed`.
        If an event created an Organization, the following operations need a new preview and a new approval.
        That event stays in the queue.

        A successful event leaves the queue. An event that fails again stays in the queue.
        The service skips an event in the `unknown` state. The reason is that no blind repeat is made against the same target.
        `include_unknown: true` replays these events too. Check the target first.
      x-durum: uygulandi
      x-yikici: true
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRequest"
      responses:
        "200":
          description: The result of every event. In a preview it also returns `preview_digest`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayReport"
        "400":
          description: The body is invalid. For example, `dry_run` is missing or the approval fields are missing in an execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PreviewChanged"
  /v1/operations:
    get:
      operationId: listOperations
      summary: Lists the multi-step operations that were interrupted.
      description: |
        This endpoint is the HTTP counterpart of the `operations` command. The endpoint only reads.
        An invitation writes to Keycloak in three steps. It creates the user, makes the user a member and sends an email.
        The service records every step before it writes it. When the step is done, it updates the record.
        If the process stops midway, the record shows which step stayed uncertain.
        Finished operations do not appear in the list. The record carries no email.
        Clients in the preview list and in the execute list can call this endpoint.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-okur
      security:
        - serviceToken: []
      responses:
        "200":
          description: The interrupted operations. The oldest operation comes first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/operations/{operation_id}/resolve:
    post:
      operationId: resolveOperation
      summary: Closes one interrupted operation.
      description: |
        This endpoint is the HTTP counterpart of the `resolve-operation` command.
        A human checks the target first. For example, the human looks whether the user was created in Keycloak.
        Then the human closes the operation with the `completed` or the `abandoned` resolution.
        `completed` means the operation was completed at the target. `abandoned` means the operation was given up.
        This endpoint changes only the service's own record. It does not write to the target.
        Only the approval layer can call this endpoint. The service writes the caller and the result to the log.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      parameters:
        - name: operation_id
          in: path
          required: true
          description: The id of the operation. This value is the `approval_id` value of the approval that started the operation.
          schema:
            $ref: "#/components/schemas/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: The operation is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResult"
        "400":
          description: The body is invalid. For example, the `resolution` value is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: There is no interrupted operation with this id. The error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/revoke:
    post:
      operationId: revokeSession
      summary: Ends one Keycloak session.
      description: |
        The source is the shared contract (`docs/sozlesmeler.md`), section 7.
        When a user revokes a phone installation, `platform_core` calls this endpoint.
        The phone installation stores the `sid` value of the token at registration time. The body carries this value.
        The service deletes that session with the Keycloak Admin API. When the session is deleted, the refresh token also becomes invalid.

        The endpoint can be repeated. If the session is already ended, the service still returns 200.
        The service counts a "session not found" response as success only after it confirms that the realm responds.
        The reason is that a wrong address also returns 404.

        Only a client in the `IDENTITY_SYNC_SESSION_AZP` list can call the endpoint.
        This list carries the service clients of the `platform_core` sites. An example is `site-kiraci1`.
        The site requests the token with the `aud-identity-sync` scope (the shared contract, `docs/sozlesmeler.md`, section 2).
        Clients in the preview and execute lists cannot call this endpoint.
        This endpoint needs no human approval. The reason is that the user's own revoke action starts the work.
        This endpoint is destructive. An ended session cannot be opened again. The user logs in again.
      x-durum: uygulandi
      x-yikici: true
      x-yurutme: otomatik
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRevokeRequest"
      responses:
        "200":
          description: The session is ended. If the session was ended before this request, the response is still this one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevokeResult"
        "400":
          description: The body is invalid. For example, `sid` is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/UpstreamFailed"
  /v1/account-deletions:
    post:
      operationId: requestAccountDeletion
      summary: Requests the deletion of one account and executes the flow.
      description: |
        The source is the shared contract (`docs/sozlesmeler.md`), section 7, and project record O-27.
        A user asks for the deletion of the user's own account. The service records the request and executes the five steps in order.
        The steps are in the "Account deletion and disabled accounts" section at the top of this file.

        This endpoint is destructive and cannot be undone. The user is disabled everywhere and deleted from Keycloak.
        The fields that identify the person are anonymized. Business records are not deleted.

        The preview is open to both lists. A client in either list can send the `dry_run: true` request.
        The preview only returns the plan. It changes no record.
        Only the approval layer starts the real execution.
        The execute request must carry the `preview_digest` and `approval_id` fields.
        The approval here is the account owner's own approval. The approval layer collects the approval.

        The service records the request before it starts the work. The id of the request is the `approval_id` value.
        If a step fails, the response is still 200 and the status is `dead_lettered` or `unknown`.
        The request is then in the dead-letter queue. A human replays the request with `POST /v1/dead-letters/replay`.
      x-durum: uygulandi
      x-yikici: true
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequest"
      responses:
        "200":
          description: |
            In a preview it returns the plan and `preview_digest`.
            In an execution it returns the result of the request. The status is `processed`, `dead_lettered`, `unknown` or `duplicate`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResult"
        "400":
          description: The body is invalid. For example, `dry_run` is missing or the approval fields are missing in an execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PreviewChanged"
  /v1/tenants/{tenant}/client:
    post:
      operationId: ensureTenantClient
      summary: Prepares the `site-<tenant>` client of the tenant and its secret.
      description: |
        Press calls this endpoint when it creates a new site (G-39, G-112).
        The core of the work exists in code. The HTTP endpoint does not exist yet.
        The endpoint returns a secret. Section 10 of the shared contract (`docs/sozlesmeler.md`) forbids returning a secret field.
        So the endpoint is not offered as an AI tool. How the secret reaches Press is an open decision.
      x-durum: planlandi
      x-yikici: false
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,39}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url]
              properties:
                base_url:
                  type: string
                  description: The full address of the tenant site.
      responses:
        "200":
          description: The client is ready.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_secret]
                properties:
                  client_id:
                    type: string
                  client_secret:
                    type: string
                    description: Returned only in this response. It is not written to the log.
  /v1/invitations:
    post:
      operationId: inviteUser
      summary: Invites a user.
      description: |
        Press calls this endpoint from inside `press_tr.api.team.invite` (G-16, G-79).
        If the user does not exist, the service creates the user in Keycloak. Then it adds the user to the Organization.
        Then it sends the invitation email with `execute-actions-email`.
        The actions in the email are UPDATE_PASSWORD and CONFIGURE_TOTP.
        This endpoint deletes no record and disables no user. But a sent email cannot be taken back.

        The preview is open to both lists. A client in either list can send the `dry_run: true` request.
        The preview only reads.
        Only the approval layer starts the real execution.
        The execute request must carry the `preview_digest` and `approval_id` fields.
        The digest also covers the fields of the request. The approval of one invitation is not accepted for another invitation.

        The service executes only the approved plan. If the plan changed in between, the service returns 409.
        For example, if the user was created after the preview, the plan has changed.
        A second invitation does not create a second user. But it needs a new preview and a new approval.
        A second invitation sends the email again.
        If an invitation is cut off midway, a new preview shows the remaining operations.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRequest"
      responses:
        "200":
          description: The invitation was sent or the preview was produced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResult"
        "400":
          description: The body is invalid. For example, `dry_run` is missing or the approval fields are missing in an execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PreviewChanged"
        "502":
          $ref: "#/components/responses/UpstreamFailed"
components:
  securitySchemes:
    webhookSignature:
      type: apiKey
      in: header
      name: X-Identity-Sync-Signature
      description: |
        The value has the form `sha256=<hex digest>`.
        The digest is produced with HMAC-SHA256. The key is in the `IDENTITY_SYNC_WEBHOOK_SECRET` environment variable.

        The signed content has three parts, `<timestamp>.<mode>.<raw body>`.
        The timestamp is the value in the `X-Identity-Sync-Timestamp` header.
        The mode is `execute` or `preview`. The mode of a `dry_run=true` request is `preview`.

        The service makes these three checks.
        The timestamp can differ from the clock of the service by at most 300 seconds.
        The same signature is accepted only once. A second use gets 401.
        A preview signature is not accepted for execution. An execution signature is not accepted for a preview either.

        If the sender will send the same event again, it signs again with a new timestamp.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The Keycloak service token. The rules are in the shared contract (`docs/sozlesmeler.md`), section 3.
        This token is the token of the requests that come to the service.
        The token the service uses when it goes to the Keycloak Admin API is a separate one.
        That token is requested with `scope=admin-api kc-admin-api` (the shared contract, `docs/sozlesmeler.md`, section 2).
        The Keycloak roles of the service account go only into that token.
        The roles are `view-users`, `query-users`, `manage-users` and the minimum role needed for organizations.
        The token that goes to the tenant and to Press does not carry these roles.
        The service verifies the token with the shared `oidc_verify` library.
        The `aud` value of the token must be only `identity-sync`.
        The `azp` value of the token must be in one of two lists.
        The `IDENTITY_SYNC_PREVIEW_AZP` list gives permission to read and to preview.
        The `IDENTITY_SYNC_EXECUTE_AZP` list also gives permission to execute.
        The `IDENTITY_SYNC_SESSION_AZP` list opens only the `/v1/sessions/revoke` endpoint.
        A client can be in only one of these lists.
        If both lists are empty, the service rejects every request.
        If the library is not installed, the service also rejects every request.
        If the request also carries a cookie, the service rejects the request.
  responses:
    Unauthorized:
      description: The service token is missing or invalid. The error code is `unauthorized`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The token is valid but the client has no permission for this operation. The error code is `forbidden`.
        For example, a client in the preview list asked for execution.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreviewChanged:
      description: |
        The service executed no operation. A new preview and a new approval are needed. There can be two reasons.
        If the error code is `preview_changed`, the plan changed after the preview.
        If the error code is `approval_used`, this `approval_id` was used before.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpstreamFailed:
      description: Keycloak, Press or the tenant site did not respond or rejected the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ResourceId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,128}$"
      description: An id that goes into the address path. It carries only letters, digits, hyphens and underscores.
    Event:
      type: object
      description: The service envelope. It carries no personal data.
      required: [id, kind, type, realm, time]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: The unique id of the event. The service does not process the same id a second time.
        kind:
          type: string
          enum: [user, admin]
          description: |
            `user` shows work that the user did personally.
            `admin` shows work that an admin or the Admin API did.
        type:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The service processes the following types.
            For `user` they are REGISTER, VERIFY_EMAIL, UPDATE_EMAIL and DELETE_ACCOUNT.
            For `admin` they are USER_CREATE, USER_UPDATE, USER_DELETE,
            ORGANIZATION_MEMBERSHIP_CREATE and ORGANIZATION_MEMBERSHIP_DELETE.
            The service ignores any other type and returns `ignored`.
        realm:
          type: string
          minLength: 1
          maxLength: 255
          description: The realm name. If it is not the same as the realm name in the settings, the service ignores the event.
        time:
          type: integer
          description: The time of the event. The unit is milliseconds.
        user_id:
          $ref: "#/components/schemas/ResourceId"
        organization_id:
          $ref: "#/components/schemas/ResourceId"
      additionalProperties: true
    QueuedEvent:
      type: object
      description: |
        One record in the dead-letter queue. The record can be a Keycloak event or the service's own request.
        If the `kind` value is `request`, the record is an account deletion request. Then the `type` value is `ACCOUNT_DELETION`.
        The `request` kind cannot come from the event endpoint. Only the `/v1/account-deletions` endpoint produces it.
      required: [id, kind, type, realm, time]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [user, admin, request]
        type:
          type: string
        realm:
          type: string
        time:
          type: integer
        user_id:
          $ref: "#/components/schemas/ResourceId"
        organization_id:
          $ref: "#/components/schemas/ResourceId"
    KeycloakUserEvent:
      type: object
      description: |
        The Keycloak user event representation (Keycloak 26.8.2, EventRepresentation).
        The service uses only the fields below. It drops the other fields.
      required: [id, time, type, realmId]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        time:
          type: integer
        type:
          type: string
          minLength: 1
          maxLength: 255
        realmId:
          type: string
          description: The internal id of the realm. It is not the realm name.
        userId:
          $ref: "#/components/schemas/ResourceId"
      additionalProperties: true
    KeycloakAdminEvent:
      type: object
      description: |
        The Keycloak admin event representation (Keycloak 26.8.2, AdminEventRepresentation).
        The service reads the id of the user and of the Organization from the `resourcePath` field.
        If the `id` field is missing, the service derives a stable id from the event.
      required: [time, realmId, operationType, resourceType, resourcePath]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        time:
          type: integer
        realmId:
          type: string
          description: The internal id of the realm. It is not the realm name.
        operationType:
          type: string
          minLength: 1
        resourceType:
          type: string
          minLength: 1
        resourcePath:
          type: string
          description: For example, `users/<user>` or `organizations/<organization>/members/<user>`.
      additionalProperties: true
    EventResult:
      type: object
      required: [status, actions]
      properties:
        status:
          type: string
          enum: [processed, duplicate, ignored, dead_lettered, unknown, preview, failed]
          description: |
            `processed` shows that all actions finished with definite success.
            `duplicate` shows that the event was processed before.
            `ignored` shows that the service does not process this event type or this realm.
            `dead_lettered` shows that the event went into the dead-letter queue.
            Going into the queue is not success. The service still tries all steps.
            For example, the user is disabled in the tenants even if Press does not respond.
            `unknown` shows that a target did not give a definite success response.
            The event waits in the queue in the `unknown` state. The service does not count the event as processed.
            In a replay response, `unknown` shows that the event was skipped.
            `preview` shows that only a preview was produced.
            `failed` shows that the preview could not be produced. For example, Keycloak did not respond.
        actions:
          type: array
          description: The names of the actions that finished with definite success.
          items:
            type: string
        previews:
          type: array
          description: Returned only in the `preview` status.
          items:
            $ref: "#/components/schemas/Preview"
        plan_digest:
          $ref: "#/components/schemas/PlanDigest"
    PlanDigest:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: |
        Returned only in the `preview` status. It is the keyed digest of the plan of this event (HMAC-SHA256).
        The digest covers the name, the target and all field values of every operation.
        The value is a hash. The email and the name cannot be read from this value.
    Preview:
      type: object
      description: The preview of one write operation. It carries no email and no secret.
      required: [operation, target, summary, destructive]
      properties:
        operation:
          type: string
          description: The name of the operation.
          enum:
            - keycloak.ensure_organization
            - keycloak.create_organization
            - keycloak.add_organization_member
            - keycloak.create_user
            - keycloak.send_execute_actions_email
            - keycloak.create_site_client
            - keycloak.disable_user
            - keycloak.delete_user
            - press.anonymize_user
            - tenant.revoke_user_installations
            - tenant.anonymize_user
            - press.ensure_team
            - press.remove_team_member
            - tenant.provision
            - tenant.set_enabled
            - tenant.change_email
        target:
          type: string
          description: The target of the operation. For example, the name of the tenant.
        summary:
          type: string
          description: An English sentence that describes the operation. It refers to the user by the `sub` id.
        destructive:
          type: boolean
          description: |
            True if the operation is destructive.
            `press.remove_team_member` is always destructive.
            For a deleted or disabled user this operation covers all teams.
            Press then also disables the user and invalidates the API keys.
            `tenant.set_enabled` is destructive if it disables the user.
    PreviewDigest:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: |
        The keyed digest of the preview (HMAC-SHA256). The approval is bound to this digest.
        The execute request must carry the same digest.
    ApprovalId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,128}$"
      description: |
        The id of the approval record in the approval layer.
        The service writes this value to the operation log. The approval layer checks the validity of the value.
    DeadLetter:
      type: object
      required: [event, error, state, attempts, first_failed_at, last_failed_at]
      properties:
        event:
          $ref: "#/components/schemas/QueuedEvent"
        error:
          type: string
          description: |
            The failed steps and their status codes. The steps are separated by semicolons.
            The response body is not stored. An example is `tenant.provision kiraci1: HTTP 503`.
        state:
          type: string
          enum: [failed, unknown]
          description: |
            `failed` shows that the target rejected the operation or could not be reached.
            If the attempt count is 0, the service accepted the event but stopped before it could start the work.
            `unknown` shows that it is not known whether the operation finished.
            If the process stopped after a write, the state is also `unknown`.
        attempts:
          type: integer
          description: How many times the event failed.
        first_failed_at:
          type: number
          description: The time of the first failure. The unit is seconds (Unix time).
        last_failed_at:
          type: number
          description: The time of the last failure. The unit is seconds (Unix time).
    DeadLetterList:
      type: object
      required: [dead_letters]
      properties:
        dead_letters:
          type: array
          items:
            $ref: "#/components/schemas/DeadLetter"
    ReplayRequest:
      description: The caller must write the `dry_run` field explicitly. One of two forms is valid.
      oneOf:
        - $ref: "#/components/schemas/ReplayPreviewRequest"
        - $ref: "#/components/schemas/ReplayExecuteRequest"
    ReplayPreviewRequest:
      type: object
      description: A preview request. The service changes no record.
      required: [dry_run]
      properties:
        dry_run:
          type: boolean
          const: true
        include_unknown:
          type: boolean
          description: |
            If true, the service also adds the events in the `unknown` state to the plan.
            The default value is false.
    ReplayExecuteRequest:
      type: object
      description: An execute request. Only the approval layer can send it.
      required: [dry_run, preview_digest, approval_id]
      properties:
        dry_run:
          type: boolean
          const: false
        include_unknown:
          type: boolean
          description: It must be the same as the value in the preview. Otherwise the digest does not match.
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        approval_id:
          $ref: "#/components/schemas/ApprovalId"
    ReplayReport:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReplayResult"
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
    ReplayResult:
      type: object
      required: [event_id, status, actions]
      properties:
        event_id:
          type: string
        status:
          type: string
          enum: [processed, duplicate, ignored, dead_lettered, unknown, preview, failed]
        actions:
          type: array
          items:
            type: string
        previews:
          type: array
          items:
            $ref: "#/components/schemas/Preview"
        plan_digest:
          $ref: "#/components/schemas/PlanDigest"
    InvitationRequest:
      description: The caller must write the `dry_run` field explicitly. One of two forms is valid.
      oneOf:
        - $ref: "#/components/schemas/InvitationPreviewRequest"
        - $ref: "#/components/schemas/InvitationExecuteRequest"
    InvitationPreviewRequest:
      type: object
      description: A preview request. The service only reads.
      required: [email, organization_id, dry_run]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        organization_id:
          $ref: "#/components/schemas/ResourceId"
        dry_run:
          type: boolean
          const: true
    InvitationExecuteRequest:
      type: object
      description: |
        An execute request. Only the approval layer can send it.
        The invitation fields must be the same as the fields in the preview. Otherwise the digest does not match.
      required: [email, organization_id, dry_run, preview_digest, approval_id]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        organization_id:
          $ref: "#/components/schemas/ResourceId"
        dry_run:
          type: boolean
          const: false
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        approval_id:
          $ref: "#/components/schemas/ApprovalId"
    Email:
      type: string
      maxLength: 254
      pattern: "^[^@\\s]{1,64}@[^@\\s]{1,189}$"
    InvitationResult:
      type: object
      required: [subject, previews]
      properties:
        subject:
          type: [string, "null"]
          description: |
            The Keycloak id of the user (`sub`).
            In a preview the value is null if the user does not exist yet.
        previews:
          type: array
          items:
            $ref: "#/components/schemas/Preview"
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
    OperationList:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
    Operation:
      type: object
      description: One interrupted multi-step operation. It carries no email.
      required: [operation_id, operation, organization_id, subject, state, steps]
      properties:
        operation_id:
          $ref: "#/components/schemas/ApprovalId"
        operation:
          type: string
          enum: [invite_user]
        organization_id:
          type: string
        subject:
          type: [string, "null"]
          description: The Keycloak id of the user. It is null if the user is not created yet.
        state:
          type: string
          enum: [failed, unknown]
          description: |
            `failed` shows that a step failed for certain.
            `unknown` shows that the result of a step is not known. For example, the process stopped during a write.
        steps:
          type: array
          items:
            type: object
            required: [step, status]
            properties:
              step:
                type: string
                description: The name of the step. For example, `keycloak.send_execute_actions_email`.
              status:
                type: string
                enum: [pending, done, failed, unknown]
                description: |
                  `pending` shows that the step never started.
                  `done` shows that the step finished.
                  `failed` shows that Keycloak rejected the step.
                  `unknown` shows that the step started but its result is not known.
    ResolveRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [completed, abandoned]
    ResolveResult:
      type: object
      required: [operation_id, state, resolution]
      properties:
        operation_id:
          $ref: "#/components/schemas/ApprovalId"
        state:
          type: string
          const: resolved
        resolution:
          type: string
          enum: [completed, abandoned]
    SessionRevokeRequest:
      type: object
      required: [sid]
      properties:
        sid:
          $ref: "#/components/schemas/ResourceId"
      additionalProperties: false
    SessionRevokeResult:
      type: object
      required: [sid, revoked]
      properties:
        sid:
          type: string
          description: The id of the ended session.
        revoked:
          type: boolean
          const: true
          description: The session no longer exists.
    AccountDeletionRequest:
      description: The caller must write the `dry_run` field explicitly. One of two forms is valid.
      oneOf:
        - $ref: "#/components/schemas/AccountDeletionPreviewRequest"
        - $ref: "#/components/schemas/AccountDeletionExecuteRequest"
    AccountDeletionPreviewRequest:
      type: object
      description: A preview request. The service changes no record.
      required: [subject, dry_run]
      properties:
        subject:
          $ref: "#/components/schemas/ResourceId"
        dry_run:
          type: boolean
          const: true
    AccountDeletionExecuteRequest:
      type: object
      description: An execute request. Only the approval layer can send it.
      required: [subject, dry_run, preview_digest, approval_id]
      properties:
        subject:
          $ref: "#/components/schemas/ResourceId"
        dry_run:
          type: boolean
          const: false
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        approval_id:
          $ref: "#/components/schemas/ApprovalId"
    AccountDeletionResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [preview, processed, dead_lettered, unknown, duplicate]
          description: |
            `preview` shows that only the plan was returned.
            `processed` shows that all five steps finished.
            `dead_lettered` shows that a step failed and the request waits in the queue.
            `unknown` shows that the result of a step is not known.
            `duplicate` shows that this request finished before.
        request_id:
          $ref: "#/components/schemas/ApprovalId"
        actions:
          type: array
          description: The names of the steps that finished with definite success.
          items:
            type: string
        previews:
          type: array
          description: Returned only in a preview.
          items:
            $ref: "#/components/schemas/Preview"
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
    ReconcileRequest:
      description: The caller must write the `dry_run` field explicitly. One of two forms is valid.
      oneOf:
        - $ref: "#/components/schemas/ReconcilePreviewRequest"
        - $ref: "#/components/schemas/ReconcileExecuteRequest"
    ReconcilePreviewRequest:
      type: object
      description: A preview request. The service changes no record.
      required: [dry_run]
      properties:
        dry_run:
          type: boolean
          const: true
    ReconcileExecuteRequest:
      type: object
      description: A repair request. Only the approval layer can send it.
      required: [dry_run, preview_digest, approval_id]
      properties:
        dry_run:
          type: boolean
          const: false
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        approval_id:
          $ref: "#/components/schemas/ApprovalId"
    ReconcileReport:
      type: object
      required: [count, differences]
      properties:
        count:
          type: integer
          description: The number of differences.
        differences:
          type: array
          items:
            $ref: "#/components/schemas/Difference"
        previews:
          type: array
          description: Returned only in a preview. It is the preview of the operations that will remove the differences.
          items:
            $ref: "#/components/schemas/Preview"
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        results:
          type: array
          description: Returned only in a repair. It is the result of every operation.
          items:
            $ref: "#/components/schemas/RepairResult"
    RepairResult:
      type: object
      required: [operation, target, status]
      properties:
        operation:
          type: string
          description: The name of the operation. For example, `tenant.set_enabled`.
        target:
          type: string
          description: The target of the operation. The value is `press` or the name of the tenant.
        status:
          type: string
          enum: [done, failed, unknown]
          description: |
            `done` shows that the target gave a definite success response.
            `failed` shows that the target rejected the operation or could not be reached.
            `unknown` shows that it is not known whether the operation finished.
        error:
          type: string
          description: The failed step and its status code. It carries no response body.
    Difference:
      type: object
      required: [target, subject, kind]
      properties:
        target:
          type: string
          description: The place where the difference was seen. The value is `press` or the name of the tenant.
        subject:
          type: string
          description: The Keycloak id of the user (`sub`).
        kind:
          type: string
          enum:
            - missing
            - disabled
            - email_mismatch
            - closed_in_keycloak
            - unexpected
            - unverified_in_keycloak
            - missing_team_membership
            - unexpected_team_membership
            - foreign_issuer
          description: |
            `missing` shows that the user has no link in the tenant.
            `disabled` shows that the expected user is disabled at the target.
            `email_mismatch` shows that the email at the target is different.
            `closed_in_keycloak` shows this. The user is disabled or deleted in Keycloak and enabled at the target.
            `unexpected` shows that the user is enabled in the tenant but is not a member of the tenant's organization.
            `unverified_in_keycloak` shows that the user is enabled in the tenant but the email in Keycloak is not verified.
            `missing_team_membership` shows a team membership that is missing in Press.
            `unexpected_team_membership` shows an extra team membership in Press.
            `foreign_issuer` shows that the record belongs to another identity server.
        organization_id:
          type: string
          description: Returned only in team membership differences. It is the id of the organization in Keycloak.
    TargetIdentityList:
      type: object
      description: |
        The response expected from the `list_identities` endpoints. This schema is not an endpoint of this service.
        These endpoints do not exist yet in the contracts of Press and of the tenant. This schema is a proposal.
      required: [message]
      properties:
        message:
          type: array
          items:
            type: object
            required: [issuer, subject, email, enabled]
            properties:
              issuer:
                type: string
              subject:
                type: string
              email:
                type: string
              enabled:
                type: boolean
              organization_ids:
                type: array
                description: Only Press sends it. These are the organization ids of the teams the user is a member of.
                items:
                  type: string
    TargetEnsureTeamResult:
      type: object
      description: |
        The definite success response expected from the `press_tr.api.identity.ensure_team` endpoint.
        This schema is not an endpoint of this service. It is the response the service expects from Press.
        The source is the `contracts/press_tr.openapi.yaml` file.
      required: [message]
      properties:
        message:
          type: object
          required: [team, created]
          properties:
            team:
              type: string
              minLength: 1
              description: The name of the team in Press.
            created:
              type: boolean
              description: True if the team was created in this request.
          additionalProperties: true
    TargetRemoveTeamMemberResult:
      type: object
      description: |
        The definite success response expected from the `press_tr.api.identity.remove_team_member` endpoint.
        The source is the `contracts/press_tr.openapi.yaml` file.
      required: [message]
      properties:
        message:
          type: object
          required: [team, member]
          properties:
            team:
              type: [string, "null"]
              description: The name of the team. It is null in a request for all teams or if there is no team.
            member:
              type: boolean
              const: false
              description: The user is no longer a member.
          additionalProperties: true
    TargetProvisionResult:
      type: object
      description: |
        The definite success response expected from the `platform_core.api.identity.provision` endpoint.
        The source is the `platform_core` identity contract in the `contracts/` folder.
        The service also compares the `enabled` value with the value it asked for.
      required: [message]
      properties:
        message:
          type: object
          required: [user, enabled, linked]
          properties:
            user:
              type: string
              minLength: 1
              description: The name of the user in the tenant. This name is the email.
            enabled:
              type: boolean
            linked:
              type: boolean
              const: true
          additionalProperties: true
    TargetSetEnabledResult:
      type: object
      description: |
        The definite success response expected from the `platform_core.api.identity.set_enabled` endpoint.
        The source is the `platform_core` identity contract in the `contracts/` folder.
        The service also compares the `enabled` value with the value it asked for.
      required: [message]
      properties:
        message:
          type: object
          required: [user, enabled]
          properties:
            user:
              type: string
              minLength: 1
            enabled:
              type: boolean
          additionalProperties: true
    TargetRevokeUserInstallationsResult:
      type: object
      description: |
        The response expected from the `platform_core.api.mobile.revoke_user_installations` endpoint.
        The name of the endpoint is in the shared contract (`docs/sozlesmeler.md`), section 5. Its owner is the platform-core-mobil job.
        The shared contract does not define the response body. This schema is a proposal.
        The endpoint deletes all phone installations and notification links of the user.
        The request carries the `issuer` and `subject` fields. The endpoint must be safe to repeat.
        If there is no link, the endpoint returns 404 and `IdentityNotFound`. The service counts this response as success.
      required: [message]
      properties:
        message:
          type: object
          required: [revoked]
          properties:
            revoked:
              type: integer
              description: The number of installations deleted in this request. It is 0 if no installation is left.
          additionalProperties: true
    TargetAnonymizeUserResult:
      type: object
      description: |
        The response expected from the `platform_core.api.identity.anonymize_user` and `press_tr.api.identity.anonymize_user` endpoints.
        The names of the endpoints are in the shared contract (`docs/sozlesmeler.md`), sections 5 and 6.
        The shared contract does not define the response body. This schema is a proposal.
        The endpoint disables the user and anonymizes the fields that identify the person. It does not delete business records.
        The endpoint in Press also invalidates the API keys.
        The request carries the `issuer` and `subject` fields. The endpoint must be safe to repeat.
        If there is no link, the endpoint returns 404 and `IdentityNotFound`. The service counts this response as success.
      required: [message]
      properties:
        message:
          type: object
          required: [anonymized]
          properties:
            anonymized:
              type: boolean
              const: true
          additionalProperties: true
    TargetChangeEmailResult:
      type: object
      description: |
        The definite success response expected from the `platform_core.api.identity.change_email` endpoint.
        The source is the `platform_core` identity contract in the `contracts/` folder.
        The service also compares the `user` value with the new email it sent.
      required: [message]
      properties:
        message:
          type: object
          required: [user]
          properties:
            user:
              type: string
              minLength: 1
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - bad_request
            - bad_signature
            - unauthorized
            - forbidden
            - preview_changed
            - approval_used
            - too_large
            - busy
            - not_found
            - method_not_allowed
            - storage_failed
            - upstream_failed
