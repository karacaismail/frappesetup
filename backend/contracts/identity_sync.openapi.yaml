openapi: 3.1.0
info:
  title: identity_sync
  version: 0.2.0
  summary: Kullanıcı eşitleme servisinin uçları
  description: |
    Bu servis Keycloak'taki kullanıcı değişikliklerini Press'e ve kiracı sitelerine taşır (G-81).

    Servis olayı alır. Sonra kullanıcının güncel durumunu Keycloak'tan okur.
    Eylemleri bu güncel duruma göre seçer. Bu yüzden aynı olay iki kez gelse de sonuç değişmez.

    ## Uçların işaretleri

    `x-durum` alanı ucun kodda olup olmadığını söyler.
    `uygulandi` değeri ucun kodda olduğunu gösterir.
    `planlandi` değeri ucun henüz yazılmadığını gösterir.

    `x-yikici` alanı ucun yıkıcı iş yapıp yapamadığını söyler.
    Yıkıcı iş, kullanıcıyı kapatan ya da üyeliği kaldıran iştir.
    Hiçbir uç ücretli iş yapmaz.

    `x-yurutme` alanı ucu kimin yürütebildiğini söyler.
    `yalniz-onay-katmani` değeri şunu söyler: gerçek yürütmeyi yalnız onay katmanı başlatır.
    `otomatik` değeri ucun insan onayı istemediğini söyler. Örneğin olay ucu böyledir.
    `yalniz-okur` değeri ucun hiçbir kaydı değiştirmediğini söyler.

    ## Yapay zekâ ve insan onayı

    Kurallar `docs/sozlesmeler.md` dosyasının 10. bölümündedir.

    Yapay zekâ bu servisin yazma uçlarını doğrudan yürütemez.
    Yapay zekâ aracısı yalnız okur ve önizleme ister. Önizleme hiçbir kaydı değiştirmez.
    Gerçek yürütme yalnız `platform_core` içindeki onay katmanından gelir.
    Onay katmanı insan onayladıktan sonra kendi servis belirteciyle çağırır.

    Akış şudur:

    1. Aracı ya da onay katmanı ucu `dry_run: true` ile çağırır.
    2. Servis çalışacak işleri ve bir `preview_digest` değeri döner.
    3. Onay katmanı işleri insana gösterir. Onay bu özete bağlanır.
    4. İnsan onaylar. Onay katmanı ucu `dry_run: false` ile çağırır.
    5. İstek `preview_digest` ve `approval_id` alanlarını taşır.
    6. Servis planı yeniden hesaplar. Özet tutmazsa 409 ve `preview_changed` döner.
    7. Servis çağıranı, onay kimliğini ve özeti günlüğe yazar. Sonra işi yürütür.

    Servis iki istemci listesi tutar.
    `IDENTITY_SYNC_PREVIEW_AZP` listesindeki istemci yalnız okur ve önizler.
    `IDENTITY_SYNC_EXECUTE_AZP` listesindeki istemci yürütebilir.
    Yürütme listesine yalnız güvenilir servis istemcisi girer.
    Aracı belirteci ve model kimliği bu listeye girmez.
    Onayın tek kullanımını ve süresini onay katmanı denetler. Bu servis onay vermez.

    ## Bütün uçların ortak hataları

    Bu hatalar her uçta ayrıca yazılmadı.
    Bilinmeyen yol 404 ve `not_found` döner.
    Yanlış yöntem 405 ve `method_not_allowed` döner.
    65.536 bayttan büyük ya da uzunluğu belirsiz gövde 413 ve `too_large` döner.
    Kayıt dosyası hatası 500 ve `storage_failed` döner.
    Başlığını ve gövdesini 10 saniyede tamamlamayan isteğin bağlantısı kapanır.

    ## Hedef uçların kesin başarı yanıtı

    Servis Press'in ve kiracının yazma uçlarını çağırır.
    Bu uçlar `press_tr.api.identity.*` ve `platform_core.api.identity.*` adlarını taşır.
    Servis yalnız şu yanıtı başarı sayar: HTTP 200 ve aşağıdaki şemalardan birine uyan gövde.
    `ensure_team` ucunun yanıtı `EnsureTeamResult` şemasına uymalıdır.
    Bu yanıt ortak sözleşmenin “Kuruluş ile takım eşlemesi” bölümünde tanımlıdır.
    Öteki yazma uçlarının yanıtı `TargetWriteResult` şemasına uymalıdır.
    Hedef işi yanıt vermeden önce bitirmiş olmalıdır.
    202, boş gövde ya da başka `status` değeri başarı değildir.
    Servis böyle bir olayı `unknown` durumuyla bekleme kuyruğuna yazar.
    Servis bu olayı işlenmiş saymaz ve kendiliğinden yeniden denemez.
    İnsan hedefi denetler. Sonra olayı `include_unknown` seçeneğiyle yeniden işletir.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:{port}
    description: Geliştirme ortamı. Port, `PANE_PORT` değerinin 5 fazlasıdır.
    variables:
      port:
        default: "6115"
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Servisin ayakta olduğunu söyler.
      description: Bu uç yalnız okur. Kimlik istemez. Kişisel veri dönmez.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-okur
      security: []
      responses:
        "200":
          description: Servis ayakta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/events:
    post:
      operationId: postEvent
      summary: Bir Keycloak olayını alır ve işler.
      description: |
        Seçilen olay kaynağı eklentisiz yoldur (karar notu 0001).
        Bu ucu bizim işlemlerimiz çağırır. Sonradan bir eklenti eklenirse eklenti de bu uca gönderir.

        Servis olayı aynı istekte işler. Eylem başarısız olursa olay bekleme kuyruğuna girer.
        Bu durumda yanıt yine 202 olur. Çünkü olayı artık servis saklar.

        Bu uç yıkıcı iş yapabilir. Örneğin kullanıcı Keycloak'ta kapatıldıysa
        servis kullanıcıyı bütün kiracılarda kapatır ve Press üyeliğini kaldırır.
        Bu uç insan onayı istemez. Çünkü olay Keycloak'ta zaten olmuş bir değişikliği taşır.

        Servis eylemi olayın içeriğinden seçmez. Kullanıcının Keycloak'taki güncel durumundan seçer.

        Gövde iki biçimden biri olabilir.
        Birinci biçim servis zarfıdır. Şeması `Event` adını taşır.
        İkinci biçim Keycloak'ın kendi olay biçimidir.
        Şemaları `KeycloakUserEvent` ve `KeycloakAdminEvent` adını taşır.

        Keycloak `realmId` alanına realm'in iç kimliğini yazar. Realm adını yazmaz.
        Servis bu kimliği `IDENTITY_SYNC_REALM_ID` ayarıyla karşılaştırır.
        Kimlik tutmazsa servis olayı yok sayar. Ayar boşsa servis Keycloak biçimini 400 ile reddeder.

        Bir istisna vardır. Keycloak 26.8.2 üye ekleme olayında kullanıcının kimliğini vermez.
        Servis Keycloak biçimindeki bu olayı işleyemez ve `ignored` döner.
        Üye eklemeyi bildirmek için zarfı `user_id` alanıyla gönderin.
      x-durum: uygulandi
      x-yikici: true
      x-yurutme: otomatik
      security:
        - webhookSignature: []
      parameters:
        - name: dry_run
          in: query
          required: false
          description: |
            Değer `true` ise servis hiçbir kaydı değiştirmez.
            Servis yalnız çalışacak işlerin önizlemesini döner. Yanıt kodu 200 olur.
            Parametre yoksa değer `false` sayılır.
            Başka değer ya da yinelenen parametre 400 döner. Servis o isteği yürütmez.
            İmza bu seçimi kapsar. Önizleme imzası yürütmede geçmez.
          schema:
            type: string
            enum: ["true", "false"]
        - name: X-Identity-Sync-Timestamp
          in: header
          required: true
          description: İmzanın üretildiği an. Birim saniyedir (Unix zamanı).
          schema:
            type: string
            pattern: "^[0-9]{1,12}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Event"
                - $ref: "#/components/schemas/KeycloakUserEvent"
                - $ref: "#/components/schemas/KeycloakAdminEvent"
            examples:
              epostaDogrulandi:
                summary: Kullanıcı e-postasını doğruladı.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000001
                  kind: user
                  type: VERIFY_EMAIL
                  realm: platform
                  time: 1795000000000
                  user_id: 11111111-1111-4111-8111-111111111111
              uyelikSilindi:
                summary: Yönetici kullanıcıyı Organization üyeliğinden çıkardı.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000002
                  kind: admin
                  type: ORGANIZATION_MEMBERSHIP_DELETE
                  realm: platform
                  time: 1795000000500
                  user_id: 11111111-1111-4111-8111-111111111111
                  organization_id: 22222222-2222-4222-8222-222222222222
              keycloakKullaniciOlayi:
                summary: Keycloak'ın kendi biçiminde bir kullanıcı olayı.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000003
                  time: 1795000000900
                  type: UPDATE_EMAIL
                  realmId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  userId: 11111111-1111-4111-8111-111111111111
              keycloakYoneticiOlayi:
                summary: Keycloak'ın kendi biçiminde bir yönetici olayı.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000004
                  time: 1795000001000
                  realmId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  operationType: UPDATE
                  resourceType: USER
                  resourcePath: users/11111111-1111-4111-8111-111111111111
      responses:
        "200":
          description: |
            Önizleme isteğinin yanıtı. Servis hiçbir kaydı değiştirmedi.
            Durum `preview`, `ignored` ya da `failed` olur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "202":
          description: Servis olayı aldı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "400":
          description: Gövde JSON değil, zorunlu alan eksik ya da `dry_run` değeri geçersiz.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            İmza yok, yanlış, süresi geçmiş ya da daha önce kullanılmış.
            Hata kodu `bad_signature` olur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/reconcile:
    post:
      operationId: runReconcile
      summary: Keycloak, Press ve kiracı kullanıcılarını karşılaştırır.
      description: |
        Bu uç mutabakat komutunun HTTP karşılığıdır. Komut `reconcile` adını taşır.
        Uç yalnız okur ve farkı raporlar. Hiçbir kaydı değiştirmez.
        Keycloak doğruluk kaynağıdır.
        Yanıt e-posta taşımaz. Kullanıcıyı `sub` kimliğiyle anar.
        Uç zamanlanmaz. Yalnız çağrılınca çalışır.
        Önizleme listesindeki ve yürütme listesindeki istemciler bu ucu çağırabilir.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-okur
      security:
        - serviceToken: []
      responses:
        "200":
          description: Fark raporu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/UpstreamFailed"
  /v1/dead-letters:
    get:
      operationId: listDeadLetters
      summary: Bekleme kuyruğundaki olayları listeler.
      description: |
        Bu uç `dead-letters` komutunun HTTP karşılığıdır.
        Uç yalnız okur. Kayıtlar e-posta taşımaz.
        Önizleme listesindeki ve yürütme listesindeki istemciler bu ucu çağırabilir.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-okur
      security:
        - serviceToken: []
      responses:
        "200":
          description: Bekleyen olaylar. En eski olay ilk sıradadır.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetterList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/dead-letters/replay:
    post:
      operationId: replayDeadLetters
      summary: Bekleme kuyruğundaki olayları bir kez yeniden işler.
      description: |
        Bu uç `replay-dead-letters` komutunun HTTP karşılığıdır.
        Bu uç yıkıcı iş yapabilir. Bekleyen olay bir kullanıcıyı kapatabilir.

        Önizleme herkese açıktır: `dry_run: true` isteğini iki listedeki istemci de gönderebilir.
        Gerçek yürütmeyi yalnız onay katmanı başlatır.
        Yürütme isteği `preview_digest` ve `approval_id` alanlarını taşımalıdır.
        Plan önizlemeden sonra değiştiyse servis 409 döner ve hiçbir olayı işlemez.

        Başarılı olay kuyruktan çıkar. Yine başarısız olan olay kuyrukta kalır.
        Servis `unknown` durumundaki olayı atlar. Çünkü aynı hedefe kör tekrar yapılmaz.
        `include_unknown: true` bu olayları da işletir. Önce hedefi denetleyin.
      x-durum: uygulandi
      x-yikici: true
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRequest"
      responses:
        "200":
          description: Her olayın sonucu. Önizlemede `preview_digest` de döner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayReport"
        "400":
          description: Gövde hatalı. Örneğin `dry_run` yok ya da yürütmede onay alanları eksik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PreviewChanged"
  /v1/tenants/{tenant}/client:
    post:
      operationId: ensureTenantClient
      summary: Kiracının `site-<kiracı>` istemcisini ve sırrını hazırlar.
      description: |
        Press bu ucu yeni site açarken çağırır (G-39, G-112).
        İşin çekirdeği kodda vardır. HTTP ucu henüz yoktur.
        Uç sır döner. Ortak sözleşmenin 10. bölümü gizli alanın dönmesini yasaklar.
        Bu yüzden uç yapay zekâ aracı olarak sunulmaz. Sırrın Press'e nasıl gideceği açık karardır.
      x-durum: planlandi
      x-yikici: false
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,39}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url]
              properties:
                base_url:
                  type: string
                  description: Kiracı sitesinin tam adresi.
      responses:
        "200":
          description: İstemci hazır.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_secret]
                properties:
                  client_id:
                    type: string
                  client_secret:
                    type: string
                    description: Yalnız bu yanıtta döner. Günlüğe yazılmaz.
  /v1/invitations:
    post:
      operationId: inviteUser
      summary: Kullanıcıyı davet eder.
      description: |
        Press bu ucu `press_tr.api.team.invite` içinden çağırır (G-16, G-79).
        Servis kullanıcı yoksa kullanıcıyı Keycloak'ta açar. Sonra kullanıcıyı Organization'a ekler.
        Sonra `execute-actions-email` ile davet e-postasını gönderir.
        E-postadaki işler UPDATE_PASSWORD ve CONFIGURE_TOTP olur.
        Bu uç kayıt silmez ve kullanıcı kapatmaz. Ama gönderilen e-posta geri alınamaz.

        Önizleme herkese açıktır: `dry_run: true` isteğini iki listedeki istemci de gönderebilir.
        Önizleme yalnız okur.
        Gerçek yürütmeyi yalnız onay katmanı başlatır.
        Yürütme isteği `preview_digest` ve `approval_id` alanlarını taşımalıdır.
        Özet isteğin alanlarını da kapsar. Bir davetin onayı başka davette geçmez.

        Uç tekrar edilebilir. İkinci çağrı ikinci kullanıcı açmaz. Ama e-postayı yeniden gönderir.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRequest"
      responses:
        "200":
          description: Davet gönderildi ya da önizleme üretildi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResult"
        "400":
          description: Gövde hatalı. Örneğin `dry_run` yok ya da yürütmede onay alanları eksik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PreviewChanged"
        "502":
          $ref: "#/components/responses/UpstreamFailed"
components:
  securitySchemes:
    webhookSignature:
      type: apiKey
      in: header
      name: X-Identity-Sync-Signature
      description: |
        Değer `sha256=<onaltılık özet>` biçimindedir.
        Özet HMAC-SHA256 ile üretilir. Anahtar `IDENTITY_SYNC_WEBHOOK_SECRET` ortam değişkenindedir.

        İmzalanan içerik üç parçadır: `<zaman damgası>.<kip>.<ham gövde>`.
        Zaman damgası `X-Identity-Sync-Timestamp` başlığındaki değerdir.
        Kip `execute` ya da `preview` olur. `dry_run=true` isteğinin kipi `preview` olur.

        Servis şu üç denetimi yapar.
        Zaman damgası servisin saatinden en çok 300 saniye farklı olabilir.
        Aynı imza yalnız bir kez geçer. İkinci kullanım 401 alır.
        Önizleme imzası yürütmede geçmez. Yürütme imzası da önizlemede geçmez.

        Gönderen aynı olayı yeniden gönderecekse yeni zaman damgasıyla yeniden imzalar.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak servis belirteci. Kurallar ortak sözleşmenin 3. bölümündedir.
        Servis belirteci ortak `oidc_verify` kitaplığıyla doğrular.
        Belirtecin `aud` değeri yalnız `identity-sync` olmalıdır.
        Belirtecin `azp` değeri iki listeden birinde olmalıdır.
        `IDENTITY_SYNC_PREVIEW_AZP` listesi okuma ve önizleme izni verir.
        `IDENTITY_SYNC_EXECUTE_AZP` listesi ayrıca yürütme izni verir.
        İki liste de boşsa servis her isteği reddeder.
        Kitaplık kurulu değilse servis yine her isteği reddeder.
        İstek çerez de taşıyorsa servis isteği reddeder.
  responses:
    Unauthorized:
      description: Servis belirteci yok ya da geçersiz. Hata kodu `unauthorized` olur.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Belirteç geçerli ama istemcinin bu işe izni yok. Hata kodu `forbidden` olur.
        Örneğin önizleme listesindeki istemci yürütme istedi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreviewChanged:
      description: |
        Plan önizlemeden sonra değişti. Hata kodu `preview_changed` olur.
        Servis hiçbir işi yürütmedi. Yeni önizleme ve yeni onay gerekir.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpstreamFailed:
      description: Keycloak, Press ya da kiracı sitesi yanıt vermedi ya da isteği reddetti.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ResourceId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,128}$"
      description: Adres yoluna giren kimlik. Yalnız harf, rakam, tire ve alt çizgi taşır.
    Event:
      type: object
      description: Servis zarfı. Kişisel veri taşımaz.
      required: [id, kind, type, realm, time]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Olayın tekil kimliği. Servis aynı kimliği ikinci kez işlemez.
        kind:
          type: string
          enum: [user, admin]
          description: |
            `user` değeri kullanıcının kendi yaptığı işi gösterir.
            `admin` değeri yöneticinin ya da Admin API'nin yaptığı işi gösterir.
        type:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Servisin işlediği türler şunlardır.
            `user` için REGISTER, VERIFY_EMAIL, UPDATE_EMAIL ve DELETE_ACCOUNT.
            `admin` için USER_CREATE, USER_UPDATE, USER_DELETE,
            ORGANIZATION_MEMBERSHIP_CREATE ve ORGANIZATION_MEMBERSHIP_DELETE.
            Servis başka türü yok sayar ve `ignored` döner.
        realm:
          type: string
          minLength: 1
          maxLength: 255
          description: Realm adı. Ayardaki realm adıyla aynı değilse servis olayı yok sayar.
        time:
          type: integer
          description: Olayın zamanı. Birim milisaniyedir.
        user_id:
          $ref: "#/components/schemas/ResourceId"
        organization_id:
          $ref: "#/components/schemas/ResourceId"
      additionalProperties: true
    KeycloakUserEvent:
      type: object
      description: |
        Keycloak'ın kullanıcı olayı gösterimi (Keycloak 26.8.2, EventRepresentation).
        Servis yalnız aşağıdaki alanları kullanır. Öteki alanları atar.
      required: [id, time, type, realmId]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        time:
          type: integer
        type:
          type: string
          minLength: 1
          maxLength: 255
        realmId:
          type: string
          description: Realm'in iç kimliği. Realm adı değildir.
        userId:
          $ref: "#/components/schemas/ResourceId"
      additionalProperties: true
    KeycloakAdminEvent:
      type: object
      description: |
        Keycloak'ın yönetici olayı gösterimi (Keycloak 26.8.2, AdminEventRepresentation).
        Servis kullanıcının ve Organization'ın kimliğini `resourcePath` alanından okur.
        `id` alanı yoksa servis olaydan kararlı bir kimlik türetir.
      required: [time, realmId, operationType, resourceType, resourcePath]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        time:
          type: integer
        realmId:
          type: string
          description: Realm'in iç kimliği. Realm adı değildir.
        operationType:
          type: string
          minLength: 1
        resourceType:
          type: string
          minLength: 1
        resourcePath:
          type: string
          description: Örneğin `users/<kullanıcı>` ya da `organizations/<kuruluş>/members/<kullanıcı>`.
      additionalProperties: true
    EventResult:
      type: object
      required: [status, actions]
      properties:
        status:
          type: string
          enum: [processed, duplicate, ignored, dead_lettered, unknown, preview, failed]
          description: |
            `processed` değeri bütün eylemlerin kesin başarıyla bittiğini gösterir.
            `duplicate` değeri olayın daha önce işlendiğini gösterir.
            `ignored` değeri servisin bu olay türünü ya da realm'i işlemediğini gösterir.
            `dead_lettered` değeri olayın bekleme kuyruğuna girdiğini gösterir.
            Kuyruğa girmek başarı değildir. Servis yine de bütün adımları dener.
            Örneğin Press yanıt vermese de kullanıcı kiracılarda kapanır.
            `unknown` değeri bir hedefin kesin başarı yanıtı vermediğini gösterir.
            Olay kuyrukta `unknown` durumuyla bekler. Servis olayı işlenmiş saymaz.
            Yeniden işleme yanıtında `unknown` değeri olayın atlandığını gösterir.
            `preview` değeri yalnız önizleme üretildiğini gösterir.
            `failed` değeri önizlemenin üretilemediğini gösterir. Örneğin Keycloak yanıt vermedi.
        actions:
          type: array
          description: Kesin başarıyla biten eylemlerin adları.
          items:
            type: string
        previews:
          type: array
          description: Yalnız `preview` durumunda döner.
          items:
            $ref: "#/components/schemas/Preview"
    Preview:
      type: object
      description: Bir yazma işinin önizlemesi. E-posta ve sır taşımaz.
      required: [operation, target, summary, destructive]
      properties:
        operation:
          type: string
          description: İşin adı.
          enum:
            - keycloak.ensure_organization
            - keycloak.create_organization
            - keycloak.add_organization_member
            - keycloak.create_user
            - keycloak.send_execute_actions_email
            - keycloak.create_site_client
            - press.ensure_team
            - press.remove_team_member
            - tenant.provision
            - tenant.set_enabled
            - tenant.change_email
        target:
          type: string
          description: İşin hedefi. Örneğin kiracının adı.
        summary:
          type: string
          description: İşi anlatan İngilizce cümle. Kullanıcıyı `sub` kimliğiyle anar.
        destructive:
          type: boolean
          description: |
            İş yıkıcıysa doğrudur.
            `press.remove_team_member` her zaman yıkıcıdır.
            `tenant.set_enabled` kullanıcıyı kapatıyorsa yıkıcıdır.
    PreviewDigest:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: |
        Önizlemenin SHA-256 özeti. Onay bu özete bağlanır.
        Yürütme isteği aynı özeti taşımalıdır.
    ApprovalId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,128}$"
      description: |
        Onay katmanındaki onay kaydının kimliği.
        Servis bu değeri işlem günlüğüne yazar. Değerin geçerliliğini onay katmanı denetler.
    DeadLetter:
      type: object
      required: [event, error, state, attempts, first_failed_at, last_failed_at]
      properties:
        event:
          $ref: "#/components/schemas/Event"
        error:
          type: string
          description: |
            Başarısız adımlar ve durum kodları. Adımlar noktalı virgülle ayrılır.
            Yanıt gövdesi saklanmaz. Örnek: `tenant.provision kiraci1: HTTP 503`.
        state:
          type: string
          enum: [failed, unknown]
          description: |
            `failed` değeri hedefin işi reddettiğini ya da ulaşılamadığını gösterir.
            `unknown` değeri işin bitip bitmediğinin bilinmediğini gösterir.
        attempts:
          type: integer
          description: Olayın kaç kez başarısız olduğu.
        first_failed_at:
          type: number
          description: İlk hatanın zamanı. Birim saniyedir (Unix zamanı).
        last_failed_at:
          type: number
          description: Son hatanın zamanı. Birim saniyedir (Unix zamanı).
    DeadLetterList:
      type: object
      required: [dead_letters]
      properties:
        dead_letters:
          type: array
          items:
            $ref: "#/components/schemas/DeadLetter"
    ReplayRequest:
      type: object
      required: [dry_run]
      properties:
        dry_run:
          type: boolean
          description: Doğruysa servis yalnız önizleme üretir. Çağıran bu alanı açıkça yazmalıdır.
        include_unknown:
          type: boolean
          description: |
            Doğruysa servis `unknown` durumundaki olayları da işler.
            Varsayılan değer yanlıştır.
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        approval_id:
          $ref: "#/components/schemas/ApprovalId"
    ReplayReport:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReplayResult"
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
    ReplayResult:
      type: object
      required: [event_id, status, actions]
      properties:
        event_id:
          type: string
        status:
          type: string
          enum: [processed, duplicate, ignored, dead_lettered, unknown, preview, failed]
        actions:
          type: array
          items:
            type: string
        previews:
          type: array
          items:
            $ref: "#/components/schemas/Preview"
    InvitationRequest:
      type: object
      required: [email, organization_id, dry_run]
      properties:
        email:
          type: string
          maxLength: 254
          pattern: "^[^@\\s]{1,64}@[^@\\s]{1,189}$"
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        organization_id:
          $ref: "#/components/schemas/ResourceId"
        dry_run:
          type: boolean
          description: Doğruysa servis yalnız önizleme üretir. Çağıran bu alanı açıkça yazmalıdır.
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        approval_id:
          $ref: "#/components/schemas/ApprovalId"
    InvitationResult:
      type: object
      required: [subject, previews]
      properties:
        subject:
          type: [string, "null"]
          description: |
            Kullanıcının Keycloak kimliği (`sub`).
            Önizlemede kullanıcı henüz yoksa değer boştur.
        previews:
          type: array
          items:
            $ref: "#/components/schemas/Preview"
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
    ReconcileReport:
      type: object
      required: [count, differences]
      properties:
        count:
          type: integer
        differences:
          type: array
          items:
            $ref: "#/components/schemas/Difference"
    Difference:
      type: object
      required: [target, subject, kind]
      properties:
        target:
          type: string
          description: Farkın görüldüğü yer. Değer `press` ya da kiracının adıdır.
        subject:
          type: string
          description: Kullanıcının Keycloak kimliği (`sub`).
        kind:
          type: string
          enum: [missing, unexpected, email_mismatch, disabled]
          description: |
            `missing` değeri kullanıcının hedefte olmadığını gösterir.
            `unexpected` değeri hedefte açık ama Keycloak'a göre beklenmeyen kaydı gösterir.
            `email_mismatch` değeri e-postanın farklı olduğunu gösterir.
            `disabled` değeri beklenen kullanıcının hedefte kapalı olduğunu gösterir.
    EnsureTeamResult:
      type: object
      description: |
        `press_tr.api.identity.ensure_team` ucundan beklenen kesin başarı yanıtı.
        Bu şema bu servisin ucu değildir. Servisin Press'ten beklediği yanıttır.
        Kaynak: ortak sözleşmenin “Kuruluş ile takım eşlemesi” bölümü.
      required: [message]
      properties:
        message:
          type: object
          required: [team, created]
          properties:
            team:
              type: string
              minLength: 1
              description: Press'teki takımın adı.
            created:
              type: boolean
              description: Takım bu istekte açıldıysa doğrudur.
          additionalProperties: true
    TargetWriteResult:
      type: object
      description: |
        `remove_team_member`, `provision`, `set_enabled` ve `change_email` uçlarından beklenen yanıt.
        Hedef bu yanıtı işi bitirdikten sonra HTTP 200 ile döner.
        Bu şema bu servisin ucu değildir. Servisin hedeften beklediği yanıttır.
      required: [message]
      properties:
        message:
          type: object
          required: [status]
          properties:
            status:
              type: string
              const: done
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - bad_request
            - bad_signature
            - unauthorized
            - forbidden
            - preview_changed
            - too_large
            - not_found
            - method_not_allowed
            - storage_failed
            - upstream_failed
