openapi: 3.1.0
info:
  title: identity_sync
  version: 0.6.0
  summary: Kullanıcı eşitleme servisinin uçları
  description: |
    Bu servis Keycloak'taki kullanıcı değişikliklerini Press'e ve kiracı sitelerine taşır (G-81).

    Servis olayı alır. Sonra kullanıcının güncel durumunu Keycloak'tan okur.
    Eylemleri bu güncel duruma göre seçer. Bu yüzden aynı olay iki kez gelse de sonuç değişmez.

    ## Uçların işaretleri

    `x-durum` alanı ucun kodda olup olmadığını söyler.
    `uygulandi` değeri ucun kodda olduğunu gösterir.
    `planlandi` değeri ucun henüz yazılmadığını gösterir.

    `x-yikici` alanı ucun yıkıcı iş yapıp yapamadığını söyler.
    Yıkıcı iş, kullanıcıyı kapatan ya da üyeliği kaldıran iştir.
    Hiçbir uç ücretli iş yapmaz.

    `x-yurutme` alanı ucu kimin yürütebildiğini söyler.
    `yalniz-onay-katmani` değeri şunu söyler: gerçek yürütmeyi yalnız onay katmanı başlatır.
    `otomatik` değeri ucun insan onayı istemediğini söyler. Örneğin olay ucu böyledir.
    `yalniz-okur` değeri ucun hiçbir kaydı değiştirmediğini söyler.

    ## Yapay zekâ ve insan onayı

    Kurallar `docs/sozlesmeler.md` dosyasının 10. bölümündedir.

    Yapay zekâ bu servisin yazma uçlarını doğrudan yürütemez.
    Yapay zekâ aracısı yalnız okur ve önizleme ister. Önizleme hiçbir kaydı değiştirmez.
    Gerçek yürütme yalnız `platform_core` içindeki onay katmanından gelir.
    Onay katmanı insan onayladıktan sonra kendi servis belirteciyle çağırır.

    Akış şudur:

    1. Aracı ya da onay katmanı ucu `dry_run: true` ile çağırır.
    2. Servis çalışacak işleri ve bir `preview_digest` değeri döner.
    3. Onay katmanı işleri insana gösterir. Onay bu özete bağlanır.
    4. İnsan onaylar. Onay katmanı ucu `dry_run: false` ile çağırır.
    5. İstek `preview_digest` ve `approval_id` alanlarını taşır.
    6. Servis onay kimliğini tek kullanımlık olarak kaydeder. Bu kayıt ilk dış yazmadan önce yazılır.
       Aynı `approval_id` ikinci kez gelirse servis 409 ve `approval_used` döner.
    7. Servis planı yeniden hesaplar. Özet tutmazsa 409 ve `preview_changed` döner.
    8. Servis çağıranı, onay kimliğini, özeti ve sonucu günlüğe yazar.

    Özet yazılacak her şeyi kapsar: her işin adını, hedefini ve bütün alan değerlerini.
    Örneğin e-posta ya da ad önizlemeden sonra değişirse özet tutmaz.
    Özet anahtarlı bir karma değerdir: HMAC-SHA256. Anahtar `IDENTITY_SYNC_DIGEST_KEY` ortam sırrındadır.
    Anahtarı yalnız servis bilir. Bu yüzden özeti gören biri bir e-posta tahminini özetle karşılaştıramaz.
    Günlükteki özet de aynı anahtarlı değerdir. Önizleme metni e-posta ve ad taşımaz.
    Özet, kuruluş açan ya da kuruluşa üye ekleyen işte kuruluşun gerçek Keycloak kimliğini de kapsar.
    Servis kuruluşu plan sırasında arar. Yürütmede yeniden aramaz.
    Kuruluş önizlemeden sonra oluştuysa ya da başka bir kuruluş bulunduysa özet tutmaz.

    Bir istek birden çok olay kapsayabilir. Herhangi bir olayın planı değiştiyse bütün istek 409 döner.
    Servis o istekte hiçbir olayı yazmaz.
    Servis yürütme anında planı bir kez daha hesaplar. Plan birebir aynı değilse iş yürümez.

    Servis iki istemci listesi tutar.
    `IDENTITY_SYNC_PREVIEW_AZP` listesindeki istemci yalnız okur ve önizler.
    `IDENTITY_SYNC_EXECUTE_AZP` listesindeki istemci yürütebilir.
    Yürütme listesine yalnız güvenilir servis istemcisi girer.
    Aracı belirteci ve model kimliği bu listeye girmez.
    Güven sınırı şudur: yürütmeyi yalnız onay katmanının istemcisi çağırabilir.
    Bu servis onay vermez. Onayın süresini onay katmanı denetler.
    Onay kimliği ilk kullanıldığı özete bağlıdır ve bir daha kullanılamaz.
    Plan değiştiği için reddedilen istek de onayı tüketir. Yeni plan yeni onay ister.

    ## Hesap silme ve kapalı hesap

    Hesap silme akışının kaynağı ortak sözleşmenin 7. bölümü ve proje kaydının O-27 kararıdır.
    Akış beş adımdır ve sırası sabittir.

    1. Servis Keycloak kullanıcısını kapatır ve oturumlarını sonlandırır.
    2. Servis Press'e `all_organizations: true` isteği gönderir. Press kullanıcıyı kapatır ve API anahtarlarını geçersiz yapar.
    3. Servis kullanıcıyı her kiracıda kapatır. Sonra telefon kurulumlarını ve bildirim bağlarını sildirir.
    4. Servis kişiyi gösteren alanları Press'te ve her kiracıda anonim yaptırır. İş kayıtları silinmez.
    5. Servis Keycloak kullanıcısını siler.

    Her adım tekrar edilebilir. Bir adım başarısız olursa istek bekleme kuyruğuna girer.
    Önceki adımlardan biri başarısızsa servis 5. adımı atlar. Yani Keycloak kullanıcısını silmez.
    İnsan isteği `POST /v1/dead-letters/replay` ucuyla yeniden işletir.
    İş bitince servisin kaydında yalnız isteğin kimliği kalır. Kayıt e-posta taşımaz.
    Servis kullanıcıyı `sub` kimliğiyle işler. E-postayı hiç saklamaz.

    Keycloak'ın `DELETE_ACCOUNT` olayı da aynı akışı başlatır.
    O durumda kullanıcı Keycloak'ta zaten silinmiştir. 1. ve 5. adım iş yapmaz.

    Keycloak'ta kapatılan kullanıcı için servis telefon kurulumlarını da iptal ettirir.
    Bu iş kapatma planının parçasıdır.

    3. ve 4. adım kiracıda ve Press'te üç yeni uç ister. Bu uçlar o sözleşmelerde henüz yoktur.
    Adları `platform_core.api.identity.revoke_installations`,
    `platform_core.api.identity.anonymize` ve `press_tr.api.identity.anonymize` olur.
    Beklenen yanıtlar bu dosyanın sonundaki `Target` şemalarındadır.
    Bu uçlar gelene kadar o adımlar başarısız olur ve istek bekleme kuyruğunda kalır.

    ## Bütün uçların ortak hataları

    Bu hatalar her uçta ayrıca yazılmadı.
    Bilinmeyen yol 404 ve `not_found` döner.
    Yanlış yöntem 405 ve `method_not_allowed` döner.
    65.536 bayttan büyük gövde 413 ve `too_large` döner.
    Geçersiz `Content-Length` başlığı da 413 döner. Servis parçalı gövdeyi desteklemez.
    Kayıt dosyası hatası 500 ve `storage_failed` döner.
    Başka bir süreç bir olayı işliyorsa servis en çok 10 saniye bekler.
    Süre dolarsa servis 503 ve `busy` döner. Çağıran isteği yeniden göndermelidir.
    Olay ucunda yeniden gönderim yeni zaman damgası ve yeni imza ister.
    Başlığını ve gövdesini 10 saniyede tamamlamayan isteğin bağlantısı kapanır.

    ## Hedef uçların kesin başarı yanıtı

    Servis Press'in ve kiracının yazma uçlarını çağırır.
    Bu uçlar `press_tr.api.identity.*` ve `platform_core.api.identity.*` adlarını taşır.
    Bu uçların sözleşmeleri `contracts/press_tr.openapi.yaml` (0.1.0) ve
    `contracts/platform_core-kimlik.openapi.yaml` (0.2.0) dosyalarındadır.
    Servis yalnız şu yanıtı başarı sayar: HTTP 200 ve o ucun sonuç şemasına uyan gövde.
    Şemalar bu dosyanın sonundadır ve `Target` ile başlar.
    Servis yanıttaki son durumu istediği durumla da karşılaştırır.
    Örneğin kullanıcıyı kapattıysa yanıtta `enabled` yanlış olmalıdır.
    Hedef işi yanıt vermeden önce bitirmiş olmalıdır.
    202, boş gövde ya da şemaya uymayan gövde başarı değildir.

    Kiracı bağı olmayan kullanıcı için 404 ve `IdentityNotFound` döner.
    Servis bu yanıtı iki işte başarı sayar: kullanıcıyı kapatma ve e-postayı değiştirme.
    Çünkü bağ yoksa kapatılacak ya da adı değişecek kayıt yoktur.
    `exc_type` alanı `IdentityNotFound` değilse 404 bir hatadır. Yanlış adres de 404 döner.

    Servis kiracıda önce `change_email`, sonra `provision` çağırır.
    Çünkü kiracı, bağ eski e-postayı gösterirken `provision` isteğini `EmailMismatch` ile reddeder.
    Servis böyle bir olayı `unknown` durumuyla bekleme kuyruğuna yazar.
    Servis bu olayı işlenmiş saymaz ve kendiliğinden yeniden denemez.
    Aynı olay yeniden gelirse servis yazmayı tekrarlamaz ve yine `unknown` döner.
    İnsan hedefi denetler. Sonra olayı `include_unknown` seçeneğiyle yeniden işletir.
    İstek hedefe gitti ama yanıt okunamadıysa sonuç yine `unknown` olur.
    502 ve 504 yanıtları da `unknown` sayılır. Çünkü aradaki sunucu isteği iletmiş olabilir.
    Bağlantı hiç kurulamadıysa sonuç `unknown` değildir. Servis bu durumda yeniden dener.

    ## Yarıda kalan iş

    Servis kabul ettiği olayı işe başlamadan önce bekleme kuyruğuna yazar.
    Bu kayıt `failed` durumundadır ve deneme sayısı 0 olur.
    Servis ilk dış yazmadan hemen önce kaydı `unknown` yapar.
    Süreç yarıda durursa kayıt kuyrukta kalır.
    Yazma başlamadıysa olay elle yeniden işlenir.
    Yazma başladıysa sonuç bilinmez. İnsan hedefi denetler ve `include_unknown` ile yeniden işletir.
    Olay başarıyla bitince kayıt kuyruktan çıkar.

    ## Kapalı ve silinen hesap

    Keycloak'ta kapatılan ya da silinen kullanıcı her yerde kapanır.
    Bu plan üyelik listesine ve Organization kaydına bağlı değildir.
    O okumalar başarısız olsa da servis kapatma isteklerini gönderir.
    Servis Press'e tek bir `all_organizations: true` isteği gönderir.
    Press o zaman kullanıcıyı kapatır ve API anahtarlarını geçersiz yapar.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:{port}
    description: Geliştirme ortamı. Port, `PANE_PORT` değerinin 5 fazlasıdır.
    variables:
      port:
        default: "6115"
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Servisin ayakta olduğunu söyler.
      description: Bu uç yalnız okur. Kimlik istemez. Kişisel veri dönmez.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-okur
      security: []
      responses:
        "200":
          description: Servis ayakta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/events:
    post:
      operationId: postEvent
      summary: Bir Keycloak olayını alır ve işler.
      description: |
        Olay kaynağı Keycloak'a kurulan olay dinleyici eklentisidir (`docs/sozlesmeler.md`, 7. bölüm).
        Eklentiyi kimlik-realm işi kurar. Eklenti kullanıcı ve yönetim olaylarını imzalı olarak bu uca gönderir.
        Bizim işlemlerimiz de bu ucu çağırabilir.
        Olay kaybolabilir. Yedek yol elle başlatılan mutabakattır. O uç `/v1/reconcile` adresidir.

        Servis olayı aynı istekte işler. Eylem başarısız olursa olay bekleme kuyruğuna girer.
        Bu durumda yanıt yine 202 olur. Çünkü olayı artık servis saklar.

        Bu uç yıkıcı iş yapabilir. Örneğin kullanıcı Keycloak'ta kapatıldıysa
        servis kullanıcıyı bütün kiracılarda kapatır ve Press üyeliğini kaldırır.
        Bu uç insan onayı istemez. Çünkü olay Keycloak'ta zaten olmuş bir değişikliği taşır.

        Servis eylemi olayın içeriğinden seçmez. Kullanıcının Keycloak'taki güncel durumundan seçer.

        Gövde iki biçimden biri olabilir.
        Birinci biçim servis zarfıdır. Şeması `Event` adını taşır.
        İkinci biçim Keycloak'ın kendi olay biçimidir.
        Şemaları `KeycloakUserEvent` ve `KeycloakAdminEvent` adını taşır.

        Keycloak `realmId` alanına realm'in iç kimliğini yazar. Realm adını yazmaz.
        Servis bu kimliği `IDENTITY_SYNC_REALM_ID` ayarıyla karşılaştırır.
        Kimlik tutmazsa servis olayı yok sayar. Ayar boşsa servis Keycloak biçimini 400 ile reddeder.

        Bir istisna vardır. Keycloak 26.8.2 üye ekleme olayında kullanıcının kimliğini vermez.
        Servis Keycloak biçimindeki bu olayı işleyemez ve `ignored` döner.
        Üye eklemeyi bildirmek için zarfı `user_id` alanıyla gönderin.
      x-durum: uygulandi
      x-yikici: true
      x-yurutme: otomatik
      security:
        - webhookSignature: []
      parameters:
        - name: dry_run
          in: query
          required: false
          description: |
            Değer `true` ise servis hiçbir kaydı değiştirmez.
            Servis yalnız çalışacak işlerin önizlemesini döner. Yanıt kodu 200 olur.
            Parametre yoksa değer `false` sayılır.
            Başka değer ya da yinelenen parametre 400 döner. Servis o isteği yürütmez.
            İmza bu seçimi kapsar. Önizleme imzası yürütmede geçmez.
          schema:
            type: string
            enum: ["true", "false"]
        - name: X-Identity-Sync-Timestamp
          in: header
          required: true
          description: İmzanın üretildiği an. Birim saniyedir (Unix zamanı).
          schema:
            type: string
            pattern: "^[0-9]{1,12}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/Event"
                - $ref: "#/components/schemas/KeycloakUserEvent"
                - $ref: "#/components/schemas/KeycloakAdminEvent"
            examples:
              epostaDogrulandi:
                summary: Kullanıcı e-postasını doğruladı.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000001
                  kind: user
                  type: VERIFY_EMAIL
                  realm: platform
                  time: 1795000000000
                  user_id: 11111111-1111-4111-8111-111111111111
              uyelikSilindi:
                summary: Yönetici kullanıcıyı Organization üyeliğinden çıkardı.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000002
                  kind: admin
                  type: ORGANIZATION_MEMBERSHIP_DELETE
                  realm: platform
                  time: 1795000000500
                  user_id: 11111111-1111-4111-8111-111111111111
                  organization_id: 22222222-2222-4222-8222-222222222222
              keycloakKullaniciOlayi:
                summary: Keycloak'ın kendi biçiminde bir kullanıcı olayı.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000003
                  time: 1795000000900
                  type: UPDATE_EMAIL
                  realmId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  userId: 11111111-1111-4111-8111-111111111111
              keycloakYoneticiOlayi:
                summary: Keycloak'ın kendi biçiminde bir yönetici olayı.
                value:
                  id: 5f0c1f6e-0000-4000-8000-000000000004
                  time: 1795000001000
                  realmId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  operationType: UPDATE
                  resourceType: USER
                  resourcePath: users/11111111-1111-4111-8111-111111111111
      responses:
        "200":
          description: |
            Önizleme isteğinin yanıtı. Servis hiçbir kaydı değiştirmedi.
            Durum `preview`, `ignored` ya da `failed` olur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "202":
          description: Servis olayı aldı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "400":
          description: Gövde JSON değil, zorunlu alan eksik ya da `dry_run` değeri geçersiz.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            İmza yok, yanlış, süresi geçmiş ya da daha önce kullanılmış.
            Hata kodu `bad_signature` olur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/reconcile:
    post:
      operationId: runReconcile
      summary: Keycloak, Press ve kiracı kullanıcılarını karşılaştırır ve farkı düzeltir.
      description: |
        Bu uç mutabakat komutunun HTTP karşılığıdır. Komut `reconcile` adını taşır.
        Uç zamanlanmaz. Yalnız çağrılınca çalışır.
        Keycloak doğruluk kaynağıdır.

        Önizleme isteği `dry_run: true` taşır. Servis yalnız okur.
        Yanıt farkları, düzeltme işlerinin önizlemesini ve `preview_digest` değerini taşır.
        Yanıt e-posta taşımaz. Kullanıcıyı `sub` kimliğiyle anar.
        Önizleme listesindeki ve yürütme listesindeki istemciler önizleme isteyebilir.

        Düzeltme isteği `dry_run: false` taşır. Düzeltmeyi yalnız onay katmanı başlatır.
        İstek `preview_digest` ve `approval_id` alanlarını taşımalıdır.
        Servis planı iş kilidi altında yeniden hesaplar.
        Plan onaylanan planla birebir aynı değilse servis 409 döner ve hiçbir şey yazmaz.
        Bu uç yıkıcı iş yapabilir. Örneğin Keycloak'ta kapalı kullanıcıyı kiracıda kapatır.

        Servis her işi dener ve her işin sonucunu ayrı bildirir.
        Sonuç `done`, `failed` ya da `unknown` olur. Belirsiz sonuç yeniden denenmez.
        Kalan fark bir sonraki önizlemede yine görünür.

        Bazı farkların güvenli bir düzeltmesi yoktur. Servis bunları yalnız raporlar.
        Örnekler şunlardır: Press'te kapalı kullanıcı, Press'teki farklı e-posta,
        doğrulanmamış e-posta ve başka kimlik sunucusunun kaydı.

        Servis karşılaştırma için Press'ten ve kiracıdan kullanıcı listesi ister.
        Bu uçların adı `press_tr.api.identity.list_identities` ve
        `platform_core.api.identity.list_identities` olur. Yanıt `TargetIdentityList` şemasındadır.
        Bu iki uç Press'in ve kiracının sözleşmelerinde henüz yoktur.
      x-durum: uygulandi
      x-yikici: true
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileRequest"
      responses:
        "200":
          description: |
            Önizlemede fark raporu ve düzeltme önizlemesi döner.
            Düzeltmede farklar ve her işin sonucu döner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileReport"
        "400":
          description: Gövde hatalı. Örneğin `dry_run` yok ya da düzeltmede onay alanları eksik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PreviewChanged"
        "502":
          $ref: "#/components/responses/UpstreamFailed"
  /v1/dead-letters:
    get:
      operationId: listDeadLetters
      summary: Bekleme kuyruğundaki olayları listeler.
      description: |
        Bu uç `dead-letters` komutunun HTTP karşılığıdır.
        Uç yalnız okur. Kayıtlar e-posta taşımaz.
        Önizleme listesindeki ve yürütme listesindeki istemciler bu ucu çağırabilir.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-okur
      security:
        - serviceToken: []
      responses:
        "200":
          description: Bekleyen olaylar. En eski olay ilk sıradadır.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetterList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/dead-letters/replay:
    post:
      operationId: replayDeadLetters
      summary: Bekleme kuyruğundaki olayları bir kez yeniden işler.
      description: |
        Bu uç `replay-dead-letters` komutunun HTTP karşılığıdır.
        Bu uç yıkıcı iş yapabilir. Bekleyen olay bir kullanıcıyı kapatabilir.

        Önizleme herkese açıktır: `dry_run: true` isteğini iki listedeki istemci de gönderebilir.
        Gerçek yürütmeyi yalnız onay katmanı başlatır.
        Yürütme isteği `preview_digest` ve `approval_id` alanlarını taşımalıdır.
        Plan önizlemeden sonra değiştiyse servis 409 döner ve hiçbir olayı işlemez.

        Servis bütün isteği iş kilidi altında yürütür.
        Servis önce bütün olayların planını hesaplar ve özeti denetler.
        Herhangi bir olayın planı onaylanan plandan farklıysa servis 409 döner. Hiçbir olay yazılmaz.
        Özet tutarsa servis tam o planları yazar. Denetim ile yazma arasında yeniden okuma yapmaz.
        Önizlemesi üretilemeyen olay yürütülmez. Bu olayın sonucu `failed` olur.
        Bir olay Organization açtıysa sonraki işler yeni bir önizleme ve yeni bir onay ister.
        O olay kuyrukta kalır.

        Başarılı olay kuyruktan çıkar. Yine başarısız olan olay kuyrukta kalır.
        Servis `unknown` durumundaki olayı atlar. Çünkü aynı hedefe kör tekrar yapılmaz.
        `include_unknown: true` bu olayları da işletir. Önce hedefi denetleyin.
      x-durum: uygulandi
      x-yikici: true
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRequest"
      responses:
        "200":
          description: Her olayın sonucu. Önizlemede `preview_digest` de döner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayReport"
        "400":
          description: Gövde hatalı. Örneğin `dry_run` yok ya da yürütmede onay alanları eksik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PreviewChanged"
  /v1/operations:
    get:
      operationId: listOperations
      summary: Yarıda kalan çok adımlı işleri listeler.
      description: |
        Bu uç `operations` komutunun HTTP karşılığıdır. Uç yalnız okur.
        Davet Keycloak'a üç adımda yazar: kullanıcıyı açar, üye yapar ve e-posta gönderir.
        Servis her adımı yazmadan önce kaydeder. Adım bitince kaydı günceller.
        Süreç yarıda durursa kayıt hangi adımın belirsiz kaldığını gösterir.
        Biten işler listede görünmez. Kayıt e-posta taşımaz.
        Önizleme listesindeki ve yürütme listesindeki istemciler bu ucu çağırabilir.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-okur
      security:
        - serviceToken: []
      responses:
        "200":
          description: Yarıda kalan işler. En eski iş ilk sıradadır.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/operations/{operation_id}/resolve:
    post:
      operationId: resolveOperation
      summary: Yarıda kalan bir işi kapatır.
      description: |
        Bu uç `resolve-operation` komutunun HTTP karşılığıdır.
        İnsan önce hedefi denetler. Örneğin Keycloak'ta kullanıcının açılıp açılmadığına bakar.
        Sonra işi `completed` ya da `abandoned` sonucuyla kapatır.
        `completed` değeri işin hedefte tamamlandığını söyler. `abandoned` değeri işten vazgeçildiğini söyler.
        Bu uç yalnız servisin kendi kaydını değiştirir. Hedefe yazmaz.
        Bu ucu yalnız onay katmanı çağırabilir. Servis çağıranı ve sonucu günlüğe yazar.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      parameters:
        - name: operation_id
          in: path
          required: true
          description: İşin kimliği. Bu değer işi başlatan onayın `approval_id` değeridir.
          schema:
            $ref: "#/components/schemas/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: İş kapandı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResult"
        "400":
          description: Gövde hatalı. Örneğin `resolution` değeri geçersiz.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Bu kimlikle yarıda kalan bir iş yok. Hata kodu `not_found` olur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/revoke:
    post:
      operationId: revokeSession
      summary: Bir Keycloak oturumunu kapatır.
      description: |
        Kaynak ortak sözleşmenin 7. bölümüdür.
        Kullanıcı bir telefon kurulumunu iptal edince `platform_core` bu ucu çağırır.
        Telefon kurulumu kayıt anında belirteçteki `sid` değerini saklar. Gövde bu değeri taşır.
        Servis Keycloak Admin API ile o oturumu siler. Oturum silinince yenileme belirteci de geçersiz olur.

        Uç tekrar edilebilir. Oturum zaten kapalıysa servis yine 200 döner.
        Servis “oturum yok” yanıtını ancak realm'in yanıt verdiğini doğrulayınca başarı sayar.
        Çünkü yanlış adres de 404 döner.

        Ucu yalnız `IDENTITY_SYNC_SESSION_AZP` listesindeki istemci çağırabilir.
        Bu liste `platform_core` sitelerinin servis istemcilerini taşır.
        Önizleme ve yürütme listelerindeki istemciler bu ucu çağıramaz.
        Bu uç insan onayı istemez. Çünkü işi kullanıcının kendi iptal işlemi başlatır.
        Bu uç yıkıcıdır: kapanan oturum geri açılamaz. Kullanıcı yeniden giriş yapar.
      x-durum: uygulandi
      x-yikici: true
      x-yurutme: otomatik
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRevokeRequest"
      responses:
        "200":
          description: Oturum kapalı. Oturum bu istekten önce kapalıysa yanıt yine budur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevokeResult"
        "400":
          description: Gövde hatalı. Örneğin `sid` yok ya da geçersiz.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/UpstreamFailed"
  /v1/account-deletions:
    post:
      operationId: requestAccountDeletion
      summary: Bir hesabın silinmesini ister ve akışı yürütür.
      description: |
        Kaynak ortak sözleşmenin 7. bölümü ve proje kaydının O-27 kararıdır.
        Kullanıcı kendi hesabının silinmesini ister. Servis isteği kaydeder ve beş adımı sırayla yürütür.
        Adımlar bu dosyanın başındaki “Hesap silme ve kapalı hesap” bölümündedir.

        Bu uç yıkıcıdır ve geri alınamaz. Kullanıcı her yerde kapanır ve Keycloak'tan silinir.
        Kişiyi gösteren alanlar anonim yapılır. İş kayıtları silinmez.

        Önizleme herkese açıktır: `dry_run: true` isteğini iki listedeki istemci de gönderebilir.
        Önizleme yalnız planı döner. Hiçbir kaydı değiştirmez.
        Gerçek yürütmeyi yalnız onay katmanı başlatır.
        Yürütme isteği `preview_digest` ve `approval_id` alanlarını taşımalıdır.
        Buradaki onay, hesabın sahibinin kendi onayıdır. Onayı onay katmanı alır.

        Servis isteği işe başlamadan önce kaydeder. İsteğin kimliği `approval_id` değeridir.
        Bir adım başarısız olursa yanıt yine 200 olur ve durum `dead_lettered` ya da `unknown` olur.
        İstek o zaman bekleme kuyruğundadır. İnsan isteği `POST /v1/dead-letters/replay` ile yeniden işletir.
      x-durum: planlandi
      x-yikici: true
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequest"
      responses:
        "200":
          description: |
            Önizlemede plan ve `preview_digest` döner.
            Yürütmede isteğin sonucu döner. Durum `processed`, `dead_lettered`, `unknown` ya da `duplicate` olur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResult"
        "400":
          description: Gövde hatalı. Örneğin `dry_run` yok ya da yürütmede onay alanları eksik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PreviewChanged"
  /v1/tenants/{tenant}/client:
    post:
      operationId: ensureTenantClient
      summary: Kiracının `site-<kiracı>` istemcisini ve sırrını hazırlar.
      description: |
        Press bu ucu yeni site açarken çağırır (G-39, G-112).
        İşin çekirdeği kodda vardır. HTTP ucu henüz yoktur.
        Uç sır döner. Ortak sözleşmenin 10. bölümü gizli alanın dönmesini yasaklar.
        Bu yüzden uç yapay zekâ aracı olarak sunulmaz. Sırrın Press'e nasıl gideceği açık karardır.
      x-durum: planlandi
      x-yikici: false
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,39}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url]
              properties:
                base_url:
                  type: string
                  description: Kiracı sitesinin tam adresi.
      responses:
        "200":
          description: İstemci hazır.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_secret]
                properties:
                  client_id:
                    type: string
                  client_secret:
                    type: string
                    description: Yalnız bu yanıtta döner. Günlüğe yazılmaz.
  /v1/invitations:
    post:
      operationId: inviteUser
      summary: Kullanıcıyı davet eder.
      description: |
        Press bu ucu `press_tr.api.team.invite` içinden çağırır (G-16, G-79).
        Servis kullanıcı yoksa kullanıcıyı Keycloak'ta açar. Sonra kullanıcıyı Organization'a ekler.
        Sonra `execute-actions-email` ile davet e-postasını gönderir.
        E-postadaki işler UPDATE_PASSWORD ve CONFIGURE_TOTP olur.
        Bu uç kayıt silmez ve kullanıcı kapatmaz. Ama gönderilen e-posta geri alınamaz.

        Önizleme herkese açıktır: `dry_run: true` isteğini iki listedeki istemci de gönderebilir.
        Önizleme yalnız okur.
        Gerçek yürütmeyi yalnız onay katmanı başlatır.
        Yürütme isteği `preview_digest` ve `approval_id` alanlarını taşımalıdır.
        Özet isteğin alanlarını da kapsar. Bir davetin onayı başka davette geçmez.

        Servis yalnız onaylanan planı yürütür. Plan arada değiştiyse servis 409 döner.
        Örneğin kullanıcı önizlemeden sonra açıldıysa plan değişmiştir.
        İkinci davet ikinci kullanıcı açmaz. Ama yeni önizleme ve yeni onay ister.
        İkinci davet e-postayı yeniden gönderir.
        Davet yarıda kesilirse yeni önizleme kalan işleri gösterir.
      x-durum: uygulandi
      x-yikici: false
      x-yurutme: yalniz-onay-katmani
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRequest"
      responses:
        "200":
          description: Davet gönderildi ya da önizleme üretildi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResult"
        "400":
          description: Gövde hatalı. Örneğin `dry_run` yok ya da yürütmede onay alanları eksik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PreviewChanged"
        "502":
          $ref: "#/components/responses/UpstreamFailed"
components:
  securitySchemes:
    webhookSignature:
      type: apiKey
      in: header
      name: X-Identity-Sync-Signature
      description: |
        Değer `sha256=<onaltılık özet>` biçimindedir.
        Özet HMAC-SHA256 ile üretilir. Anahtar `IDENTITY_SYNC_WEBHOOK_SECRET` ortam değişkenindedir.

        İmzalanan içerik üç parçadır: `<zaman damgası>.<kip>.<ham gövde>`.
        Zaman damgası `X-Identity-Sync-Timestamp` başlığındaki değerdir.
        Kip `execute` ya da `preview` olur. `dry_run=true` isteğinin kipi `preview` olur.

        Servis şu üç denetimi yapar.
        Zaman damgası servisin saatinden en çok 300 saniye farklı olabilir.
        Aynı imza yalnız bir kez geçer. İkinci kullanım 401 alır.
        Önizleme imzası yürütmede geçmez. Yürütme imzası da önizlemede geçmez.

        Gönderen aynı olayı yeniden gönderecekse yeni zaman damgasıyla yeniden imzalar.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak servis belirteci. Kurallar ortak sözleşmenin 3. bölümündedir.
        Bu belirteç servise gelen isteklerin belirtecidir.
        Servisin Keycloak Admin API'ye giderken kullandığı belirteç ayrıdır.
        O belirteç `scope=admin-api kc-admin-api` ile istenir (ortak sözleşme, 2. bölüm).
        Servis hesabının Keycloak rolleri yalnız o belirtece girer.
        Roller `view-users`, `query-users`, `manage-users` ve kuruluş için gereken en az roldür.
        Kiracıya ve Press'e giden belirteç bu rolleri taşımaz.
        Servis belirteci ortak `oidc_verify` kitaplığıyla doğrular.
        Belirtecin `aud` değeri yalnız `identity-sync` olmalıdır.
        Belirtecin `azp` değeri iki listeden birinde olmalıdır.
        `IDENTITY_SYNC_PREVIEW_AZP` listesi okuma ve önizleme izni verir.
        `IDENTITY_SYNC_EXECUTE_AZP` listesi ayrıca yürütme izni verir.
        `IDENTITY_SYNC_SESSION_AZP` listesi yalnız `/v1/sessions/revoke` ucunu açar.
        Bir istemci bu listelerden yalnız birinde durabilir.
        İki liste de boşsa servis her isteği reddeder.
        Kitaplık kurulu değilse servis yine her isteği reddeder.
        İstek çerez de taşıyorsa servis isteği reddeder.
  responses:
    Unauthorized:
      description: Servis belirteci yok ya da geçersiz. Hata kodu `unauthorized` olur.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Belirteç geçerli ama istemcinin bu işe izni yok. Hata kodu `forbidden` olur.
        Örneğin önizleme listesindeki istemci yürütme istedi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreviewChanged:
      description: |
        Servis hiçbir işi yürütmedi. Yeni önizleme ve yeni onay gerekir. İki neden olabilir.
        Hata kodu `preview_changed` ise plan önizlemeden sonra değişti.
        Hata kodu `approval_used` ise bu `approval_id` daha önce kullanıldı.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpstreamFailed:
      description: Keycloak, Press ya da kiracı sitesi yanıt vermedi ya da isteği reddetti.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ResourceId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,128}$"
      description: Adres yoluna giren kimlik. Yalnız harf, rakam, tire ve alt çizgi taşır.
    Event:
      type: object
      description: Servis zarfı. Kişisel veri taşımaz.
      required: [id, kind, type, realm, time]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Olayın tekil kimliği. Servis aynı kimliği ikinci kez işlemez.
        kind:
          type: string
          enum: [user, admin]
          description: |
            `user` değeri kullanıcının kendi yaptığı işi gösterir.
            `admin` değeri yöneticinin ya da Admin API'nin yaptığı işi gösterir.
        type:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Servisin işlediği türler şunlardır.
            `user` için REGISTER, VERIFY_EMAIL, UPDATE_EMAIL ve DELETE_ACCOUNT.
            `admin` için USER_CREATE, USER_UPDATE, USER_DELETE,
            ORGANIZATION_MEMBERSHIP_CREATE ve ORGANIZATION_MEMBERSHIP_DELETE.
            Servis başka türü yok sayar ve `ignored` döner.
        realm:
          type: string
          minLength: 1
          maxLength: 255
          description: Realm adı. Ayardaki realm adıyla aynı değilse servis olayı yok sayar.
        time:
          type: integer
          description: Olayın zamanı. Birim milisaniyedir.
        user_id:
          $ref: "#/components/schemas/ResourceId"
        organization_id:
          $ref: "#/components/schemas/ResourceId"
      additionalProperties: true
    KeycloakUserEvent:
      type: object
      description: |
        Keycloak'ın kullanıcı olayı gösterimi (Keycloak 26.8.2, EventRepresentation).
        Servis yalnız aşağıdaki alanları kullanır. Öteki alanları atar.
      required: [id, time, type, realmId]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        time:
          type: integer
        type:
          type: string
          minLength: 1
          maxLength: 255
        realmId:
          type: string
          description: Realm'in iç kimliği. Realm adı değildir.
        userId:
          $ref: "#/components/schemas/ResourceId"
      additionalProperties: true
    KeycloakAdminEvent:
      type: object
      description: |
        Keycloak'ın yönetici olayı gösterimi (Keycloak 26.8.2, AdminEventRepresentation).
        Servis kullanıcının ve Organization'ın kimliğini `resourcePath` alanından okur.
        `id` alanı yoksa servis olaydan kararlı bir kimlik türetir.
      required: [time, realmId, operationType, resourceType, resourcePath]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        time:
          type: integer
        realmId:
          type: string
          description: Realm'in iç kimliği. Realm adı değildir.
        operationType:
          type: string
          minLength: 1
        resourceType:
          type: string
          minLength: 1
        resourcePath:
          type: string
          description: Örneğin `users/<kullanıcı>` ya da `organizations/<kuruluş>/members/<kullanıcı>`.
      additionalProperties: true
    EventResult:
      type: object
      required: [status, actions]
      properties:
        status:
          type: string
          enum: [processed, duplicate, ignored, dead_lettered, unknown, preview, failed]
          description: |
            `processed` değeri bütün eylemlerin kesin başarıyla bittiğini gösterir.
            `duplicate` değeri olayın daha önce işlendiğini gösterir.
            `ignored` değeri servisin bu olay türünü ya da realm'i işlemediğini gösterir.
            `dead_lettered` değeri olayın bekleme kuyruğuna girdiğini gösterir.
            Kuyruğa girmek başarı değildir. Servis yine de bütün adımları dener.
            Örneğin Press yanıt vermese de kullanıcı kiracılarda kapanır.
            `unknown` değeri bir hedefin kesin başarı yanıtı vermediğini gösterir.
            Olay kuyrukta `unknown` durumuyla bekler. Servis olayı işlenmiş saymaz.
            Yeniden işleme yanıtında `unknown` değeri olayın atlandığını gösterir.
            `preview` değeri yalnız önizleme üretildiğini gösterir.
            `failed` değeri önizlemenin üretilemediğini gösterir. Örneğin Keycloak yanıt vermedi.
        actions:
          type: array
          description: Kesin başarıyla biten eylemlerin adları.
          items:
            type: string
        previews:
          type: array
          description: Yalnız `preview` durumunda döner.
          items:
            $ref: "#/components/schemas/Preview"
        plan_digest:
          $ref: "#/components/schemas/PlanDigest"
    PlanDigest:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: |
        Yalnız `preview` durumunda döner. Bu olayın planının anahtarlı özetidir (HMAC-SHA256).
        Özet her işin adını, hedefini ve bütün alan değerlerini kapsar.
        Değer bir karmadır. E-posta ve ad bu değerden okunamaz.
    Preview:
      type: object
      description: Bir yazma işinin önizlemesi. E-posta ve sır taşımaz.
      required: [operation, target, summary, destructive]
      properties:
        operation:
          type: string
          description: İşin adı.
          enum:
            - keycloak.ensure_organization
            - keycloak.create_organization
            - keycloak.add_organization_member
            - keycloak.create_user
            - keycloak.send_execute_actions_email
            - keycloak.create_site_client
            - keycloak.disable_user
            - keycloak.delete_user
            - press.anonymize
            - tenant.revoke_installations
            - tenant.anonymize
            - press.ensure_team
            - press.remove_team_member
            - tenant.provision
            - tenant.set_enabled
            - tenant.change_email
        target:
          type: string
          description: İşin hedefi. Örneğin kiracının adı.
        summary:
          type: string
          description: İşi anlatan İngilizce cümle. Kullanıcıyı `sub` kimliğiyle anar.
        destructive:
          type: boolean
          description: |
            İş yıkıcıysa doğrudur.
            `press.remove_team_member` her zaman yıkıcıdır.
            Silinen ya da kapatılan kullanıcı için bu iş bütün takımları kapsar.
            Press o zaman kullanıcıyı da kapatır ve API anahtarlarını geçersiz yapar.
            `tenant.set_enabled` kullanıcıyı kapatıyorsa yıkıcıdır.
    PreviewDigest:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: |
        Önizlemenin anahtarlı özeti (HMAC-SHA256). Onay bu özete bağlanır.
        Yürütme isteği aynı özeti taşımalıdır.
    ApprovalId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,128}$"
      description: |
        Onay katmanındaki onay kaydının kimliği.
        Servis bu değeri işlem günlüğüne yazar. Değerin geçerliliğini onay katmanı denetler.
    DeadLetter:
      type: object
      required: [event, error, state, attempts, first_failed_at, last_failed_at]
      properties:
        event:
          $ref: "#/components/schemas/Event"
        error:
          type: string
          description: |
            Başarısız adımlar ve durum kodları. Adımlar noktalı virgülle ayrılır.
            Yanıt gövdesi saklanmaz. Örnek: `tenant.provision kiraci1: HTTP 503`.
        state:
          type: string
          enum: [failed, unknown]
          description: |
            `failed` değeri hedefin işi reddettiğini ya da ulaşılamadığını gösterir.
            Deneme sayısı 0 ise servis olayı kabul etti ama işe başlayamadan durdu.
            `unknown` değeri işin bitip bitmediğinin bilinmediğini gösterir.
            Süreç bir yazmadan sonra durduysa durum yine `unknown` olur.
        attempts:
          type: integer
          description: Olayın kaç kez başarısız olduğu.
        first_failed_at:
          type: number
          description: İlk hatanın zamanı. Birim saniyedir (Unix zamanı).
        last_failed_at:
          type: number
          description: Son hatanın zamanı. Birim saniyedir (Unix zamanı).
    DeadLetterList:
      type: object
      required: [dead_letters]
      properties:
        dead_letters:
          type: array
          items:
            $ref: "#/components/schemas/DeadLetter"
    ReplayRequest:
      description: Çağıran `dry_run` alanını açıkça yazmalıdır. İki biçimden biri geçerlidir.
      oneOf:
        - $ref: "#/components/schemas/ReplayPreviewRequest"
        - $ref: "#/components/schemas/ReplayExecuteRequest"
    ReplayPreviewRequest:
      type: object
      description: Önizleme isteği. Servis hiçbir kaydı değiştirmez.
      required: [dry_run]
      properties:
        dry_run:
          type: boolean
          const: true
        include_unknown:
          type: boolean
          description: |
            Doğruysa servis `unknown` durumundaki olayları da plana katar.
            Varsayılan değer yanlıştır.
    ReplayExecuteRequest:
      type: object
      description: Yürütme isteği. Yalnız onay katmanı gönderebilir.
      required: [dry_run, preview_digest, approval_id]
      properties:
        dry_run:
          type: boolean
          const: false
        include_unknown:
          type: boolean
          description: Önizlemedeki değerle aynı olmalıdır. Yoksa özet tutmaz.
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        approval_id:
          $ref: "#/components/schemas/ApprovalId"
    ReplayReport:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReplayResult"
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
    ReplayResult:
      type: object
      required: [event_id, status, actions]
      properties:
        event_id:
          type: string
        status:
          type: string
          enum: [processed, duplicate, ignored, dead_lettered, unknown, preview, failed]
        actions:
          type: array
          items:
            type: string
        previews:
          type: array
          items:
            $ref: "#/components/schemas/Preview"
        plan_digest:
          $ref: "#/components/schemas/PlanDigest"
    InvitationRequest:
      description: Çağıran `dry_run` alanını açıkça yazmalıdır. İki biçimden biri geçerlidir.
      oneOf:
        - $ref: "#/components/schemas/InvitationPreviewRequest"
        - $ref: "#/components/schemas/InvitationExecuteRequest"
    InvitationPreviewRequest:
      type: object
      description: Önizleme isteği. Servis yalnız okur.
      required: [email, organization_id, dry_run]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        organization_id:
          $ref: "#/components/schemas/ResourceId"
        dry_run:
          type: boolean
          const: true
    InvitationExecuteRequest:
      type: object
      description: |
        Yürütme isteği. Yalnız onay katmanı gönderebilir.
        Davet alanları önizlemedeki alanlarla aynı olmalıdır. Yoksa özet tutmaz.
      required: [email, organization_id, dry_run, preview_digest, approval_id]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        organization_id:
          $ref: "#/components/schemas/ResourceId"
        dry_run:
          type: boolean
          const: false
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        approval_id:
          $ref: "#/components/schemas/ApprovalId"
    Email:
      type: string
      maxLength: 254
      pattern: "^[^@\\s]{1,64}@[^@\\s]{1,189}$"
    InvitationResult:
      type: object
      required: [subject, previews]
      properties:
        subject:
          type: [string, "null"]
          description: |
            Kullanıcının Keycloak kimliği (`sub`).
            Önizlemede kullanıcı henüz yoksa değer boştur.
        previews:
          type: array
          items:
            $ref: "#/components/schemas/Preview"
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
    OperationList:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
    Operation:
      type: object
      description: Yarıda kalan çok adımlı bir iş. E-posta taşımaz.
      required: [operation_id, operation, organization_id, subject, state, steps]
      properties:
        operation_id:
          $ref: "#/components/schemas/ApprovalId"
        operation:
          type: string
          enum: [invite_user]
        organization_id:
          type: string
        subject:
          type: [string, "null"]
          description: Kullanıcının Keycloak kimliği. Kullanıcı henüz açılmadıysa boştur.
        state:
          type: string
          enum: [failed, unknown]
          description: |
            `failed` değeri bir adımın kesin olarak başarısız olduğunu gösterir.
            `unknown` değeri bir adımın sonucunun bilinmediğini gösterir. Örneğin süreç yazma sırasında durdu.
        steps:
          type: array
          items:
            type: object
            required: [step, status]
            properties:
              step:
                type: string
                description: Adımın adı. Örneğin `keycloak.send_execute_actions_email`.
              status:
                type: string
                enum: [pending, done, failed, unknown]
                description: |
                  `pending` değeri adımın hiç başlamadığını gösterir.
                  `done` değeri adımın bittiğini gösterir.
                  `failed` değeri Keycloak'ın adımı reddettiğini gösterir.
                  `unknown` değeri adımın başladığını ama sonucunun bilinmediğini gösterir.
    ResolveRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [completed, abandoned]
    ResolveResult:
      type: object
      required: [operation_id, state, resolution]
      properties:
        operation_id:
          $ref: "#/components/schemas/ApprovalId"
        state:
          type: string
          const: resolved
        resolution:
          type: string
          enum: [completed, abandoned]
    SessionRevokeRequest:
      type: object
      required: [sid]
      properties:
        sid:
          $ref: "#/components/schemas/ResourceId"
      additionalProperties: false
    SessionRevokeResult:
      type: object
      required: [sid, revoked]
      properties:
        sid:
          type: string
          description: Kapanan oturumun kimliği.
        revoked:
          type: boolean
          const: true
          description: Oturum artık yok.
    AccountDeletionRequest:
      description: Çağıran `dry_run` alanını açıkça yazmalıdır. İki biçimden biri geçerlidir.
      oneOf:
        - $ref: "#/components/schemas/AccountDeletionPreviewRequest"
        - $ref: "#/components/schemas/AccountDeletionExecuteRequest"
    AccountDeletionPreviewRequest:
      type: object
      description: Önizleme isteği. Servis hiçbir kaydı değiştirmez.
      required: [subject, dry_run]
      properties:
        subject:
          $ref: "#/components/schemas/ResourceId"
        dry_run:
          type: boolean
          const: true
    AccountDeletionExecuteRequest:
      type: object
      description: Yürütme isteği. Yalnız onay katmanı gönderebilir.
      required: [subject, dry_run, preview_digest, approval_id]
      properties:
        subject:
          $ref: "#/components/schemas/ResourceId"
        dry_run:
          type: boolean
          const: false
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        approval_id:
          $ref: "#/components/schemas/ApprovalId"
    AccountDeletionResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [preview, processed, dead_lettered, unknown, duplicate]
          description: |
            `preview` değeri yalnız planın döndüğünü gösterir.
            `processed` değeri beş adımın da bittiğini gösterir.
            `dead_lettered` değeri bir adımın başarısız olduğunu ve isteğin kuyrukta beklediğini gösterir.
            `unknown` değeri bir adımın sonucunun bilinmediğini gösterir.
            `duplicate` değeri bu isteğin daha önce bittiğini gösterir.
        request_id:
          $ref: "#/components/schemas/ApprovalId"
        actions:
          type: array
          description: Kesin başarıyla biten adımların adları.
          items:
            type: string
        previews:
          type: array
          description: Yalnız önizlemede döner.
          items:
            $ref: "#/components/schemas/Preview"
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
    ReconcileRequest:
      description: Çağıran `dry_run` alanını açıkça yazmalıdır. İki biçimden biri geçerlidir.
      oneOf:
        - $ref: "#/components/schemas/ReconcilePreviewRequest"
        - $ref: "#/components/schemas/ReconcileExecuteRequest"
    ReconcilePreviewRequest:
      type: object
      description: Önizleme isteği. Servis hiçbir kaydı değiştirmez.
      required: [dry_run]
      properties:
        dry_run:
          type: boolean
          const: true
    ReconcileExecuteRequest:
      type: object
      description: Düzeltme isteği. Yalnız onay katmanı gönderebilir.
      required: [dry_run, preview_digest, approval_id]
      properties:
        dry_run:
          type: boolean
          const: false
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        approval_id:
          $ref: "#/components/schemas/ApprovalId"
    ReconcileReport:
      type: object
      required: [count, differences]
      properties:
        count:
          type: integer
          description: Fark sayısı.
        differences:
          type: array
          items:
            $ref: "#/components/schemas/Difference"
        previews:
          type: array
          description: Yalnız önizlemede döner. Farkları giderecek işlerin önizlemesidir.
          items:
            $ref: "#/components/schemas/Preview"
        preview_digest:
          $ref: "#/components/schemas/PreviewDigest"
        results:
          type: array
          description: Yalnız düzeltmede döner. Her işin sonucudur.
          items:
            $ref: "#/components/schemas/RepairResult"
    RepairResult:
      type: object
      required: [operation, target, status]
      properties:
        operation:
          type: string
          description: İşin adı. Örneğin `tenant.set_enabled`.
        target:
          type: string
          description: İşin hedefi. Değer `press` ya da kiracının adıdır.
        status:
          type: string
          enum: [done, failed, unknown]
          description: |
            `done` değeri hedefin kesin başarı yanıtı verdiğini gösterir.
            `failed` değeri hedefin işi reddettiğini ya da ulaşılamadığını gösterir.
            `unknown` değeri işin bitip bitmediğinin bilinmediğini gösterir.
        error:
          type: string
          description: Başarısız adım ve durum kodu. Yanıt gövdesi taşımaz.
    Difference:
      type: object
      required: [target, subject, kind]
      properties:
        target:
          type: string
          description: Farkın görüldüğü yer. Değer `press` ya da kiracının adıdır.
        subject:
          type: string
          description: Kullanıcının Keycloak kimliği (`sub`).
        kind:
          type: string
          enum:
            - missing
            - disabled
            - email_mismatch
            - closed_in_keycloak
            - unexpected
            - unverified_in_keycloak
            - missing_team_membership
            - unexpected_team_membership
            - foreign_issuer
          description: |
            `missing` değeri kullanıcının kiracıda bağı olmadığını gösterir.
            `disabled` değeri beklenen kullanıcının hedefte kapalı olduğunu gösterir.
            `email_mismatch` değeri hedefteki e-postanın farklı olduğunu gösterir.
            `closed_in_keycloak` değeri şunu gösterir: kullanıcı Keycloak'ta kapalı ya da silinmiş, hedefte açık.
            `unexpected` değeri kullanıcının kiracıda açık olduğunu ama kiracının kuruluşuna üye olmadığını gösterir.
            `unverified_in_keycloak` değeri kullanıcının kiracıda açık ama Keycloak'taki e-postasının doğrulanmamış olduğunu gösterir.
            `missing_team_membership` değeri Press'te eksik takım üyeliğini gösterir.
            `unexpected_team_membership` değeri Press'te fazla takım üyeliğini gösterir.
            `foreign_issuer` değeri kaydın başka bir kimlik sunucusuna ait olduğunu gösterir.
        organization_id:
          type: string
          description: Yalnız takım üyeliği farklarında döner. Keycloak'taki kuruluşun kimliğidir.
    TargetIdentityList:
      type: object
      description: |
        `list_identities` uçlarından beklenen yanıt. Bu şema bu servisin ucu değildir.
        Bu uçlar Press'in ve kiracının sözleşmelerinde henüz yoktur. Bu şema bir öneridir.
      required: [message]
      properties:
        message:
          type: array
          items:
            type: object
            required: [issuer, subject, email, enabled]
            properties:
              issuer:
                type: string
              subject:
                type: string
              email:
                type: string
              enabled:
                type: boolean
              organization_ids:
                type: array
                description: Yalnız Press gönderir. Kullanıcının üye olduğu takımların kuruluş kimlikleridir.
                items:
                  type: string
    TargetEnsureTeamResult:
      type: object
      description: |
        `press_tr.api.identity.ensure_team` ucundan beklenen kesin başarı yanıtı.
        Bu şema bu servisin ucu değildir. Servisin Press'ten beklediği yanıttır.
        Kaynak `contracts/press_tr.openapi.yaml` dosyasıdır.
      required: [message]
      properties:
        message:
          type: object
          required: [team, created]
          properties:
            team:
              type: string
              minLength: 1
              description: Press'teki takımın adı.
            created:
              type: boolean
              description: Takım bu istekte açıldıysa doğrudur.
          additionalProperties: true
    TargetRemoveTeamMemberResult:
      type: object
      description: |
        `press_tr.api.identity.remove_team_member` ucundan beklenen kesin başarı yanıtı.
        Kaynak `contracts/press_tr.openapi.yaml` dosyasıdır.
      required: [message]
      properties:
        message:
          type: object
          required: [team, member]
          properties:
            team:
              type: [string, "null"]
              description: Takımın adı. Bütün takımlar için istekte ya da takım yoksa boştur.
            member:
              type: boolean
              const: false
              description: Kullanıcı artık üye değil.
          additionalProperties: true
    TargetProvisionResult:
      type: object
      description: |
        `platform_core.api.identity.provision` ucundan beklenen kesin başarı yanıtı.
        Kaynak `contracts/platform_core-kimlik.openapi.yaml` dosyasıdır.
        Servis `enabled` değerini istediği değerle de karşılaştırır.
      required: [message]
      properties:
        message:
          type: object
          required: [user, enabled, linked]
          properties:
            user:
              type: string
              minLength: 1
              description: Kullanıcının kiracıdaki adı. Bu ad e-postadır.
            enabled:
              type: boolean
            linked:
              type: boolean
              const: true
          additionalProperties: true
    TargetSetEnabledResult:
      type: object
      description: |
        `platform_core.api.identity.set_enabled` ucundan beklenen kesin başarı yanıtı.
        Kaynak `contracts/platform_core-kimlik.openapi.yaml` dosyasıdır.
        Servis `enabled` değerini istediği değerle de karşılaştırır.
      required: [message]
      properties:
        message:
          type: object
          required: [user, enabled]
          properties:
            user:
              type: string
              minLength: 1
            enabled:
              type: boolean
          additionalProperties: true
    TargetRevokeInstallationsResult:
      type: object
      description: |
        `platform_core.api.identity.revoke_installations` ucundan beklenen yanıt. Bu uç bir öneridir.
        Uç kiracının sözleşmesinde henüz yoktur.
        Uç kullanıcının bütün telefon kurulumlarını ve bildirim bağlarını siler.
        İstek `issuer` ve `subject` alanlarını taşır. Uç tekrar edilebilir olmalıdır.
        Bağ yoksa uç 404 ve `IdentityNotFound` döner. Servis bu yanıtı başarı sayar.
      required: [message]
      properties:
        message:
          type: object
          required: [revoked]
          properties:
            revoked:
              type: integer
              description: Bu istekte silinen kurulum sayısı. Kurulum kalmadıysa 0 olur.
          additionalProperties: true
    TargetAnonymizeResult:
      type: object
      description: |
        `platform_core.api.identity.anonymize` ve `press_tr.api.identity.anonymize` uçlarından beklenen yanıt.
        Bu uçlar bir öneridir. Kiracının ve Press'in sözleşmelerinde henüz yoktur.
        Uç kişiyi gösteren alanları anonim yapar. İş kayıtlarını silmez.
        İstek `issuer` ve `subject` alanlarını taşır. Uç tekrar edilebilir olmalıdır.
        Bağ yoksa uç 404 ve `IdentityNotFound` döner. Servis bu yanıtı başarı sayar.
      required: [message]
      properties:
        message:
          type: object
          required: [anonymized]
          properties:
            anonymized:
              type: boolean
              const: true
          additionalProperties: true
    TargetChangeEmailResult:
      type: object
      description: |
        `platform_core.api.identity.change_email` ucundan beklenen kesin başarı yanıtı.
        Kaynak `contracts/platform_core-kimlik.openapi.yaml` dosyasıdır.
        Servis `user` değerini gönderdiği yeni e-postayla da karşılaştırır.
      required: [message]
      properties:
        message:
          type: object
          required: [user]
          properties:
            user:
              type: string
              minLength: 1
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - bad_request
            - bad_signature
            - unauthorized
            - forbidden
            - preview_changed
            - approval_used
            - too_large
            - busy
            - not_found
            - method_not_allowed
            - storage_failed
            - upstream_failed
