openapi: 3.1.0
info:
  title: Press TR
  version: 0.1.0
paths:
  /api/method/press_tr.api.auth.get_login_url:
    post:
      operationId: getLoginUrl
      summary: Get a single-use Keycloak login URL.
      description: Starts a rate-limited browser login. A separate random value in an HttpOnly SameSite=Lax cookie binds the state record to the initiating browser for 600 seconds. HTTPS uses a Secure cookie with the __Host- prefix.
      responses:
        "200":
          description: The URL contains state, nonce and a PKCE S256 challenge.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: uri
        "429":
          description: Login URL request limit reached.
        "503":
          description: The Keycloak client or issuer is not configured.
  /api/method/press_tr.api.auth.keycloak_callback:
    get:
      operationId: completeLogin
      summary: Exchange the authorization code and open a Press session.
      description: Requires the initiating browser cookie and consumes the matching state record atomically before verifying Keycloak identity. May create a local user and a team. Does not start billing.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Signed in and redirected to the Press dashboard.
          headers:
            Location:
              schema:
                type: string
                const: /dashboard
        "403":
          description: State, token or identity binding was rejected.
        "409":
          description: A concurrent account update interrupted sign-in. Start a new login.
        "503":
          description: Keycloak configuration or verification keys are unavailable.
  /api/method/press_tr.api.keycloak_backchannel_logout:
    post:
      operationId: closeSessions
      summary: Close sessions associated with a verified Keycloak logout token.
      description: Revokes matching Press sessions and deletes their session mappings. This is destructive and does not incur charges.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token:
                  type: string
      responses:
        "200":
          description: Logout processed, including a repeated logout.
        "403":
          description: Logout token was rejected.
        "429":
          description: Rejected logout token limit reached. Valid logout notifications do not count.
        "503":
          description: Keycloak configuration or verification keys are unavailable.
  /api/method/press_tr.api.identity.ensure_team:
    post:
      operationId: ensureTeam
      summary: Ensure a Press team and membership.
      description: Identity Sync sends an email it verified in Keycloak. Press creates a team for the organization or adds the user to its existing team. This operation does not start billing.
      security:
        - identitySync: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [issuer, subject, email, email_verified, organization_id]
              properties:
                issuer:
                  type: string
                  format: uri
                subject:
                  type: string
                email:
                  type: string
                  format: email
                  description: Required for the first identity binding.
                email_verified:
                  type: boolean
                  description: Must be true for the first identity binding.
                organization_id:
                  type: string
                  description: Keycloak organization identifier.
                organization_name:
                  type: string
                  description: Display name used only when Press creates the team. The organization identifier is used if omitted.
      responses:
        "200":
          description: Press team name and whether this request created the team.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: object
                    required: [team, created]
                    properties:
                      team:
                        type: string
                      created:
                        type: boolean
        "403":
          description: Service identity or user binding was rejected.
        "409":
          description: Another request is updating this organization.
        "503":
          description: Keycloak configuration or verification keys are unavailable.
  /api/method/press_tr.api.identity.remove_team_member:
    post:
      operationId: removeTeamMember
      summary: Revoke memberships in one or all Keycloak organizations.
      description: Removes the member and their team role assignments. Bulk removal affects only mapped teams and disables the linked user and API credentials. This destructive operation preserves the user and teams. Bulk removal preserves the recorded team owner while removing their membership and access. A single-team request requires ownership transfer before removing the owner.
      security:
        - identitySync: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [issuer, subject]
              oneOf:
                - required: [organization_id]
                - required: [all_organizations]
              properties:
                issuer:
                  type: string
                  format: uri
                subject:
                  type: string
                organization_id:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: '\S'
                  description: Keycloak organization identifier.
                all_organizations:
                  type: boolean
                  const: true
                  description: Remove memberships in all teams mapped to Keycloak.
      responses:
        "200":
          description: The user has no membership in the mapped team, including on retry. The team is null for bulk removal or when no mapping exists.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: object
                    required: [team, member]
                    properties:
                      team:
                        type: [string, "null"]
                      member:
                        const: false
        "400":
          description: The request must contain exactly one valid organization selector.
        "403":
          description: Service identity or owner removal was rejected.
        "503":
          description: Keycloak configuration or verification keys are unavailable.
  /api/method/press_tr.api.maintenance.cleanup_expired_sessions:
    post:
      operationId: cleanupExpiredPressSessions
      summary: Remove expired Keycloak session mappings.
      description: A System Manager starts this maintenance operation. It deletes expired or orphaned session mappings and leaves active mappings in place.
      security:
        - deskSession: []
      responses:
        "200":
          description: Number of removed session mappings in the message object.
        "403":
          description: The caller cannot run System Manager maintenance.
components:
  securitySchemes:
    deskSession:
      type: apiKey
      in: cookie
      name: sid
      description: An authenticated System Manager session with standard Frappe CSRF protection.
    identitySync:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak access token with only press as audience and identity-sync as authorized party.
