openapi: 3.1.0
info:
  title: Press TR
  version: 0.1.0
paths:
  /api/method/press_tr.api.auth.get_login_url:
    post:
      operationId: getLoginUrl
      summary: Get a single-use Keycloak login URL.
      description: Starts a rate-limited browser login and binds it to that browser.
      responses:
        "200":
          description: The URL contains state, nonce and a PKCE S256 challenge.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: uri
        "429":
          description: Login URL request limit reached.
  /api/method/press_tr.api.auth.keycloak_callback:
    get:
      operationId: completeLogin
      summary: Exchange the authorization code and open a Press session.
      description: Validates browser state and Keycloak identity before opening a session. May create a local user and a team. Does not start billing.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Signed in and redirected to the Press dashboard.
          headers:
            Location:
              schema:
                type: string
                const: /dashboard
        "403":
          description: State, token or identity binding was rejected.
  /api/method/press_tr.api.keycloak_backchannel_logout:
    post:
      operationId: closeSessions
      summary: Close sessions associated with a verified Keycloak logout token.
      description: Revokes matching Press sessions and deletes their session mappings. This is destructive and does not incur charges.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token:
                  type: string
      responses:
        "200":
          description: Logout processed, including a repeated logout.
        "403":
          description: Logout token was rejected.
  /api/method/press_tr.api.identity.ensure_team:
    post:
      operationId: ensureTeam
      summary: Ensure a Press team and membership.
      description: Identity Sync provisions a verified user and their personal team, or adds the user to an existing team. Repeating the request returns the same team and user. This operation does not start billing.
      security:
        - identitySync: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [issuer, subject]
              properties:
                issuer:
                  type: string
                  format: uri
                subject:
                  type: string
                email:
                  type: string
                  format: email
                  description: Required for the first identity binding.
                email_verified:
                  type: boolean
                  description: Must be true for the first identity binding.
                team:
                  type: string
                  description: Existing team name. Omit to ensure the user's personal team.
      responses:
        "200":
          description: Team and user names in the message object.
        "403":
          description: Service identity or user binding was rejected.
        "404":
          description: The named team does not exist.
  /api/method/press_tr.api.identity.remove_team_member:
    post:
      operationId: removeTeamMember
      summary: Revoke a Press team membership.
      description: Removes the member and their team role assignments. This destructive operation preserves the user and the team. Team owner removal requires a separate ownership change.
      security:
        - identitySync: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [issuer, subject, team]
              properties:
                issuer:
                  type: string
                  format: uri
                subject:
                  type: string
                team:
                  type: string
      responses:
        "200":
          description: The user has no team membership, including a repeated request.
        "403":
          description: Service identity or owner removal was rejected.
components:
  securitySchemes:
    identitySync:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak access token with only press as audience and identity-sync as authorized party.
