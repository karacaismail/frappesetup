openapi: 3.1.0
info:
  title: Mobile sync
  version: 1.0.0
  description: |
    The phone sends queued operations and receives changes when connectivity returns.
    Request bodies may be up to 256 KiB. Larger requests return 413.
    The server processes up to 60 requests per account per minute. Excess requests return 429.
    The allowlist starts empty. The server rejects files.
servers:
  - url: /api/method
security:
  - mobileBearer: []
paths:
  /platform_core.api.mobile.v1_register:
    post:
      operationId: mobileV1Register
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/ContractVersion' }
      description: Links a mobile installation to the account. A revoked ID cannot be reactivated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Device' }
      responses:
        '200': { $ref: '#/components/responses/DeviceSuccess' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Throttled' }
        default: { $ref: '#/components/responses/Error' }
  /platform_core.api.mobile.v1_revoke:
    post:
      operationId: mobileV1Revoke
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/ContractVersion' }
      description: Revokes one installation or all installations for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/Device' }
                - type: object
                  additionalProperties: false
                  required: [all]
                  properties:
                    all: { const: true }
      responses:
        '200': { $ref: '#/components/responses/RevokedSuccess' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Throttled' }
        default: { $ref: '#/components/responses/Error' }
  /platform_core.api.mobile.v1_push:
    post:
      operationId: mobileV1Push
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/ContractVersion' }
      description: |
        Processes up to 20 operations in order. A failed operation rolls back the entire batch.
        The server returns the first committed result for the same operation ID and content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id, operations]
              properties:
                installation_id: { $ref: '#/components/schemas/UUID' }
                operations:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { $ref: '#/components/schemas/Operation' }
      responses:
        '200': { $ref: '#/components/responses/AppliedOperationsSuccess' }
        '409': { $ref: '#/components/responses/Error', description: The operation content changed or the record version is stale. }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Throttled' }
        default: { $ref: '#/components/responses/Error' }
  /platform_core.api.mobile.v1_pull:
    post:
      operationId: mobileV1Pull
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/ContractVersion' }
      description: Starts a full sync when no cursor is given. Subsequent calls use the returned cursor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id]
              properties:
                installation_id: { $ref: '#/components/schemas/UUID' }
                cursor: { type: string, maxLength: 2048 }
                limit: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '410': { $ref: '#/components/responses/Error', description: The cursor is invalid or expired. Start a full sync. }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Throttled' }
        default: { $ref: '#/components/responses/Error' }
  /platform_core.api.mobile.v1_cleanup:
    post:
      operationId: mobileV1Cleanup
      parameters:
        - { $ref: '#/components/parameters/AppVersion' }
        - { $ref: '#/components/parameters/ContractVersion' }
      description: Lets a site manager remove expired removal markers manually.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { $ref: '#/components/responses/CleanupResultSuccess' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Throttled' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    mobileBearer: { type: http, scheme: bearer }
  parameters:
    AppVersion:
      name: X-Mobile-App-Version
      in: header
      required: true
      schema: { type: string, pattern: '^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$' }
    ContractVersion:
      name: X-Mobile-Contract-Version
      in: header
      required: true
      schema: { type: string, const: '1' }
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Device:
      type: object
      additionalProperties: false
      required: [installation_id]
      properties:
        installation_id: { $ref: '#/components/schemas/UUID' }
    Operation:
      type: object
      additionalProperties: false
      required: [operation_id, command, record_id]
      properties:
        operation_id: { $ref: '#/components/schemas/UUID' }
        command: { type: string, minLength: 1, maxLength: 80 }
        record_id: { $ref: '#/components/schemas/UUID' }
        version: { type: string, minLength: 1, maxLength: 128, description: Record version required for updates and deletions. }
        fields: { type: object, description: Fields allowed by the command. }
    Change:
      type: object
      additionalProperties: false
      required: [record_type, record_id, kind]
      properties:
        record_type: { type: string }
        record_id: { $ref: '#/components/schemas/UUID' }
        kind: { enum: [upsert, remove] }
        version: { type: string }
        fields: { type: object }
    Revoked:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer, minimum: 0 }
    AppliedOperations:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [operation_id, status]
            properties:
              operation_id: { $ref: '#/components/schemas/UUID' }
              status: { const: applied }
    CleanupResult:
      type: object
      required: [removed]
      properties:
        removed: { type: integer, minimum: 0, maximum: 1000 }
    Error:
      type: object
      anyOf:
        - required: [code]
        - required: [exc_type]
      properties:
        code: { type: string, description: Error code returned by the mobile endpoint. }
        exc_type: { type: string, description: Error type returned when Frappe rejects a request before dispatch. }
        current: { $ref: '#/components/schemas/Change', description: The current record visible to the user. }
  responses:
    DeviceSuccess:
      description: Request completed.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { $ref: '#/components/schemas/Device' }
    RevokedSuccess:
      description: Request completed.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { $ref: '#/components/schemas/Revoked' }
    AppliedOperationsSuccess:
      description: Request completed.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { $ref: '#/components/schemas/AppliedOperations' }
    CleanupResultSuccess:
      description: Request completed.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { $ref: '#/components/schemas/CleanupResult' }
    Page:
      description: Page of records and a cursor for the next call.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: object
                required: [changes, cursor, has_more]
                properties:
                  changes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Change' } }
                  cursor: { type: string, maxLength: 2048 }
                  has_more: { type: boolean }
    Error:
      description: Request rejected.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Throttled:
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
