name: fs-press-tr
services:
  mariadb:
    image: mariadb:11.8.9@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/press_db_password
    secrets:
      - press_db_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db:/var/lib/mysql

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499

  web:
    build:
      context: ../..
      dockerfile: backend/dev/press/Dockerfile
      target: development
    working_dir: /home/frappe/benches
    command: ["sleep", "infinity"]
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      CI: "Yes"
      PRESS_WEB_PORT: ${PRESS_WEB_PORT:?Set to PANE_PORT plus 3}
      PRESS_SOCKET_PORT: ${PRESS_SOCKET_PORT:?Set to PANE_PORT plus 4}
    secrets:
      - press_db_password
      - press_admin_password
    networks:
      default:
        aliases:
          - press.localhost
    ports:
      - "127.0.0.1:${PRESS_WEB_PORT}:${PRESS_WEB_PORT}"
      - "127.0.0.1:${PRESS_SOCKET_PORT}:${PRESS_SOCKET_PORT}"
    volumes:
      - bench:/home/frappe/benches

volumes:
  db:
  bench:

secrets:
  press_db_password:
    environment: PRESS_DB_PASSWORD
  press_admin_password:
    environment: PRESS_ADMIN_PASSWORD
