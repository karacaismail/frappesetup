# Keycloak geliştirme ortamı. Sahibi kimlik-realm işidir.
# Keycloak, PostgreSQL ve Mailpit servislerini kurar.
# Gerekli ortam değişkenleri ../identity/keycloak/.env.example dosyasındadır.
# Portları PANE_PORT değişkeninden ../identity/keycloak/bin/kc-dev.sh betiği üretir.
# Keycloak container içinde de ana bilgisayardaki portu dinler. Böylece tarayıcı ve
# container'lar aynı adresi kullanır ve belirteçteki iss değeri tutar (sözleşme 9. bölüm).
# Realm dosyaları imaja derleme sırasında kopyalanır (../identity/keycloak/Dockerfile).
# Colima'nın factory profili depo klasörünü sanal makineye bağlamaz. Bu yüzden bind mount kullanılmaz.
# Realm dosyası değişince `kc-dev.sh up` imajı yeniden derler.
services:
  keycloak:
    # The tag carries the Pane port so parallel Panes do not overwrite each other's image.
    image: fs-keycloak-atonota:dev-${KC_PORT:?}
    build:
      context: ../identity/keycloak
      dockerfile: Dockerfile
      target: dev
    pull_policy: build
    command: ["start", "--import-realm"]
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: ${KC_PORT:?}
      KC_HOSTNAME: ${KC_PUBLIC_URL:?}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      # Realm dosyasındaki ${...} yer tutucuları. Keycloak bunları içe alırken ortamdan okur.
      ATONOTA_SITE_KIRACI1_URL: ${ATONOTA_SITE_KIRACI1_URL:?}
      ATONOTA_SITE_KIRACI1_SECRET: ${ATONOTA_SITE_KIRACI1_SECRET:?}
      ATONOTA_PRESS_URL: ${ATONOTA_PRESS_URL:?}
      ATONOTA_PRESS_SECRET: ${ATONOTA_PRESS_SECRET:?}
      ATONOTA_IDENTITY_SYNC_SECRET: ${ATONOTA_IDENTITY_SYNC_SECRET:?}
      ATONOTA_PRESS_SERVICE_SECRET: ${ATONOTA_PRESS_SERVICE_SECRET:?}
      ATONOTA_GOOGLE_CLIENT_ID: ${ATONOTA_GOOGLE_CLIENT_ID:?}
      ATONOTA_GOOGLE_CLIENT_SECRET: ${ATONOTA_GOOGLE_CLIENT_SECRET:?}
      ATONOTA_APPLE_CLIENT_ID: ${ATONOTA_APPLE_CLIENT_ID:?}
      ATONOTA_APPLE_TEAM_ID: ${ATONOTA_APPLE_TEAM_ID:?}
      ATONOTA_APPLE_KEY_ID: ${ATONOTA_APPLE_KEY_ID:?}
      ATONOTA_APPLE_P8_KEY: ${ATONOTA_APPLE_P8_KEY:?}
      ATONOTA_SMTP_HOST: ${ATONOTA_SMTP_HOST:?}
      ATONOTA_SMTP_PORT: ${ATONOTA_SMTP_PORT:?}
      ATONOTA_SMTP_FROM: ${ATONOTA_SMTP_FROM:?}
    ports:
      - "127.0.0.1:${KC_PORT:?}:${KC_PORT:?}"
    networks:
      default:
        aliases:
          - kimlik.localhost
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # Keycloak imajında curl yok. Resmî belge bash'in /dev/tcp yolunu önerir.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.0 200' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  keycloak-db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:?}:8025"

volumes:
  keycloak-db: {}
