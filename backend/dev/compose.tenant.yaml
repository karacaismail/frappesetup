x-tenant: &tenant
  image: fs-tenant-dev:${PANE_PORT:?Use dev/bin/compose}
  build:
    context: ..
    dockerfile: dev/Dockerfile.tenant
  working_dir: /home/frappe/frappe-bench
  volumes:
    - tenant-sites:/home/frappe/frappe-bench/sites
    - tenant-logs:/home/frappe/frappe-bench/logs
  environment:
    KIRACI_WEB_PORT: ${KIRACI_WEB_PORT:?Use dev/bin/compose}
    KIRACI_SOCKET_PORT: ${KIRACI_SOCKET_PORT:?Use dev/bin/compose}
    MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Create .env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Create .env}

services:
  tenant-db:
    image: mariadb:11.8.9@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Create .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - tenant-db:/var/lib/mysql

  tenant-redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  tenant-web:
    <<: *tenant
    command: ["bench", "serve", "--port", "${KIRACI_WEB_PORT}", "--noreload"]
    ports:
      - "127.0.0.1:${KIRACI_WEB_PORT}:${KIRACI_WEB_PORT}"
    networks:
      default:
        aliases: ["tenant1.localhost"]
    depends_on:
      - tenant-db
      - tenant-redis

  tenant-socket:
    <<: *tenant
    command: ["node", "apps/frappe/socketio.js"]
    ports:
      - "127.0.0.1:${KIRACI_SOCKET_PORT}:${KIRACI_SOCKET_PORT}"
    depends_on:
      - tenant-web

volumes:
  tenant-db:
  tenant-sites:
  tenant-logs:
