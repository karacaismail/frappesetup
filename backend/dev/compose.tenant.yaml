x-tenant: &tenant
  image: fs-tenant-dev:${FS_STACK_IMAGE_TAG:-${PANE_PORT:?Use dev/bin/compose}}
  build:
    context: ..
    dockerfile: dev/Dockerfile.tenant
  working_dir: /home/frappe/frappe-bench
  # A recreated container loses the trust that session-tls.sh adds with update-ca-certificates.
  # Each start rebuilds the CA bundle from the image bundle and the relay certificate that
  # session-tls.sh keeps in the sites volume (AJA-936). Without that file the bundle is the image bundle.
  # $$ stops Compose interpolation; the shell sees one $. The image entrypoint still runs last.
  entrypoint: ["sh", "-c", "set -eu; bundle=\"$${REQUESTS_CA_BUNDLE}\"; cat \"$${FS_SYSTEM_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}\" > \"$$bundle\"; if [ -s sites/.e2e-trust/identity-sync.crt ]; then printf '\\n' >> \"$$bundle\"; cat sites/.e2e-trust/identity-sync.crt >> \"$$bundle\"; fi; exec \"$$@\"", "fs-tenant-ca", "/usr/local/bin/entrypoint.sh"]
  volumes:
    - tenant-sites:/home/frappe/frappe-bench/sites
    - tenant-logs:/home/frappe/frappe-bench/logs
  environment:
    REQUESTS_CA_BUNDLE: /tmp/fs-tenant-ca-bundle.crt
    SSL_CERT_FILE: /tmp/fs-tenant-ca-bundle.crt
    FS_TENANT_WEB_PORT: ${FS_TENANT_WEB_PORT:?Use dev/bin/compose}
    FS_TENANT_SOCKET_PORT: ${FS_TENANT_SOCKET_PORT:?Use dev/bin/compose}
    MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Create .env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Create .env}

services:
  tenant-db:
    image: mariadb:11.8.9@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Create .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 45
    volumes:
      - tenant-db:/var/lib/mysql

  tenant-redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  tenant-web:
    <<: *tenant
    command: ["bench", "serve", "--port", "${FS_TENANT_WEB_PORT}", "--noreload"]
    ports:
      - "127.0.0.1:${FS_TENANT_WEB_PORT}:${FS_TENANT_WEB_PORT}"
    networks:
      default:
        aliases: ["tenant1.localhost"]
    depends_on:
      - tenant-db
      - tenant-redis

  tenant-socket:
    <<: *tenant
    command: ["node", "apps/frappe/socketio.js"]
    ports:
      - "127.0.0.1:${FS_TENANT_SOCKET_PORT}:${FS_TENANT_SOCKET_PORT}"
    depends_on:
      - tenant-web

volumes:
  tenant-db:
  tenant-sites:
  tenant-logs:
