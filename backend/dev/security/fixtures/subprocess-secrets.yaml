rules:
  - id: subprocess-secret-argument
    languages: [python]
    severity: ERROR
    message: "Keep secrets out of command arguments. Use the tool's protected input."
    mode: taint
    pattern-sources:
      - exact: true
        patterns:
          - pattern: $SECRET
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i)^(?:[a-z_][a-z_0-9]*\.)*(?:[a-z0-9]+_)*(?:password|secret|token|api_key|private_key|credential)$
      - exact: true
        patterns:
          - pattern-either:
              - pattern: os.environ[$KEY]
              - pattern: os.environ.get($KEY, ...)
              - pattern: os.getenv($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^["']?(?:[a-z0-9]+_)*(?:password|secret|token|api_key|private_key|credential)["']?$
    pattern-propagators:
      - pattern: $ARGS.append($VALUE)
        from: $VALUE
        to: $ARGS
      - pattern: $ARGS.extend($VALUES)
        from: $VALUES
        to: $ARGS
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: subprocess.$RUN($COMMAND, ...)
              - pattern: subprocess.$RUN(..., args=$COMMAND, ...)
          - metavariable-regex:
              metavariable: $RUN
              regex: ^(?:run|Popen|call|check_call|check_output)$
          - focus-metavariable: $COMMAND
