rules:
  - id: http-raw-response-log
    languages: [python]
    severity: ERROR
    message: "Log the status code or a fixed error code instead of the response body."
    mode: taint
    pattern-sources:
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $RESPONSE.text
              - pattern: $RESPONSE.content
              - pattern: $RESPONSE.body
              - pattern: $RESPONSE.data
              - pattern: $RESPONSE.json(...)
              - pattern: $RESPONSE.get_data(...)
              - pattern: $RESPONSE.read(...)
          - metavariable-regex:
              metavariable: $RESPONSE
              regex: ^(?:[a-zA-Z_][a-zA-Z_0-9]*\.)*(?:response|resp|reply|http_response|error_response)$
    pattern-sinks:
      - pattern: print(...)
      - pattern: frappe.log_error(...)
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $LOGGER.$LEVEL(...)
                  - metavariable-regex:
                      metavariable: $LOGGER
                      regex: (?i)^(?:[a-z_][a-z_0-9]*\.)*(?:logger|logging|log)$
              - pattern: frappe.logger(...).$LEVEL(...)
          - metavariable-regex:
              metavariable: $LEVEL
              regex: ^(?:debug|info|warning|warn|error|exception|critical|log)$
