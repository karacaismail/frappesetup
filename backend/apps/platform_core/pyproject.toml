[project]
name = "platform_core"
authors = [
    { name = "Platform", email = "noreply@example.test"}
]
description = "Platform backend modules"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pydantic~=2.12.5",
    # platform-core-kimlik: HTTP call to the Keycloak token endpoint and shared token verification.
    # requests ships with Frappe 16 (2.33.x). oidc_verify lives in backend/libs/oidc_verify and is
    # installed from there (dev images use `pip install --no-deps -e`); it is not on PyPI.
    "oidc_verify==0.1.0",
    # Large file jobs (G-156) read PDF text on the server. Frappe 16 pins pypdf 6.21.4.
    "pypdf~=6.21.4",
    "PyPika @ git+https://github.com/frappe/pypika@7ef6e40215d46cd531e8c4e58650b84c11abbd04",
    "redis~=7.1.0",
    "requests~=2.33.0",
    "urllib3>=2.2.0,<3",
    "Werkzeug~=3.1.9",
]

[tool.bench.frappe-dependencies]
frappe = ">=16.56.0,<17.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
jsonschema = "4.26.0"
PyYAML = "6.0.3"
referencing = "0.37.0"
Werkzeug = "~=3.1.9"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
    "N",
    "A",
    "PLC2401",
    "PLC2403",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
