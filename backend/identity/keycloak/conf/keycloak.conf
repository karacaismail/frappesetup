# Default Keycloak configuration of the Atonota image (prod target; the dev target inherits it).
# Merge review E1: the magic link extension's side doors are off in every deployment, not only in the
# development compose file. docs/kararlar/0003-keycloak-eklentileri.md, condition 4.
# The REST resource that creates links from outside the login flow:
spi-realm-restapi-extension--magiclink-login--enabled=false
# The cross-device variant that finishes a login in another browser:
spi-authenticator--magiclink-continuation--enabled=false
