# Atonota email messages (English, second language).
# The brand name is not written here. It comes from the realm setting as {0}.
# Messages carry no HTML tags. The layout lives in html/template.ftl.
# Do not use apostrophes. Keycloak treats them as special characters.

# Subject lines. Keycloak passes no variables to subjects.
emailVerificationSubject=Verify your email address
passwordResetSubject=Reset your password
executeActionsSubject=Update your account
magiclink-emailSubject=Your sign-in link

# Shared lines
atExpiry=This link works for {0}.
atCopyHint=If the button does not work, copy this address into your browser.
atSentBy={0} sent this email.

# Email verification
atVerifyTitle=Verify your email address
atVerifyIntro=A {0} account was created with this email address. If you created it, press the button below.
atVerifyButton=Verify your email address
atVerifyNote=If you did not create this account, ignore this email.

# Password reset
atResetTitle=Reset your password
atResetIntro=We received a request to reset the password of your {0} account. Press the button below to set a new password.
atResetButton=Set a new password
atResetNote=If you did not ask for this, ignore this email. Your password stays the same.

# Required actions (asked by an administrator)
atActionsTitle=Update your account
atActionsIntro=Your administrator asked you to do the following in your {0} account.
atActionsStart=Press the button below to start.
atActionsButton=Start
atActionsNote=If you did not expect this, ignore this email. Nothing in your account changes.
requiredAction.UPDATE_PASSWORD=Set a new password
requiredAction.CONFIGURE_TOTP=Set up the authenticator app
requiredAction.VERIFY_EMAIL=Verify your email address
requiredAction.UPDATE_PROFILE=Update your account details
requiredAction.TERMS_AND_CONDITIONS=Accept the terms of use
requiredAction.CONFIGURE_RECOVERY_AUTHN_CODES=Create your recovery codes
requiredAction.webauthn-register=Add a passkey
requiredAction.webauthn-register-passwordless=Add a passkey

# Magic link (sign-in link without a password)
atMagicTitle=Sign in
atMagicIntro=You can sign in to your {0} account without a password. Press the button below to sign in.
atMagicBrowser=Open the link in the browser where you started signing in.
atMagicButton=Sign in
atMagicExpiry=This link works for a short time and only once.
atMagicNote=If you did not ask for this, ignore this email. Nobody is signed in unless the link is opened.
