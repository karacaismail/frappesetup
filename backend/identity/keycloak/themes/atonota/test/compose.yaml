# Tema deneme ortamı. Sahibi kimlik-tema işidir.
# Bu dosya yalnız temayı sınar. Asıl Keycloak kurulumu kimlik-realm işindedir.
# Portları ve sırları bin/tema-dev.sh betiği .env dosyasına yazar.
name: fs-kimlik-tema
services:
  keycloak:
    image: fs-kimlik-tema-keycloak:dev
    build:
      context: ..
      dockerfile: test/Dockerfile
    # start-dev tema önbelleğini kapatır. Veritabanı container içindeki H2 dosyasıdır.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_PORT: ${KC_PORT:?}
      KC_HOSTNAME: ${KC_PUBLIC_URL:?}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      # Brand name. The realm display name and the account console title read this variable.
      IDENTITY_BRAND_NAME: ${IDENTITY_BRAND_NAME:?}
    ports:
      - "127.0.0.1:${KC_PORT:?}:${KC_PORT:?}"
    healthcheck:
      # Keycloak imajında curl yok. Resmî belge bash'in /dev/tcp yolunu önerir.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.0 200' <&3"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:?}:8025"
