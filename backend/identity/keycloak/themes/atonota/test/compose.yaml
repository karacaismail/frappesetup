# Theme test environment. Owned by the kimlik-tema work stream.
# This file only tests the theme. The real Keycloak setup belongs to the kimlik-realm work stream.
# The bin/theme-dev.sh script writes the ports and secrets to the .env file.
name: fs-kimlik-tema
services:
  keycloak:
    image: fs-kimlik-tema-keycloak:dev
    build:
      context: ..
      dockerfile: test/Dockerfile
    # start-dev disables the theme cache. The database is an H2 file inside the container.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_PORT: ${KC_PORT:?}
      KC_HOSTNAME: ${KC_PUBLIC_URL:?}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      # Brand name. The realm display name and the account console title read this variable.
      IDENTITY_BRAND_NAME: ${IDENTITY_BRAND_NAME:?}
      # Address of the account deletion page. The account console links to it for customers.
      IDENTITY_ACCOUNT_DELETION_URL: ${IDENTITY_ACCOUNT_DELETION_URL:?}
    ports:
      - "127.0.0.1:${KC_PORT:?}:${KC_PORT:?}"
    healthcheck:
      # The Keycloak image has no curl. The official documentation suggests bash's /dev/tcp path.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.0 200' <&3"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:?}:8025"
