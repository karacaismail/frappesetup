# Atonota account console theme.
# The console is the stock Keycloak React application (keycloak.v3). The theme changes it in two supported ways:
# - theme properties: styles, scripts, logo, favIcon, title and message bundles,
# - a small server provider selected below with "accountResourceProvider". It appends one link section to the page.
# The property names were verified in keycloak-account-ui-26.8.2.jar (index.ftl) and in Keycloak's AccountLoader.
parent=keycloak.v3

# Server side of the account console page (supported theme property, read by Keycloak's AccountLoader).
# The provider lives in ../account-provider. It adds a link to the account deletion page for customers only
# and keeps Keycloak's own delete action out of the console (project record O-27).
# The provider jar must be installed in the Keycloak server. Without it the account console answers 404.
accountResourceProvider=account-deletion-link
# Address of the account deletion page. It comes from the IDENTITY_ACCOUNT_DELETION_URL environment variable
# of the Keycloak server. The address must be an absolute https address. Plain http works for localhost only.
# An empty or unsafe address means that no link is shown.
accountDeletionUrl=${env.IDENTITY_ACCOUNT_DELETION_URL:}

styles=css/atonota-account.css
# Loaded as a module script. It manages the keyboard focus mode.
scripts=js/atonota-focus.js

# The brand name comes from the IDENTITY_BRAND_NAME environment variable of the Keycloak server.
# index.ftl writes this property into the page title. The focus script copies the title next to the brand mark.
# The fallback after the colon is a neutral word. No brand name is written in the theme.
title=${env.IDENTITY_BRAND_NAME:Account}

logo=/img/logo.svg
favIcon=/img/favicon.svg
favIconType=image/svg+xml

darkMode=true
locales=tr,en
