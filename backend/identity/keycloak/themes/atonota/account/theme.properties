# Atonota account console theme.
# Extends the stock account console (keycloak.v3) through the supported theme properties only:
# styles, scripts, logo, favIcon and message bundles. The console itself is the unmodified Keycloak React application.
# The property names were verified in keycloak-account-ui-26.8.2.jar, theme/keycloak.v3/account/index.ftl.
parent=keycloak.v3

# Server side of the account console page (supported theme property, read by Keycloak's AccountLoader).
# The provider lives in ../account-provider. It offers account deletion only to a user with the "delete-account" role.
# The provider jar must be installed in the Keycloak server. Without it the account console answers 404.
accountResourceProvider=delete-role-account

styles=css/atonota-account.css
# Loaded as a module script. It manages the keyboard focus mode.
scripts=js/atonota-focus.js

# The brand name comes from the IDENTITY_BRAND_NAME environment variable of the Keycloak server.
# index.ftl writes this property into the page title. The focus script copies the title next to the brand mark.
# The fallback after the colon is a neutral word. No brand name is written in the theme.
title=${env.IDENTITY_BRAND_NAME:Account}

logo=/img/logo.svg
favIcon=/img/favicon.svg
favIconType=image/svg+xml

darkMode=true
locales=tr,en
