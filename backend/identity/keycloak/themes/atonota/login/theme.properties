# Atonota sign-in theme. Built with Keycloak's own theme structure (project record O-4).
parent=keycloak.v2
import=common/keycloak

# The base theme's styles load first, then the Atonota tokens and rules.
styles=css/styles.css css/atonota.css
# atonota-focus.js manages the keyboard focus mode from one central place.
# atonota-form.js finds an empty field before submit and writes the error below the field (AJA-1125).
scripts=js/atonota-focus.js js/atonota-form.js

darkMode=true
locales=tr,en
