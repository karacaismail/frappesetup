# Atonota giriş teması. Keycloak'ın kendi tema yapısıyla kurulur (proje kaydı O-4).
parent=keycloak.v2
import=common/keycloak

# Önce temel temanın stili, sonra Atonota tokenları ve kuralları yüklenir.
styles=css/styles.css css/atonota.css
# atonota-focus.js klavye odak kipini tek merkezden yönetir.
# atonota-form.js boş alanı göndermeden önce bulur ve alanın altına yazar (AJA-1125).
scripts=js/atonota-focus.js js/atonota-form.js

darkMode=true
locales=tr,en
