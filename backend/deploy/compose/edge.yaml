# Edge proxy of one Hetzner server. It is the only service with public ports (80, 443).
# remote/apply runs it as project "atonota-edge". It writes one Caddy file per environment into
# /srv/atonota/edge/sites/ and reloads Caddy. Caddy gets one certificate per host name (HTTP-01).
# Each environment has its own network "atonota-edge-<env>". remote/apply writes networks.yaml beside
# this file, so Caddy joins the network of every environment on the server. Only edge-facing
# services join those networks (tenant-frontend, keycloak, press-frontend), each with an env prefix.
services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/atonota/edge/sites:/etc/caddy/sites:ro
      - /srv/atonota/web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Address for certificate expiry mail. Set in /etc/atonota/edge.env on the server.
      ATONOTA_ACME_EMAIL: ${ATONOTA_ACME_EMAIL:?set in /etc/atonota/edge.env}
volumes:
  caddy-data:
  caddy-config:
